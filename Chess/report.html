<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Chess Wrapped 2026 · First Move</title>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Familjen+Grotesk:wght@500;700&family=Playfair+Display:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#07080b;--ink:#f4f1ea;--mut:#9aa3b2;--a:#D9B75B;--sym:'Segoe UI Symbol','Noto Sans Symbols 2','Apple Symbols',sans-serif;--D:'Big Shoulders Display',Impact,'Arial Narrow',sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg)}
body{overflow:hidden;font:500 28px 'Familjen Grotesk',system-ui,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;cursor:pointer}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:50}
*{box-sizing:border-box;margin:0}
#st{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0;overflow:hidden;background:#0b0d12;--a:#D9B75B}
#bg{position:absolute;inset:0;background:repeating-conic-gradient(#ffffff0b 0 25%,transparent 0 50%) 0 0/240px 240px;animation:pan 6s linear infinite}
#gl{position:absolute;inset:0;background:radial-gradient(circle at 10% 105%,color-mix(in srgb,var(--a) 42%,transparent),transparent 55%),radial-gradient(circle at 95% -5%,color-mix(in srgb,var(--a) 22%,transparent),transparent 45%),radial-gradient(ellipse at center,transparent 50%,#000c 100%)}
.sw{position:absolute;inset:0;animation:zoom 8s linear both}
.p{position:absolute}
.D,.mt,.sc,.nm b{font-family:var(--D);font-weight:900}
.D{text-transform:uppercase;line-height:.88}
.s{font-weight:700;letter-spacing:.22em;text-transform:uppercase;font-size:28px;color:var(--mut)}
.row{display:flex;align-items:center;gap:24px}
[data-a]{animation-name:var(--an,rise);animation-duration:var(--du,.7s);animation-delay:var(--d,0s);animation-fill-mode:both;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
.w{display:inline-block;white-space:nowrap}
.ch{display:inline-block;font-style:normal;animation:drop .8s cubic-bezier(.2,.9,.2,1.1) both;animation-delay:calc(var(--d,0s) + var(--i)*45ms)}
.n{font:inherit;color:inherit}
.gp{position:absolute;right:-300px;top:380px;font:normal 1500px/1 var(--sym);color:var(--a);animation:gp 8s ease-out both;pointer-events:none}
.mq{position:absolute;left:0;white-space:nowrap;font:900 360px/1 var(--D);color:transparent;-webkit-text-stroke:2px #ffffff18;pointer-events:none}
.mq span{display:inline-block;animation:mq 26s linear infinite}
.track{height:40px;background:#ffffff10}.bar{height:100%;background:var(--a);transform-origin:0 50%;animation:grow 1s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}
.r{position:absolute;left:50px;right:50px;height:200px;display:flex;align-items:center;gap:26px;padding:0 20px;border-bottom:2px solid #ffffff1f}
.r.f{background:linear-gradient(90deg,color-mix(in srgb,var(--a) 30%,transparent),transparent);border-left:10px solid var(--a)}
.rk{position:relative;flex:none;width:110px;height:110px;display:grid;place-items:center;font:normal 82px/1 var(--sym);background:#ffffff12}
.f .rk{background:var(--a);color:#0b0d12}
.rk::after{content:attr(data-n);position:absolute;right:7px;bottom:3px;font:900 24px var(--D);opacity:.7}
.nm{flex:1;min-width:0}
.nm b{display:block;font-size:54px;line-height:.95;text-transform:uppercase}
.nm>span{display:block;margin-top:8px;font-size:24px;color:var(--mut)}
.nm u{display:inline-block;text-decoration:none;background:var(--a);color:#0b0d12;font-weight:700;letter-spacing:.06em;padding:1px 12px;margin-right:14px}.nm>span u{font-size:40px;padding:3px 20px;margin-right:18px}.rv u{font-size:26px;padding:2px 14px;vertical-align:middle}.pl small u{font-size:27px;padding:1px 12px;margin-right:10px}
.rv b{font-size:44px}.rv i{font:700 22px 'Familjen Grotesk',sans-serif;color:var(--a);font-style:normal}
.sc{flex:none;text-align:right;line-height:1;color:var(--a)}
.sc small{display:block;font:700 22px 'Familjen Grotesk',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);margin-top:4px}
.mt{display:flex;align-items:center;gap:18px;font-size:62px;line-height:1;color:var(--a)}
.mt em{font:700 26px 'Familjen Grotesk',sans-serif;font-style:normal;border:2px solid var(--a);padding:2px 12px;color:var(--ink)}
.vs{display:flex;align-items:flex-start;gap:14px;margin:8px 0 4px}.vs>i{font:700 20px 'Familjen Grotesk',sans-serif;color:var(--a);padding-top:8px;font-style:normal}
.pl{flex:1;min-width:0}.nm .pl b{font-size:36px}.pl small{display:block;font-size:22px;color:var(--mut);margin-top:4px}.pl.l{opacity:.5}
#hud{position:absolute;left:60px;right:60px;top:56px;display:flex;justify-content:space-between;font:700 20px 'Familjen Grotesk',sans-serif;letter-spacing:.25em;text-transform:uppercase;color:var(--mut);z-index:8}
#tk{position:absolute;left:60px;right:60px;bottom:86px;height:8px;background:#ffffff22;z-index:8}
#pf{display:block;height:100%;width:0;background:var(--a)}
#kn{position:absolute;left:0;bottom:8px;font:normal 64px/1 var(--sym);color:var(--a);transform:translateX(-50%)}
#fl{position:absolute;left:60px;right:60px;bottom:40px;display:flex;justify-content:space-around;font:900 26px var(--D);text-transform:uppercase;color:#ffffff40;z-index:8}#fl .on{color:var(--a)}
#mo{position:absolute;inset:0;display:grid;grid:repeat(16,1fr)/repeat(9,1fr);pointer-events:none;z-index:9}
#mo i{transform:scale(0)}#mo.go i{animation:mo .6s ease-in-out both;animation-delay:var(--d)}
#ov{position:absolute;inset:0;display:none;place-items:center;z-index:12;background:#000a;font:900 260px var(--D);color:var(--a)}#ov.on{display:grid}
#st.lt #tk{background:#00000020}#st.lt #fl{color:#00000045}#st.lt #fl .on{color:#8a5a14}#st.lt #hud{color:#6b5a44}.gd .ch{background:linear-gradient(180deg,#f6dc8a,#c58a2a 50%,#7a4e12);-webkit-background-clip:text;background-clip:text;color:transparent}.dp{display:inline-block;text-decoration:none;background:var(--a);color:#0b0d12;font-weight:700;letter-spacing:.06em;padding:3px 22px;margin-right:18px;font-size:34px}
#st.pz *{animation-play-state:paused!important}
@keyframes drop{from{opacity:0;transform:translateY(-150%) rotate(-14deg) scale(1.5)}55%{opacity:1}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(80px)}to{opacity:1;transform:none}}
@keyframes slam{0%{opacity:0;transform:scale(3.2)}55%{opacity:1;transform:scale(.93)}75%{transform:scale(1.05)}100%{opacity:1;transform:none}}
@keyframes bam{0%{opacity:0;transform:scale(1.3)}60%{opacity:1;transform:scale(.97)}100%{opacity:1;transform:none}}
@keyframes sl{from{opacity:0;transform:translateX(-700px)}to{opacity:1;transform:none}}
@keyframes sr{from{opacity:0;transform:translateX(700px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0)}}
@keyframes pop{0%{opacity:0;transform:scale(0) rotate(-90deg)}70%{transform:scale(1.35) rotate(8deg)}100%{opacity:1;transform:none}}
@keyframes mq{to{transform:translateX(-50%)}}
@keyframes pan{to{background-position:480px 240px}}
@keyframes zoom{to{transform:scale(1.04)}}
@keyframes gp{from{opacity:0;transform:scale(1.5) rotate(-25deg)}to{opacity:.09;transform:none}}
@keyframes mo{0%{transform:scale(0)}30%,70%{transform:scale(1.05)}100%{transform:scale(0)}}
@keyframes out{to{opacity:0;transform:scale(.5) translateY(-60px)}}
@keyframes ring{from{opacity:.9;transform:scale(.2)}to{opacity:0;transform:scale(3)}}
</style></head><body>

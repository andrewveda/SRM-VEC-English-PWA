<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
  <title>Syntax — Sentence Garden</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#fdf0e2; --card:#fffdf9; --card-soft:#faf1e2; --ink:#2a1f1a; --ink-muted:#8a7060;
      --center:#f0603f; --center-hover:#dd4c2f; --petal:#f0d6d2; --petal-hover:#e8bfc0;
      --stem:#4a8c5c; --stem-light:#7dbb8f; --gold:#e8a020; --shadow:rgba(74,60,50,0.12);
      --noun:#4a90d9; --verb:#4a8c5c; --adj:#9b59b6; --adv:#e67e22; --prep:#16a085; --art:#7f8c8d; --conj:#c0392b;
      --shadow-sm: 0 1px 2px rgba(74,54,40,0.05), 0 3px 8px rgba(74,54,40,0.07);
      --shadow-md: 0 1px 2px rgba(74,54,40,0.06), 0 8px 22px rgba(74,54,40,0.10);
      --shadow-lg: 0 2px 6px rgba(224,78,53,0.16), 0 16px 34px rgba(74,54,40,0.16);
      --hairline: inset 0 1px 0 rgba(255,255,255,0.7);
      --ease: cubic-bezier(.16,1,.3,1);
    }
    html, body { min-height:100%; overscroll-behavior-x:none; }
    body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--ink); min-height:100dvh; display:flex; flex-direction:column; align-items:center; overflow-x:hidden; }
    body::before { content:''; position:fixed; inset:0; background:radial-gradient(ellipse 80% 60% at 10% 20%,#fde8d880 0%,transparent 60%),radial-gradient(ellipse 60% 50% at 90% 80%,#f9c6d040 0%,transparent 60%); pointer-events:none; z-index:0; }
    .screen { display:none; flex-direction:column; align-items:center; width:100%; min-height:100dvh; position:relative; z-index:1; overflow:visible; }
    .screen.active { display:flex; }

    /* Game Screen */
    #gameScreen { align-items:stretch; }
    .game-col { display:flex; flex-direction:column; width:100%; min-height:100%; max-width:520px; margin:0 auto; padding:calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 10px); gap:clamp(8px,1.4dvh,14px); }

    .top-bar { display:flex; align-items:center; justify-content:space-between; gap:8px; flex:0 0 auto; }
    .top-actions { display:flex; align-items:center; gap:6px; flex:0 0 auto; }
    .icon-btn { flex:0 0 auto; width:clamp(32px,6dvh,40px); height:clamp(32px,6dvh,40px); border-radius:50%; border:1px solid rgba(232,216,200,0.7); background:var(--card-soft); display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:var(--shadow-sm), var(--hairline); color:var(--ink-muted); transition:all 0.18s var(--ease); }
    .icon-btn svg { width:44%; height:44%; }
    .icon-btn:hover { background:#fde3e0; color:var(--center); box-shadow:var(--shadow-md), var(--hairline); }
    .icon-btn:active { transform:scale(0.9); }
    .brand { flex:1 1 auto; text-align:center; }
    .brand h1 { font-family:'Playfair Display',serif; font-size:clamp(1.15rem,3.6dvh,1.7rem); font-weight:900; letter-spacing:-0.5px; color:var(--ink); line-height:1; }
    .brand h1 span { color:var(--center); }
    .timer-pill { flex:0 0 auto; display:flex; align-items:center; gap:6px; background:var(--card-soft); border-radius:99px; padding:3px 13px 3px 3px; box-shadow:var(--shadow-sm), var(--hairline); }
    .timer-arc-wrap { position:relative; width:clamp(28px,5.2dvh,36px); height:clamp(28px,5.2dvh,36px); flex:0 0 auto; }
    #timerArc { transform:rotate(-90deg); width:100%; height:100%; display:block; }
    .timer-text { font-family:'Playfair Display',serif; font-size:clamp(0.7rem,1.7dvh,0.86rem); font-weight:700; color:var(--ink); transition:color 0.4s; white-space:nowrap; }
    .timer-text.amber { color:var(--gold); }
    .timer-text.danger { color:var(--center); animation:timerPulse 0.6s ease-in-out infinite; }
    @keyframes timerPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.15)} }

    .stat-strip { flex:0 0 auto; background:var(--card-soft); border-radius:14px; padding:clamp(6px,1.2dvh,10px) 16px; box-shadow:var(--shadow-sm), var(--hairline); display:flex; flex-direction:column; gap:5px; }
    .stat-strip-top { display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
    .rank-name { font-family:'Playfair Display',serif; font-weight:700; font-size:clamp(0.76rem,1.8dvh,0.94rem); color:var(--center); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .stat-nums { font-size:clamp(0.6rem,1.3dvh,0.74rem); color:var(--ink-muted); white-space:nowrap; letter-spacing:0.02em; }
    .stat-nums b { font-family:'Playfair Display',serif; color:var(--stem); font-weight:700; font-size:1.55em; letter-spacing:0; margin:0 1px; }
    .rank-track { height:5px; background:#eee0cf; border-radius:99px; overflow:hidden; box-shadow:inset 0 1px 2px rgba(74,54,40,0.1); }
    .rank-fill { height:100%; background:linear-gradient(90deg,var(--stem-light),var(--center)); border-radius:99px; transition:width 0.6s var(--ease); }

    /* Sentence builder */
    .sentence-row { flex:0 0 auto; width:100%; }
    .sentence-display { width:100%; background:var(--card); border:1.5px solid rgba(232,216,200,0.8); border-radius:14px; padding:clamp(8px,1.4dvh,12px) 14px; min-height:clamp(52px,8dvh,64px); display:flex; flex-wrap:wrap; align-items:center; gap:6px; box-shadow:var(--shadow-md), var(--hairline); transition:border-color 0.2s var(--ease), box-shadow 0.2s var(--ease); }
    .sentence-display.empty { justify-content:center; color:var(--ink-muted); font-size:0.85rem; }
    .sentence-display.error { border-color:#e04e35; animation:shake 0.35s ease; }
    .sentence-display.success { border-color:var(--stem); animation:pop 0.4s var(--ease); }
    @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }
    @keyframes pop { 0%{transform:scale(1)} 45%{transform:scale(1.02)} 100%{transform:scale(1)} }
    .word-chip { display:inline-flex; align-items:center; gap:4px; padding:5px 12px; border-radius:10px; font-weight:600; font-size:0.88rem; text-transform:lowercase; cursor:pointer; user-select:none; animation:chipIn 0.25s cubic-bezier(.2,1.5,.4,1); transition:transform 0.15s; }
    .word-chip:hover { transform:translateY(-2px); }
    .word-chip:active { transform:scale(0.95); }
    .word-chip .pos-tag { font-size:0.6rem; opacity:0.7; font-weight:500; text-transform:uppercase; letter-spacing:0.04em; margin-left:2px; }
    .word-chip.noun { background:#e8f4fc; color:#2c5f8a; border:1.5px solid #bcdff5; }
    .word-chip.verb { background:#e8f5ec; color:#2c5f3f; border:1.5px solid #bce0c8; }
    .word-chip.adj { background:#f3e8fa; color:#5a2c7a; border:1.5px solid #d8bce8; }
    .word-chip.adv { background:#fef0e3; color:#7a4a1e; border:1.5px solid #f5d5b0; }
    .word-chip.prep { background:#e3f5f1; color:#1e5a4a; border:1.5px solid #b0e0d5; }
    .word-chip.art { background:#f0f0f0; color:#4a4a4a; border:1.5px solid #d8d8d8; }
    .word-chip.conj { background:#fce8e8; color:#7a2c2c; border:1.5px solid #f0b0b0; }
    .word-chip.center { box-shadow:0 0 0 2px var(--center), 0 2px 8px rgba(240,96,63,0.25); }
    @keyframes chipIn { from{transform:scale(0.7);opacity:0} to{transform:scale(1);opacity:1} }
    .sentence-placeholder { color:var(--ink-muted); font-style:italic; font-size:0.9rem; }

    /* Flower stage */
    .flower-stage { flex:1 1 auto; min-height:0; width:100%; display:flex; align-items:center; justify-content:center; position:relative; }
    .flower-svg { height:100%; width:auto; max-width:100%; max-height:380px; aspect-ratio:1/1; display:block; overflow:visible; }
    .flower-petal { cursor:pointer; transition:transform 0.18s var(--ease), filter 0.18s var(--ease); transform-box:fill-box; transform-origin:center; }
    .flower-petal:hover { transform:scale(1.06); filter:drop-shadow(0 4px 10px rgba(0,0,0,0.15)); }
    .flower-petal.pressed { transform:scale(0.92); }
    .flower-text { font-family:'DM Sans',sans-serif; font-weight:700; text-anchor:middle; dominant-baseline:middle; pointer-events:none; user-select:none; }
    .flower-pos { font-family:'DM Sans',sans-serif; font-weight:500; text-anchor:middle; dominant-baseline:middle; pointer-events:none; opacity:0.75; text-transform:uppercase; letter-spacing:0.05em; }

    /* Wildcards / Add POS */
    .wild-row { display:flex; flex-wrap:wrap; gap:6px; width:100%; justify-content:center; flex:0 0 auto; }
    .wild-btn { display:inline-flex; align-items:center; gap:4px; padding:6px 12px; border-radius:99px; border:1.5px solid; background:var(--card); font-family:'DM Sans',sans-serif; font-size:0.72rem; font-weight:600; cursor:pointer; transition:all 0.18s var(--ease); box-shadow:var(--shadow-sm); }
    .wild-btn:disabled { opacity:0.4; cursor:not-allowed; transform:none !important; }
    .wild-btn:not(:disabled):hover { transform:translateY(-1px); box-shadow:var(--shadow-md); }
    .wild-btn:not(:disabled):active { transform:scale(0.95); }
    .wild-btn.noun { border-color:#bcdff5; color:#2c5f8a; }
    .wild-btn.verb { border-color:#bce0c8; color:#2c5f3f; }
    .wild-btn.adj { border-color:#d8bce8; color:#5a2c7a; }
    .wild-btn.adv { border-color:#f5d5b0; color:#7a4a1e; }
    .wild-btn.prep { border-color:#b0e0d5; color:#1e5a4a; }
    .wild-btn.art { border-color:#d8d8d8; color:#4a4a4a; }
    .wild-btn.conj { border-color:#f0b0b0; color:#7a2c2c; }
    .wild-count { font-size:0.65rem; background:rgba(0,0,0,0.06); padding:1px 5px; border-radius:99px; }

    /* Action row */
    .action-row { display:flex; align-items:stretch; gap:8px; width:100%; flex:0 0 auto; }
    .btn-shuffle { flex:0 0 auto; width:clamp(42px,7.6dvh,54px); background:var(--card-soft); border:1px solid rgba(232,216,200,0.7); border-radius:14px; display:flex; align-items:center; justify-content:center; color:var(--ink-muted); cursor:pointer; box-shadow:var(--shadow-sm), var(--hairline); transition:all 0.18s var(--ease); }
    .btn-shuffle:hover { background:#fde3e0; color:var(--center); }
    .btn-shuffle:active { transform:scale(0.92); }
    .btn-shuffle.spin svg { animation:shuffleSpin 0.5s var(--ease); }
    @keyframes shuffleSpin { from{transform:rotate(0)} to{transform:rotate(180deg)} }
    .btn-enter { flex:1 1 auto; padding:clamp(10px,1.8dvh,16px); background:linear-gradient(160deg,var(--stem),#3e7a4f); color:#fff; border:none; border-radius:14px; font-family:'DM Sans',sans-serif; font-size:clamp(0.8rem,1.9dvh,0.98rem); font-weight:600; letter-spacing:0.06em; text-transform:uppercase; cursor:pointer; box-shadow:0 2px 4px rgba(40,90,55,0.25), 0 10px 24px rgba(74,140,92,0.32), inset 0 1px 0 rgba(255,255,255,0.18); transition:all 0.18s var(--ease); }
    .btn-enter:hover { background:linear-gradient(160deg,#559966,#346641); transform:translateY(-1px); }
    .btn-enter:active { transform:translateY(1px) scale(0.99); }
    .btn-enter:disabled { background:#c8d8c0; cursor:default; transform:none; box-shadow:none; }

    /* Toast */
    .toast { position:fixed; top:24px; left:50%; transform:translateX(-50%) translateY(-80px); background:var(--ink); color:#fff; padding:10px 22px; border-radius:99px; font-size:0.9rem; font-weight:500; z-index:200; pointer-events:none; transition:transform 0.35s var(--ease),opacity 0.35s var(--ease); opacity:0; white-space:nowrap; box-shadow:0 10px 30px rgba(0,0,0,0.25); }
    .toast.show { transform:translateX(-50%) translateY(0); opacity:1; }
    .toast.good { background:linear-gradient(135deg,var(--stem),#3e7a4f); }
    .toast.bad { background:linear-gradient(135deg,var(--center),var(--center-hover)); }

    /* Found sentences */
    .found-ticker { flex:0 0 auto; width:100%; background:var(--card-soft); border-radius:14px; padding:8px 14px; box-shadow:var(--shadow-sm), var(--hairline); display:flex; align-items:flex-start; gap:10px; min-height:clamp(34px,6.2dvh,44px); }
    .found-label { flex:0 0 auto; font-size:clamp(0.6rem,1.3dvh,0.72rem); color:var(--ink-muted); text-transform:uppercase; letter-spacing:0.06em; white-space:nowrap; padding-top:2px; }
    .found-label b { color:var(--stem); font-family:'Playfair Display',serif; font-size:1.05em; }
    .found-list { flex:1 1 auto; min-width:0; display:flex; flex-wrap:wrap; align-content:flex-start; gap:5px 6px; }
    .found-hint { color:var(--ink-muted); font-size:0.72rem; white-space:nowrap; }
    .found-sentence { flex:0 0 auto; background:#f0f8f2; border:1.5px solid #c8e8d4; color:var(--stem); border-radius:8px; padding:3px 10px; font-size:0.74rem; font-weight:500; white-space:nowrap; animation:pop-in 0.3s cubic-bezier(.2,1.5,.4,1); cursor:pointer; }
    .found-sentence:hover { background:#e0f2e6; }
    .found-sentence.fullbloom { background:#fff8e6; border-color:var(--gold); color:#b07010; }
    .found-sentence.fullbloom::before { content:'✿ '; }
    @keyframes pop-in { from{transform:scale(0.6);opacity:0} to{transform:scale(1);opacity:1} }

    /* Tooltip */
    .grammar-tip { font-size:0.7rem; color:var(--ink-muted); text-align:center; margin-top:2px; font-style:italic; }

    /* End Screen */
    #endScreen { justify-content:flex-start; padding:30px 16px 50px; overflow-y:auto; -webkit-overflow-scrolling:touch; }
    .end-card { background:var(--card); border:1.5px solid rgba(246,101,74,0.18); border-radius:24px; padding:36px 28px; max-width:520px; width:100%; box-shadow:0 0 50px rgba(246,101,74,0.07),0 20px 60px rgba(0,0,0,0.08); animation:cardIn 0.6s cubic-bezier(0.34,1.4,0.64,1) forwards; }
    @keyframes cardIn { from{opacity:0;transform:translateY(32px) scale(0.96)} to{opacity:1;transform:none} }
    .end-title { font-family:'Playfair Display',serif; font-size:2.2rem; font-weight:900; text-align:center; color:var(--center); margin-bottom:4px; }
    .end-subtitle { text-align:center; font-size:0.82rem; color:var(--ink-muted); letter-spacing:0.06em; text-transform:uppercase; margin-bottom:22px; }
    .end-stats { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:20px; }
    .stat-box { background:#fdf0e2; border-radius:12px; padding:14px 8px; text-align:center; border:1.5px solid #f0d8c0; }
    .stat-num { font-family:'Playfair Display',serif; font-size:2rem; font-weight:700; color:var(--stem); line-height:1; }
    .stat-lbl { font-size:0.68rem; color:var(--ink-muted); text-transform:uppercase; letter-spacing:0.08em; margin-top:4px; }
    .end-sentences-title { font-size:0.78rem; color:var(--ink-muted); text-transform:uppercase; letter-spacing:0.08em; margin:18px 0 10px; }
    .end-sentence-chip { background:#f0f8f2; border:1.5px solid #c8e8d4; color:var(--stem); border-radius:8px; padding:6px 14px; font-size:0.85rem; font-weight:500; margin-bottom:6px; display:block; animation:pop-in 0.35s cubic-bezier(.2,1.5,.4,1) backwards; }
    .end-sentence-chip.fullbloom { background:#fff8e6; border-color:var(--gold); color:#b07010; }
    .end-btn-row { display:flex; gap:10px; flex-wrap:wrap; margin-top:20px; }
    .btn-end { flex:1; padding:13px 10px; border:none; border-radius:12px; font-family:'DM Sans',sans-serif; font-size:0.88rem; font-weight:600; letter-spacing:0.04em; cursor:pointer; transition:transform 0.15s; text-transform:uppercase; min-width:90px; }
    .btn-end:hover { transform:scale(1.03); }
    .btn-end-primary { background:linear-gradient(135deg,var(--stem),#7dbb8f); color:white; box-shadow:0 4px 16px rgba(74,140,92,0.25); }
    .btn-end-share { background:linear-gradient(135deg,#128c7e,#25d366); color:white; }
    .btn-end-secondary { background:#fdf0e2; color:var(--ink-muted); border:1.5px solid #e8d8c8; }

    canvas { display:none; }
  </style>
</head>
<body>

<div class="toast" id="toast"></div>

<!-- GAME SCREEN -->
<div class="screen active" id="gameScreen">
  <div class="game-col">
    <div class="top-bar">
      <div class="top-actions">
        <button class="icon-btn" id="btn-end-game" aria-label="End game">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3v18"/><path d="M5 4h11l-2 3.5L16 11H5"/></svg>
        </button>
        <button class="icon-btn" id="btn-new" aria-label="New puzzle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M18.4 5.6l-2.8 2.8M8.4 15.6l-2.8 2.8"/></svg>
        </button>
      </div>
      <div class="brand"><h1>Synt<span>✿</span>x</h1></div>
      <div class="timer-pill">
        <div class="timer-arc-wrap">
          <svg id="timerArc" width="36" height="36" viewBox="0 0 56 56">
            <circle cx="28" cy="28" r="22" fill="none" stroke="rgba(74,60,50,0.1)" stroke-width="4"/>
            <circle id="arcPath" cx="28" cy="28" r="22" fill="none" stroke="var(--stem)" stroke-width="4" stroke-dasharray="138.2" stroke-dashoffset="0" stroke-linecap="round" style="transition:stroke-dashoffset 1s linear,stroke 0.5s ease;"/>
          </svg>
        </div>
        <div class="timer-text" id="timerText">3:00</div>
      </div>
    </div>

    <div class="stat-strip">
      <div class="stat-strip-top">
        <span class="rank-name" id="rank-name">Seedling 🌱</span>
        <span class="stat-nums"><b id="score">0</b> pts · <b id="sentence-count">0</b> sentences · best <b id="best-score">0</b></span>
      </div>
      <div class="rank-track"><div class="rank-fill" id="rank-fill" style="width:0%"></div></div>
    </div>

    <div class="sentence-row">
      <div class="sentence-display empty" id="sentence-display">
        <span class="sentence-placeholder" id="sentence-placeholder">Tap words to build a sentence…</span>
      </div>
      <div class="grammar-tip" id="grammar-tip">Must include the center word</div>
    </div>

    <div class="flower-stage">
      <svg id="flower" viewBox="0 0 340 340" class="flower-svg"></svg>
    </div>

    <div class="wild-row" id="wild-row">
      <button class="wild-btn noun" data-pos="noun"><span>+ Noun</span><span class="wild-count" id="wc-noun">2</span></button>
      <button class="wild-btn verb" data-pos="verb"><span>+ Verb</span><span class="wild-count" id="wc-verb">2</span></button>
      <button class="wild-btn adj" data-pos="adj"><span>+ Adj</span><span class="wild-count" id="wc-adj">2</span></button>
      <button class="wild-btn adv" data-pos="adv"><span>+ Adv</span><span class="wild-count" id="wc-adv">2</span></button>
      <button class="wild-btn prep" data-pos="prep"><span>+ Prep</span><span class="wild-count" id="wc-prep">2</span></button>
      <button class="wild-btn art" data-pos="art"><span>+ Article</span><span class="wild-count" id="wc-art">2</span></button>
      <button class="wild-btn conj" data-pos="conj"><span>+ Conj</span><span class="wild-count" id="wc-conj">1</span></button>
    </div>

    <div class="action-row">
      <button class="btn-shuffle" id="btn-shuffle" aria-label="Shuffle words">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>
      </button>
      <button class="btn-enter" id="btn-enter">Bloom It!</button>
      <button class="btn-shuffle" id="btn-clear" aria-label="Clear sentence" style="transform:scale(0.92);">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="found-ticker">
      <span class="found-label">Found <b id="found-count">0</b></span>
      <div class="found-list" id="found-list"><span class="found-hint">Sentences you create will appear here…</span></div>
    </div>
  </div>
</div>

<!-- END SCREEN -->
<div class="screen" id="endScreen">
  <div class="end-card">
    <div class="end-title" id="endTitle">🌸 Time's Up!</div>
    <div class="end-subtitle" id="endSubtitle">Syntax Sentence Garden</div>
    <div class="end-stats">
      <div class="stat-box"><div class="stat-num" id="endScore">0</div><div class="stat-lbl">Score</div></div>
      <div class="stat-box"><div class="stat-num" id="endSentences">0</div><div class="stat-lbl">Sentences</div></div>
      <div class="stat-box"><div class="stat-num" id="endFullBloom">0</div><div class="stat-lbl">Full Blooms</div></div>
    </div>
    <div class="end-sentences-title">Your Sentences</div>
    <div id="endSentencesList"></div>
    <div class="end-btn-row">
      <button class="btn-end btn-end-primary" id="btnPlayAgain">✿ Play Again</button>
      <button class="btn-end btn-end-share" id="btnShare">📲 Share</button>
    </div>
  </div>
</div>

<canvas id="statsCanvas"></canvas>

<script>
/* ═══════════════════════════════════════════════
   WORD DATABASE
═══════════════════════════════════════════════ */
const WORD_DB = {
  noun: ['cat','dog','bird','fish','tree','flower','sun','moon','star','river','mountain','house','car','book','child','friend','sea','wind','rain','fire','king','queen','city','world','heart','light','song','dream'],
  verb: ['runs','jumps','sleeps','eats','sings','dances','reads','writes','flies','swims','walks','talks','plays','works','laughs','cries','thinks','dreams','grows','shines','falls','rises','builds','paints','cooks','watches','loves'],
  adj: ['big','small','red','blue','green','happy','sad','bright','dark','quick','slow','tall','short','old','new','warm','cold','soft','hard','loud','quiet','sweet','brave','calm'],
  adv: ['quickly','slowly','happily','sadly','loudly','quietly','brightly','softly','well','fast','soon','late','early','always','never','gently','boldly'],
  prep: ['in','on','at','under','over','through','with','without','above','below','between','behind','before','after'],
  art: ['the','a','an','this','that','my','your','his','her','their','our'],
  conj: ['and','but','or','yet','so','because']
};

const POS_NAMES = { noun:'Noun', verb:'Verb', adj:'Adjective', adv:'Adverb', prep:'Preposition', art:'Article', conj:'Conjunction' };
const POS_COLORS = { noun:'#4a90d9', verb:'#4a8c5c', adj:'#9b59b6', adv:'#e67e22', prep:'#16a085', art:'#7f8c8d', conj:'#c0392b' };

/* ═══════════════════════════════════════════════
   GRAMMAR PATTERNS (regex on POS sequence)
═══════════════════════════════════════════════ */
const GRAMMAR_REGEXES = [
  /^ART( ADJ)? NOUN VERB( ADV)?$/,
  /^ART( ADJ)? NOUN VERB( ADV)? PREP ART( ADJ)? NOUN$/,
  /^ART( ADJ)? NOUN VERB ART( ADJ)? NOUN$/,
  /^NOUN VERB( ART( ADJ)? NOUN)?$/,
  /^PRON VERB( ADV)?( PREP ART( ADJ)? NOUN)?$/,
  /^ART NOUN CONJ ART NOUN VERB( ADV)?$/,
  /^ART NOUN VERB CONJ VERB( PREP ART NOUN)?$/,
  /^ART( ADJ)? NOUN VERB ART NOUN CONJ ART NOUN VERB$/,
  /^ART( ADJ)? NOUN VERB ADV CONJ VERB ADV$/
];

/* ═══════════════════════════════════════════════
   CONFIG
═══════════════════════════════════════════════ */
const BEST_KEY = 'syntaxBest';
const GAME_SECS = 180;
const ARC_CIRC = 138.2;
const RANKS = [
  {name:'Seedling 🌱',min:0},{name:'Sprout 🌿',min:30},
  {name:'Poet ✍️',min:75},{name:'Bard 📜',min:150},
  {name:'Wordsmith 🖋️',min:250},{name:'Laureate 🏆',min:400},
];

/* ═══════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════ */
let flowerWords = []; // {id, word, pos, source, el}
let sentence = [];    // {id, word, pos, source}
let foundSentences = [];
let score = 0, bestScore = parseInt(localStorage.getItem(BEST_KEY)||'0');
let timeLeft = GAME_SECS, timerInterval = null, gameActive = false;
let wildCounts = {};
let tokenIdCounter = 0;

/* ═══════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════ */
newPuzzle();

function newPuzzle() {
  clearInterval(timerInterval);
  tokenIdCounter = 0;
  sentence = [];
  foundSentences = [];
  score = 0;
  gameActive = true;
  timeLeft = GAME_SECS;
  wildCounts = { noun:2, verb:2, adj:2, adv:2, prep:2, art:2, conj:1 };
  updateWildButtons();
  updateScoreDisplay();
  updateFoundList();
  renderInput();
  updateTimerDisplay();
  updateArc();
  generateFlower();
  startTimer();
}

function rand(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function randExcept(arr, exclude){ const pool=arr.filter(x=>!exclude.includes(x)); return pool.length?rand(pool):rand(arr); }

function generateFlower() {
  // Center must be a noun (the required subject)
  const centerWord = rand(WORD_DB.noun);
  const used = [centerWord];
  // Ensure at least one verb and one article for basic sentence
  const verbWord = randExcept(WORD_DB.verb, used); used.push(verbWord);
  const artWord = rand(WORD_DB.art); used.push(artWord);
  const petalWords = [
    {word:verbWord, pos:'verb'},
    {word:randExcept(WORD_DB.noun, used), pos:'noun'},
    {word:rand(WORD_DB.adj), pos:'adj'},
    {word:rand(WORD_DB.adv), pos:'adv'},
    {word:rand(WORD_DB.prep), pos:'prep'},
    {word:artWord, pos:'art'}
  ];
  // Shuffle petals
  for(let i=petalWords.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [petalWords[i],petalWords[j]]=[petalWords[j],petalWords[i]]; }
  
  flowerWords = [
    {id:tokenIdCounter++, word:centerWord, pos:'noun', source:'flower-center'},
    ...petalWords.map(p=>({id:tokenIdCounter++, word:p.word, pos:p.pos, source:'flower-petal'}))
  ];
  renderFlower();
}

/* ═══════════════════════════════════════════════
   TIMER
═══════════════════════════════════════════════ */
function startTimer() {
  timerInterval = setInterval(()=>{
    if(!gameActive) return;
    timeLeft--;
    updateTimerDisplay();
    updateArc();
    if(timeLeft<=0) endGame();
  },1000);
}
function updateTimerDisplay(){
  const m=Math.floor(timeLeft/60), s=timeLeft%60;
  document.getElementById('timerText').textContent=m+':'+(s<10?'0':'')+s;
  const el=document.getElementById('timerText');
  el.classList.remove('amber','danger');
  if(timeLeft<=30) el.classList.add('danger');
  else if(timeLeft<=60) el.classList.add('amber');
}
function updateArc(){
  const frac=Math.max(0,timeLeft/GAME_SECS);
  document.getElementById('arcPath').style.strokeDashoffset=ARC_CIRC*(1-frac);
  document.getElementById('arcPath').style.stroke=timeLeft<=30?'var(--center)':timeLeft<=60?'var(--gold)':'var(--stem)';
}

/* ═══════════════════════════════════════════════
   FLOWER RENDERING
═══════════════════════════════════════════════ */
function renderFlower() {
  const svg = document.getElementById('flower');
  svg.innerHTML = '';
  const NS = 'http://www.w3.org/2000/svg';
  const cx=170, cy=170, radius=95, petalR=46, centerR=52;

  // Glow filters
  const defs = document.createElementNS(NS,'defs');
  defs.innerHTML = `
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowCenter" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  `;
  svg.appendChild(defs);

  function makePetal(x,y,r,fill,wordObj,isCenter){
    const g = document.createElementNS(NS,'g');
    g.style.cursor='pointer';
    const circle = document.createElementNS(NS,'circle');
    circle.setAttribute('cx',x); circle.setAttribute('cy',y); circle.setAttribute('r',r);
    circle.setAttribute('fill',fill);
    circle.setAttribute('class','flower-petal');
    circle.setAttribute('stroke','rgba(255,255,255,0.4)');
    circle.setAttribute('stroke-width','2');
    if(isCenter) circle.setAttribute('filter','url(#glowCenter)');
    else circle.setAttribute('filter','url(#glow)');
    
    const fontSize = Math.max(10, 22 - wordObj.word.length*1.2);
    const text = document.createElementNS(NS,'text');
    text.setAttribute('x',x); text.setAttribute('y',y+1);
    text.setAttribute('class','flower-text');
    text.setAttribute('fill',isCenter?'#fff':'var(--ink)');
    text.setAttribute('font-size',fontSize);
    text.textContent = wordObj.word;

    const posText = document.createElementNS(NS,'text');
    posText.setAttribute('x',x); posText.setAttribute('y',y+r-10);
    posText.setAttribute('class','flower-pos');
    posText.setAttribute('fill',isCenter?'rgba(255,255,255,0.8)':'rgba(42,31,26,0.6)');
    posText.setAttribute('font-size','7');
    posText.textContent = POS_NAMES[wordObj.pos];

    const onTap = ()=>{
      circle.classList.add('pressed');
      setTimeout(()=>circle.classList.remove('pressed'),140);
      if(navigator.vibrate) navigator.vibrate(6);
      addWordToSentence({...wordObj, id:tokenIdCounter++});
    };
    circle.addEventListener('click',onTap);
    text.addEventListener('click',onTap);

    g.appendChild(circle); g.appendChild(text); g.appendChild(posText);
    svg.appendChild(g);
  }

  // Petals
  for(let i=0;i<6;i++){
    const angle = (Math.PI/3)*i - Math.PI/2;
    const x = cx + radius*Math.cos(angle);
    const y = cy + radius*Math.sin(angle);
    const w = flowerWords[i+1];
    makePetal(x,y,petalR,POS_COLORS[w.pos]||var(--petal),w,false);
  }
  // Center
  makePetal(cx,cy,centerR,'var(--center)',flowerWords[0],true);
}

/* ═══════════════════════════════════════════════
   SENTENCE BUILDER
═══════════════════════════════════════════════ */
function addWordToSentence(wordObj){
  if(!gameActive) return;
  if(sentence.length>=16){ showToast('Sentence too long!','bad'); return; }
  sentence.push(wordObj);
  renderInput();
}

function removeWordFromSentence(index){
  if(!gameActive) return;
  sentence.splice(index,1);
  renderInput();
  if(navigator.vibrate) navigator.vibrate(5);
}

function clearSentence(){
  sentence=[];
  renderInput();
}

function renderInput(){
  const disp = document.getElementById('sentence-display');
  const ph = document.getElementById('sentence-placeholder');
  disp.classList.remove('empty','error','success');
  if(!sentence.length){
    disp.classList.add('empty');
    disp.innerHTML='<span class="sentence-placeholder">Tap words to build a sentence…</span>';
    document.getElementById('grammar-tip').textContent='Must include the center word';
    return;
  }
  disp.innerHTML='';
  sentence.forEach((tok,idx)=>{
    const chip = document.createElement('span');
    chip.className='word-chip '+tok.pos+(tok.source==='flower-center'?' center':'');
    chip.innerHTML = tok.word + '<span class="pos-tag">'+tok.pos+'</span>';
    chip.onclick = ()=>removeWordFromSentence(idx);
    disp.appendChild(chip);
  });
  // Grammar hint
  const hasCenter = sentence.some(t=>t.source==='flower-center');
  document.getElementById('grammar-tip').textContent = hasCenter ? 'Pattern: '+sentence.map(t=>t.pos).join(' ') : '⚠ Must include the center word';
}

/* ═══════════════════════════════════════════════
   WILDCARDS
═══════════════════════════════════════════════ */
document.querySelectorAll('.wild-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    if(!gameActive) return;
    const pos = btn.dataset.pos;
    if(wildCounts[pos]<=0) return;
    wildCounts[pos]--;
    const word = rand(WORD_DB[pos]);
    addWordToSentence({id:tokenIdCounter++, word, pos, source:'wildcard'});
    updateWildButtons();
    if(navigator.vibrate) navigator.vibrate(4);
  });
});

function updateWildButtons(){
  Object.keys(wildCounts).forEach(pos=>{
    const btn = document.querySelector('.wild-btn[data-pos="'+pos+'"]');
    const count = wildCounts[pos];
    document.getElementById('wc-'+pos).textContent = count;
    btn.disabled = count<=0;
  });
}

/* ═══════════════════════════════════════════════
   VALIDATION & SCORING
═══════════════════════════════════════════════ */
function isFullBloom(sent){ 
  const flowerIds = new Set(flowerWords.map(f=>f.word));
  const usedFlower = new Set(sent.filter(t=>t.source.startsWith('flower')).map(t=>t.word));
  return usedFlower.size >= flowerWords.length && sent.some(t=>t.source==='flower-center');
}

function validateSentence(){
  if(!gameActive) return;
  if(sentence.length<3){ showToast('Too short! (3+ words)','bad'); shake(); return; }
  if(!sentence.some(t=>t.source==='flower-center')){ showToast('Must use the center word!','bad'); shake(); return; }
  
  const seq = sentence.map(t=>t.pos).join(' ');
  const valid = GRAMMAR_REGEXES.some(re=>re.test(seq));
  if(!valid){ showToast('Grammar check failed — try a different order','bad'); shake(); return; }
  
  const text = sentence.map(t=>t.word).join(' ');
  const normalized = text.toLowerCase().replace(/[^a-z]/g,'');
  if(foundSentences.some(s=>s.normalized===normalized)){ showToast('Already found!','bad'); shake(); return; }
  
  // Score
  let pts = sentence.length*10;
  if(sentence.length>=5) pts+=10;
  if(sentence.length>=7) pts+=20;
  const uniqueCats = new Set(sentence.map(t=>t.pos)).size;
  pts += uniqueCats*5;
  const fb = isFullBloom(sentence);
  if(fb) pts+=50;
  
  score+=pts;
  foundSentences.push({text, normalized, score:pts, fullbloom:fb, words:sentence.length});
  sentence=[]; renderInput(); updateScoreDisplay(); updateFoundList();
  
  let msg = `+${pts} points`;
  if(fb) msg = '✿ Full Bloom! '+msg;
  else if(sentence.length>=7) msg = 'Epic sentence! '+msg;
  showToast(msg,'good');
  document.getElementById('sentence-display').classList.add('success');
  setTimeout(()=>document.getElementById('sentence-display').classList.remove('success'),700);
  if(navigator.vibrate) navigator.vibrate(fb?[20,40,20]:18);
}

function shake(){
  const d=document.getElementById('sentence-display');
  d.classList.add('error');
  setTimeout(()=>d.classList.remove('error'),500);
}

/* ═══════════════════════════════════════════════
   DISPLAY UPDATES
═══════════════════════════════════════════════ */
function updateScoreDisplay(){
  document.getElementById('score').textContent=score;
  document.getElementById('sentence-count').textContent=foundSentences.length;
  if(score>bestScore){ bestScore=score; localStorage.setItem(BEST_KEY,bestScore); }
  document.getElementById('best-score').textContent=bestScore;
  let ri=0;
  for(let i=RANKS.length-1;i>=0;i--){ if(score>=RANKS[i].min){ri=i;break;} }
  const rank=RANKS[ri], next=RANKS[ri+1];
  document.getElementById('rank-name').textContent=rank.name;
  if(next){ document.getElementById('rank-fill').style.width=Math.min(100,((score-rank.min)/(next.min-rank.min))*100)+'%'; }
  else { document.getElementById('rank-fill').style.width='100%'; }
}

function updateFoundList(){
  document.getElementById('found-count').textContent=foundSentences.length;
  const list=document.getElementById('found-list');
  if(!foundSentences.length){ list.innerHTML='<span class="found-hint">Sentences you create will appear here…</span>'; return; }
  list.innerHTML='';
  foundSentences.slice().reverse().forEach(s=>{
    const span=document.createElement('span');
    span.className='found-sentence'+(s.fullbloom?' fullbloom':'');
    span.textContent=(s.fullbloom?'✿ ':'')+s.text;
    span.title=s.score+' pts';
    list.appendChild(span);
  });
}

function getRankName(pts){
  let ri=0; for(let i=RANKS.length-1;i>=0;i--){if(pts>=RANKS[i].min){ri=i;break;}} return RANKS[ri].name;
}

/* ═══════════════════════════════════════════════
   TOAST
═══════════════════════════════════════════════ */
let toastTimer;
function showToast(msg,type=''){
  const t=document.getElementById('toast'); t.textContent=msg; t.className='toast show '+type;
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2200);
}

/* ═══════════════════════════════════════════════
   CONTROLS
═══════════════════════════════════════════════ */
document.getElementById('btn-clear').addEventListener('click',clearSentence);
document.getElementById('btn-enter').addEventListener('click',validateSentence);
document.getElementById('btn-shuffle').addEventListener('click',()=>{
  const b=document.getElementById('btn-shuffle');
  b.classList.remove('spin'); void b.offsetWidth; b.classList.add('spin');
  if(navigator.vibrate) navigator.vibrate(10);
  // Reshuffle petal positions visually
  const center = flowerWords[0];
  const petals = flowerWords.slice(1);
  for(let i=petals.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [petals[i],petals[j]]=[petals[j],petals[i]]; }
  flowerWords=[center,...petals];
  renderFlower();
});
document.getElementById('btn-new').addEventListener('click',()=>{
  if(confirm('Start a new puzzle? Current progress will be lost.')) newPuzzle();
});
document.getElementById('btn-end-game').addEventListener('click',()=>{
  if(confirm('End the round and see results?')) endGame();
});

/* ═══════════════════════════════════════════════
   END GAME
═══════════════════════════════════════════════ */
function endGame(){
  gameActive=false; clearInterval(timerInterval);
  setTimeout(showEndScreen,300);
}

function showEndScreen(){
  document.getElementById('gameScreen').classList.remove('active');
  document.getElementById('endScreen').classList.add('active');
  
  const tm=[[300,'🏆 Laureate!'],[150,'📜 Master Bard'],[75,'✍️ Poet'],[30,'🌿 Sprout'],[0,'🌱 Good effort!']];
  document.getElementById('endTitle').textContent=(tm.find(([m])=>score>=m)||tm[4])[1];
  document.getElementById('endSubtitle').textContent=`Syntax · ${foundSentences.length} sentence${foundSentences.length!==1?'s':''} · ${getRankName(score)}`;
  document.getElementById('endScore').textContent=score;
  document.getElementById('endSentences').textContent=foundSentences.length;
  document.getElementById('endFullBloom').textContent=foundSentences.filter(s=>s.fullbloom).length;
  
  const list=document.getElementById('endSentencesList');
  list.innerHTML='';
  if(!foundSentences.length){ list.innerHTML='<span style="color:var(--ink-muted);font-size:0.9rem;">No sentences found this round.</span>'; }
  else {
    foundSentences.slice().reverse().forEach((s,i)=>{
      const div=document.createElement('div');
      div.className='end-sentence-chip'+(s.fullbloom?' fullbloom':'');
      div.textContent=(s.fullbloom?'✿ ':'')+s.text+'  ·  +'+s.score;
      div.style.animationDelay=(i*0.05)+'s';
      list.appendChild(div);
    });
  }
  
  document.getElementById('btnPlayAgain').onclick=()=>{
    document.getElementById('endScreen').classList.remove('active');
    document.getElementById('gameScreen').classList.add('active');
    newPuzzle();
  };
  document.getElementById('btnShare').onclick=shareResult;
}

/* ═══════════════════════════════════════════════
   SHARE
═══════════════════════════════════════════════ */
function shareResult(){
  const top = foundSentences.sort((a,b)=>b.score-a.score).slice(0,3).map(s=>`"${s.text}" (+${s.score})`).join('\n');
  const msg=`🌸 Syntax Sentence Garden\nScore: ${score} pts · ${foundSentences.length} sentences · ${getRankName(score)}\n${top?'\nTop sentences:\n'+top+'\n':''}\nBuild beautiful sentences!`;
  
  if(navigator.share){
    navigator.share({title:'Syntax Sentence Garden',text:msg}).catch(()=>{});
  } else {
    window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank');
  }
}
</script>
</body>

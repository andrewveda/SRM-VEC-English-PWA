  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Google Fonts: Space Grotesk & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&family=Space+Grotesk:wght@500;700;900&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Outfit', 'sans-serif'],
            display: ['Space Grotesk', 'sans-serif'],
          },
          colors: {
            boardDark: '#0b0f19',
            boardSurface: '#121927',
            gold: '#facc15',
            neonViolet: '#a855f7',
            neonCyan: '#06b6d4',
            neonAmber: '#f59e0b',
            neonEmerald: '#10b981',
            neonRose: '#f43f5e',
          }
        }
      }
    };
  </script>

  <style>
    /* Kinetic Animation Keyframes */
    @keyframes floatParticle {
      0% { transform: translateY(0px) rotate(0deg); opacity: 0.15; }
      50% { transform: translateY(-30px) rotate(15deg); opacity: 0.35; }
      100% { transform: translateY(0px) rotate(0deg); opacity: 0.15; }
    }

    @keyframes popIn {
      0% { transform: scale(0.85) translateY(24px); opacity: 0; filter: blur(4px); }
      70% { transform: scale(1.02) translateY(-2px); opacity: 1; filter: blur(0px); }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 25px rgba(250, 204, 21, 0.25); }
      50% { box-shadow: 0 0 45px rgba(250, 204, 21, 0.55); }
    }

    @keyframes slideTitle {
      0% { transform: translateY(-20px); opacity: 0; letter-spacing: -2px; }
      100% { transform: translateY(0); opacity: 1; letter-spacing: normal; }
    }

    .animate-pop {
      animation: popIn 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .animate-title {
      animation: slideTitle 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .gold-glow {
      animation: pulseGlow 2.5s infinite ease-in-out;
    }

    .glass-card {
      background: rgba(18, 25, 39, 0.72);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* Custom scrollbar for drawer */
    ::-webkit-scrollbar {
      width: 5px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.3);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 9999px;
    }

    /* Disable default touch callouts & selection for app-like feeling */
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
  </style>
</head>

<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center font-sans overflow-x-hidden selection:bg-neonCyan/30">

  <!-- Desktop Backdrop Stage -->
  <div class="fixed inset-0 pointer-events-none opacity-20 overflow-hidden flex items-center justify-center">
    <div class="w-[850px] h-[850px] rounded-full bg-gradient-to-tr from-purple-700 via-cyan-500 to-amber-500 blur-[130px] animate-pulse"></div>
  </div>

  <!-- Main Vertical Container (Mobile 9:16 Aspect Fit) -->
  <main class="relative w-full max-w-[440px] h-screen sm:h-[880px] sm:max-h-[94vh] sm:rounded-3xl overflow-hidden bg-boardDark border sm:border-slate-800 shadow-2xl flex flex-col justify-between">
    
    <!-- Background Animated Chess Watermark Pattern -->
    <div class="absolute inset-0 pointer-events-none opacity-5 z-0 flex flex-wrap content-between justify-between p-6 overflow-hidden">
      <i class="fa-solid fa-chess-king text-7xl transform -rotate-12"></i>
      <i class="fa-solid fa-chess-queen text-8xl transform rotate-12"></i>
      <i class="fa-solid fa-chess-knight text-7xl"></i>
      <i class="fa-solid fa-chess-rook text-8xl transform -rotate-45"></i>
      <i class="fa-solid fa-chess-bishop text-7xl"></i>
      <i class="fa-solid fa-chess-pawn text-8xl transform rotate-45"></i>
    </div>

    <!-- Floating Ambient Orbs inside Reel -->
    <div id="ambientOrb" class="absolute -top-16 -right-16 w-60 h-60 rounded-full blur-[70px] pointer-events-none opacity-30 transition-all duration-700 bg-amber-500"></div>
    <div id="ambientOrbBottom" class="absolute -bottom-20 -left-20 w-60 h-60 rounded-full blur-[80px] pointer-events-none opacity-25 transition-all duration-700 bg-cyan-500"></div>

    <!-- Top Reel Header: Stories Progress Bar & Header Controls -->
    <header class="relative z-30 pt-3 px-4 pb-2 bg-gradient-to-b from-slate-950/90 to-transparent">
      <!-- Stories Progress Bar -->
      <div id="progressBarWrapper" class="flex items-center gap-1 w-full mb-3 cursor-pointer py-1">
        <!-- Bars injected dynamically by JS -->
      </div>

      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <div class="w-7 h-7 rounded-lg bg-amber-500/20 border border-amber-400/40 flex items-center justify-center text-amber-400 text-xs shadow-inner">
            <i class="fa-solid fa-chess-knight"></i>
          </div>
          <div>
            <span class="text-[10px] font-bold tracking-widest uppercase text-amber-400 block -mb-0.5 font-display">CHESS RECAP</span>
            <div class="text-xs font-semibold text-slate-300 flex items-center gap-1.5">
              <span id="slideCounterText" class="text-white font-mono font-bold">1 / 23</span>
              <span class="text-slate-600">•</span>
              <span id="badgeCategory" class="text-[11px] text-cyan-400 bg-cyan-950/60 px-1.5 py-0.5 rounded border border-cyan-800/40">Leaderboard</span>
            </div>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <!-- Audio Toggle -->
          <button id="soundBtn" title="Toggle Sound FX" class="w-8 h-8 rounded-full bg-slate-800/80 hover:bg-slate-700 border border-slate-700 flex items-center justify-center text-slate-300 text-xs transition active:scale-90">
            <i class="fa-solid fa-volume-xmark text-rose-400" id="soundIcon"></i>
          </button>
          
          <!-- Speed Controller (0.75x, 1x, 1.5x) -->
          <button id="speedBtn" title="Cycle Autoplay Speed" class="px-2 h-8 rounded-full bg-slate-800/80 hover:bg-slate-700 border border-slate-700 flex items-center justify-center text-slate-300 text-xs font-mono font-bold transition active:scale-90">
            1.0x
          </button>

          <!-- Drawer Navigation Button -->
          <button id="drawerToggleBtn" title="Open Categories Menu" class="w-8 h-8 rounded-full bg-slate-800/80 hover:bg-slate-700 border border-slate-700 flex items-center justify-center text-slate-300 text-xs transition active:scale-90">
            <i class="fa-solid fa-list-ul"></i>
          </button>
        </div>
      </div>
    </header>

    <!-- Tap Zones for Stories Navigation (Left = Prev, Right = Next) -->
    <div id="tapLeft" class="absolute left-0 top-16 bottom-24 w-1/4 z-20 cursor-w-resize opacity-0"></div>
    <div id="tapRight" class="absolute right-0 top-16 bottom-24 w-1/4 z-20 cursor-e-resize opacity-0"></div>

    <!-- Main Dynamic Slide Display Zone -->
    <section id="slideStage" class="relative z-10 flex-1 px-4 py-1 flex flex-col justify-center overflow-hidden">
      <!-- Injected by JavaScript -->
    </section>

    <!-- Bottom Controls & Playback Dock -->
    <footer class="relative z-30 p-3 pt-2 bg-gradient-to-t from-slate-950 via-slate-950/90 to-transparent flex flex-col gap-2">
      <!-- Controls Bar -->
      <div class="flex items-center justify-between glass-card px-3 py-2 rounded-2xl">
        <button id="prevBtn" class="w-9 h-9 rounded-xl bg-slate-800/80 hover:bg-slate-700 border border-slate-700 flex items-center justify-center text-white text-sm transition active:scale-90">
          <i class="fa-solid fa-backward-step"></i>
        </button>

        <button id="playPauseBtn" class="px-5 h-9 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 font-bold text-slate-950 text-xs tracking-wider flex items-center gap-2 shadow-lg shadow-amber-500/20 transition active:scale-95">
          <i id="playPauseIcon" class="fa-solid fa-pause"></i>
          <span id="playPauseText">PAUSE</span>
        </button>

        <button id="nextBtn" class="w-9 h-9 rounded-xl bg-slate-800/80 hover:bg-slate-700 border border-slate-700 flex items-center justify-center text-white text-sm transition active:scale-90">
          <i class="fa-solid fa-forward-step"></i>
        </button>

        <!-- Share / Copy Slide Summary -->
        <button id="shareSlideBtn" title="Copy Leaderboard to Clipboard" class="w-9 h-9 rounded-xl bg-slate-800/80 hover:bg-slate-700 border border-slate-700 flex items-center justify-center text-cyan-400 text-sm transition active:scale-90">
          <i class="fa-solid fa-arrow-up-from-bracket"></i>
        </button>
      </div>

      <!-- Quick Hint Ticker -->
      <div class="flex items-center justify-between text-[11px] text-slate-400 px-2 font-mono">
        <span>Tap sides to skip</span>
        <span class="text-amber-400/90 font-semibold flex items-center gap-1">
          <i class="fa-solid fa-bolt text-[10px]"></i> Swipe / Auto-play
        </span>
      </div>
    </footer>

    <!-- Slide Index Navigation Drawer / Modal -->
    <aside id="drawer" class="absolute inset-0 z-50 bg-slate-950/95 backdrop-blur-xl transform translate-y-full transition-transform duration-300 ease-out flex flex-col p-4">
      <div class="flex items-center justify-between pb-3 border-b border-slate-800">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-chess text-amber-400"></i>
          <h3 class="font-bold font-display text-white text-base">Select Leaderboard</h3>
        </div>
        <button id="closeDrawerBtn" class="w-8 h-8 rounded-full bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-slate-300 text-sm">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <!-- Search Filter -->

        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-xs text-slate-500"></i>
        <input type="text" id="searchInput" placeholder="Search boards, players, departments..." class="w-full bg-slate-900 border border-slate-800 rounded-xl pl-8 pr-3 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500 transition" />
      </div>

      <!-- List of Leaderboards -->
      <div id="drawerList" class="flex-1 overflow-y-auto mt-3 pr-1 space-y-1.5 pb-6">
        <!-- Injected via JavaScript -->
      </div>
    </aside>

    <!-- Toast Notification for Actions -->
    <div id="toast" class="absolute top-20 left-1/2 -translate-x-1/2 z-50 bg-slate-900/90 border border-cyan-500/50 text-cyan-300 text-xs px-4 py-2 rounded-full shadow-2xl backdrop-blur-md opacity-0 pointer-events-none transition-all duration-300 flex items-center gap-2">

      <span id="toastMsg">Action completed</span>
    </div>

  </main>

    /**
     * Web Audio API Synthesizer (No external asset files)
     */
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.enabled = false;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
      }
      playSlide() {
        if (!this.enabled || !this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.exponentialRampToValueAtTime(740, now + 0.12);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.12);
        } catch (e) {
          console.warn(e);
        }
      }
      playTrophy() {
        if (!this.enabled || !this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const chords = [523.25, 659.25, 783.99, 1046.50]; // C Major
          chords.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + idx * 0.05);
            gain.gain.setValueAtTime(0.05, now + idx * 0.05);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.05 + 0.35);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + idx * 0.05);
            osc.stop(now + idx * 0.05 + 0.35);
          });
        } catch (e) {
          console.warn(e);
        }
      }
    }

              <div class="glass-card px-3 py-2.5 rounded-xl border border-white/5 flex items-center justify-between transition-all hover:border-slate-600 animate-pop" style="animation-delay: ${0.07 * (i + 1)}s">
                <div class="flex items-center gap-3 min-w-0 flex-1">
                  <div class="w-7 h-7 rounded-lg flex items-center justify-center font-display font-black text-xs shrink-0 ${
                    i === 0 ? 'bg-amber-400 text-slate-950 shadow-lg shadow-amber-400/40 ring-2 ring-amber-400/30' : 
                    i === 1 ? 'bg-slate-300 text-slate-900' :
                    i === 2 ? 'bg-amber-700/80 text-amber-100' : 'bg-slate-800 text-slate-400'
                  }">
                    ${item.rank}
                  </div>

                  <div class="truncate text-left">
                    <div class="text-xs font-bold text-slate-100 flex items-center gap-1.5 truncate">
                      <span class="truncate">${item.name}</span>
                      ${i === 0 ? '<i class="fa-solid fa-crown text-[10px] text-amber-400"></i>' : ''}
                    </div>
                    <div class="flex items-center gap-2 mt-0.5">
                      <span class="text-[10px] font-semibold text-slate-400 bg-slate-800/90 px-1.5 py-0.2 rounded border border-slate-700/50">${item.dept}</span>
                      <span class="text-[10px] text-slate-500 font-medium truncate">${item.highlight}</span>
                    </div>
                  </div>
                </div>

                <div class="shrink-0 text-right ml-2">
                  <div class="text-sm font-black font-display text-white tracking-wide">
                    ${item.score}
                  </div>
                  <div class="text-[9px] font-mono uppercase tracking-wider text-slate-400">
                    ${data.unit}
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        `;
      }

      // Title & container wrapper
      slideStage.innerHTML = `
        <div class="w-full my-auto flex flex-col justify-center">
          <!-- Slide Heading Banner -->
          <div class="mb-3 text-center animate-title">
            <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] font-semibold uppercase tracking-widest ${theme.badge} border ${theme.border} mb-1.5 shadow-sm">
              <i class="fa-solid ${data.icon}"></i>
              <span>${data.subtitle}</span>
            </div>
            <h1 class="text-xl sm:text-2xl font-black font-display tracking-tight text-white drop-shadow-md">
              ${data.title}
            </h1>
          </div>

          <!-- Slide Core Body -->
          <div class="w-full">
            ${contentHtml}
          </div>
        </div>
      `;

      // Update drawer active highlight
      updateDrawerSelection();

      // Trigger sound effect
      if (index === 0 || data.type === 'featured') {
        sound.playTrophy();
      } else {
        sound.playSlide();
      }
    }

    /**
     * Animation Loop & Progress Timing
     */
    function updateProgress(timestamp) {
      if (!startTime) startTime = timestamp - elapsedBeforePause;
      const effectiveDuration = baseDuration / currentSpeed;
      const elapsed = timestamp - startTime;
      const progressRatio = Math.min(elapsed / effectiveDuration, 1);

      // Fill current bar
      const currentFill = document.getElementById(`bar-fill-${currentIndex}`);
      if (currentFill) {
        currentFill.style.width = `${progressRatio * 100}%`;
      }

      // Fill preceding bars to 100%, and reset succeeding bars to 0%
      for (let i = 0; i < LEADERBOARDS.length; i++) {
        const fill = document.getElementById(`bar-fill-${i}`);
        if (!fill) continue;
        if (i < currentIndex) {
          fill.style.width = '100%';
        } else if (i > currentIndex) {
          fill.style.width = '0%';
        }
      }

      if (progressRatio >= 1) {
        // Move to next slide
        elapsedBeforePause = 0;
        startTime = null;
        if (currentIndex < LEADERBOARDS.length - 1) {
          currentIndex++;
          renderSlide(currentIndex);
          progressTimer = requestAnimationFrame(updateProgress);
        } else {
          // Loop back to start
          currentIndex = 0;
          renderSlide(currentIndex);
          progressTimer = requestAnimationFrame(updateProgress);
        }
      } else {
        if (isPlaying) {
          progressTimer = requestAnimationFrame(updateProgress);
        }
      }
    }

    function startAutoPlay() {
      isPlaying = true;
      playPauseIcon.className = 'fa-solid fa-pause';
      playPauseText.textContent = 'PAUSE';
      startTime = null;
      cancelAnimationFrame(progressTimer);
      progressTimer = requestAnimationFrame(updateProgress);
    }

    function pauseAutoPlay() {
      isPlaying = false;
      playPauseIcon.className = 'fa-solid fa-play';
      playPauseText.textContent = 'RESUME';
      cancelAnimationFrame(progressTimer);
      // capture elapsed time to resume cleanly
      if (startTime) {
        const effectiveDuration = baseDuration / currentSpeed;
        const currentFill = document.getElementById(`bar-fill-${currentIndex}`);
        const currentWidthPct = currentFill ? parseFloat(currentFill.style.width || 0) : 0;
        elapsedBeforePause = (currentWidthPct / 100) * effectiveDuration;
      }
    }

    function togglePlayPause() {
      if (isPlaying) {
        pauseAutoPlay();
      } else {
        startAutoPlay();
      }
    }

    function nextSlide() {
      if (currentIndex < LEADERBOARDS.length - 1) {
        jumpToSlide(currentIndex + 1);
      } else {
        jumpToSlide(0);
      }
    }

    function prevSlide() {
      if (currentIndex > 0) {
        jumpToSlide(currentIndex - 1);
      } else {
        jumpToSlide(LEADERBOARDS.length - 1);
      }
    }

    function jumpToSlide(index) {
      currentIndex = index;
      elapsedBeforePause = 0;
      startTime = null;
      renderSlide(currentIndex);
      if (isPlaying) {
        cancelAnimationFrame(progressTimer);
        progressTimer = requestAnimationFrame(updateProgress);
      } else {
        // visually update bars
        for (let i = 0; i < LEADERBOARDS.length; i++) {
          const fill = document.getElementById(`bar-fill-${i}`);
          if (fill) fill.style.width = i < currentIndex ? '100%' : '0%';
        }
      }
    }

    /**
     * Speed Control Cycle
     */
    function cycleSpeed() {
      const speeds = [1.0, 1.5, 0.75];
      const curIdx = speeds.indexOf(currentSpeed);
      currentSpeed = speeds[(curIdx + 1) % speeds.length];
      speedBtn.textContent = `${currentSpeed}x`;
      showToast(`Speed set to ${currentSpeed}x`);

      if (isPlaying) {
        cancelAnimationFrame(progressTimer);
        startTime = null;
        elapsedBeforePause = 0;
        progressTimer = requestAnimationFrame(updateProgress);
      }
    }

    /**
     * Drawer Navigation & Search Filter
     */
    function buildDrawerList() {
      drawerList.innerHTML = '';
      LEADERBOARDS.forEach((item, idx) => {
        const row = document.createElement('div');
        row.className = `p-2.5 rounded-xl border transition flex items-center justify-between cursor-pointer ${idx === currentIndex ? 'bg-amber-500/20 border-amber-400 text-white' : 'bg-slate-900/60 border-slate-800 text-slate-300 hover:bg-slate-800/80'}`;
        row.dataset.index = idx;
        row.innerHTML = `
          <div class="flex items-center gap-2.5 min-w-0">
            <span class="w-6 h-6 rounded-md bg-slate-800 flex items-center justify-center text-xs font-mono font-bold text-amber-400">${idx + 1}</span>
            <div class="truncate">
              <div class="text-xs font-bold truncate">${item.title}</div>
              <div class="text-[10px] text-slate-400 truncate">${item.subtitle}</div>
            </div>
          </div>
          <span class="text-[10px] font-semibold text-slate-400 shrink-0 ml-2">${item.badge}</span>
        `;
        row.onclick = () => {
          jumpToSlide(idx);
          closeDrawer();
        };
        drawerList.appendChild(row);
      });
    }

    function updateDrawerSelection() {
      Array.from(drawerList.children).forEach((child, idx) => {
        if (idx === currentIndex) {
          child.className = 'p-2.5 rounded-xl border transition flex items-center justify-between cursor-pointer bg-amber-500/20 border-amber-400 text-white';
        } else {
          child.className = 'p-2.5 rounded-xl border transition flex items-center justify-between cursor-pointer bg-slate-900/60 border-slate-800 text-slate-300 hover:bg-slate-800/80';
        }
      });
    }

    function openDrawer() {
      drawer.classList.remove('translate-y-full');
      searchInput.value = '';
      filterDrawer('');
    }

    function closeDrawer() {
      drawer.classList.add('translate-y-full');
    }

    function filterDrawer(query) {
      const q = query.toLowerCase().trim();
      Array.from(drawerList.children).forEach((child) => {
        const idx = parseInt(child.dataset.index, 10);
        const data = LEADERBOARDS[idx];
        const matchTitle = data.title.toLowerCase().includes(q);
        const matchSub = data.subtitle.toLowerCase().includes(q);
        const matchBadge = data.badge.toLowerCase().includes(q);
        const matchItems = JSON.stringify(data.items).toLowerCase().includes(q);
        if (matchTitle || matchSub || matchBadge || matchItems) {
          child.style.display = 'flex';
        } else {
          child.style.display = 'none';
        }
      });
    }

    /**
     * Toast Notifications
     */
    let toastTimeout = null;
    function showToast(message) {
      toastMsg.textContent = message;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 2000);
    }

    /**
     * Copy / Share Current Leaderboard
     */
    function copyLeaderboardSummary() {
      const data = LEADERBOARDS[currentIndex];
      let summaryText = `♟️ Chess Tournament Leaderboard: ${data.title}\n${data.subtitle}\n\n`;

      if (data.type === 'featured') {
        const c = data.items[0];
        summaryText += `👑 #1 ${c.name} (${c.dept}) — ${c.score}\n${data.extraInfo}\n`;
      } else if (data.type === 'matchup') {
        data.items.forEach(it => {
          summaryText += `${it.rank}. ${it.p1} vs ${it.p2} (${it.res}) [${it.stat}]\n`;
        });
      } else if (data.type === 'rivalry') {
        data.items.forEach(it => {
          summaryText += `${it.rank}. ${it.p1} (${it.d1}) vs ${it.p2} (${it.d2}) - ${it.score}\n`;
        });
      } else {
        data.items.forEach(it => {
          summaryText += `${it.rank}. ${it.name} (${it.dept}) — ${it.score} ${data.unit}\n`;
        });
      }

      summaryText += `\nCheck out the Vertical Chess Reel Hall of Fame!`;

      // Fallback copy execCommand for iframe compatibility
      const dummy = document.createElement("textarea");
      document.body.appendChild(dummy);
      dummy.value = summaryText;
      dummy.select();
      document.execCommand("copy");
      document.body.removeChild(dummy);

      showToast("Leaderboard copied to clipboard!");
    }

    /**
     * Setup Event Listeners
     */
    function initListeners() {
      // Tap navigation zones
      document.getElementById('tapLeft').onclick = () => {
        prevSlide();
      };
      document.getElementById('tapRight').onclick = () => {
        nextSlide();
      };

      // Playback dock
      playPauseBtn.onclick = togglePlayPause;
      prevBtn.onclick = prevSlide;
      nextBtn.onclick = nextSlide;
      speedBtn.onclick = cycleSpeed;
      shareSlideBtn.onclick = copyLeaderboardSummary;

      // Drawer
      drawerToggleBtn.onclick = openDrawer;
      closeDrawerBtn.onclick = closeDrawer;
      searchInput.oninput = (e) => filterDrawer(e.target.value);

      // Sound FX
      soundBtn.onclick = () => {
        sound.init();
        sound.enabled = !sound.enabled;
        if (sound.enabled) {
          soundIcon.className = 'fa-solid fa-volume-high text-cyan-400';
          showToast('Sound effects enabled');
          sound.playTrophy();
        } else {
          soundIcon.className = 'fa-solid fa-volume-xmark text-rose-400';
          showToast('Muted');
        }
      };

      // Keyboard Controls
      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' || e.key === 'Space') {
          e.preventDefault();
          if (e.key === 'Space') togglePlayPause();
          else nextSlide();
        } else if (e.key === 'ArrowLeft') {
          e.preventDefault();
          prevSlide();
        } else if (e.key === 'Escape') {
          closeDrawer();
        }
      });

      // Touch Swipe Gesture Support
      let touchStartX = 0;
      let touchStartY = 0;
      slideStage.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
      }, { passive: true });

      slideStage.addEventListener('touchend', (e) => {
        const touchEndX = e.changedTouches[0].screenX;
        const touchEndY = e.changedTouches[0].screenY;
        const diffX = touchEndX - touchStartX;
        const diffY = touchEndY - touchStartY;

        // Ensure horizontal swipe is dominant
        if (Math.abs(diffX) > 40 && Math.abs(diffX) > Math.abs(diffY)) {
          if (diffX < 0) {
            nextSlide(); // swipe left -> next
          } else {
            prevSlide(); // swipe right -> prev
          }
        }
      }, { passive: true });
    }

    // Initialize application on window load
    window.onload = function () {
      initProgressBars();
      buildDrawerList();
      initListeners();
      renderSlide(0);
      startAutoPlay();
    };
  </script>
</body>

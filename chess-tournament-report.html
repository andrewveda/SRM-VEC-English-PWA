<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>First Move · 60-second kinetic recap</title>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Familjen+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#07080b;--ink:#f4f1ea;--mut:#9AA3B2;--gold:#D9B75B;--red:#E0566B;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{height:100%;background:var(--bg);color:var(--ink);font:500 16px 'Familjen Grotesk',system-ui,sans-serif;overflow:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:50}
#app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:0 12px}
#box{position:relative;flex:none;overflow:hidden;border-radius:10px;box-shadow:0 20px 60px #000a}
body.fs #app{padding:0}body.fs #box{border-radius:0;box-shadow:none}body.fs #ctl{display:none}
#st{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;background:#0b0d12;--a:#D9B75B;cursor:pointer}
#bg{position:absolute;inset:0;background:repeating-conic-gradient(#ffffff09 0 25%,transparent 0 50%) 0 0/80px 80px;animation:pan 7s linear infinite}
#gl{position:absolute;inset:0;background:radial-gradient(circle at 15% 115%,color-mix(in srgb,var(--a) 40%,transparent),transparent 55%),radial-gradient(ellipse at center,transparent 45%,#000b 100%);transition:background .6s}
.sw{position:absolute;inset:0;animation:zoom 7s linear both}
.p{position:absolute}
.D{font-family:'Big Shoulders Display',Impact,'Arial Narrow',sans-serif;font-weight:900;text-transform:uppercase;line-height:.88}
.s{font-weight:700;letter-spacing:.25em;text-transform:uppercase;font-size:22px;color:var(--mut)}
.a,[data-a]{animation-name:var(--an,rise);animation-duration:var(--du,.8s);animation-delay:var(--d,0s);animation-fill-mode:both;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
.ch{display:inline-block;font-style:normal;animation:drop .85s cubic-bezier(.2,.9,.2,1.1) both;animation-delay:calc(var(--d,0s) + var(--i)*50ms)}
.n{font:inherit;color:inherit}
.gp{position:absolute;right:-90px;top:-120px;font-size:900px;line-height:1;color:var(--a);animation:gp 7s ease-out both;pointer-events:none}
.mq{position:absolute;left:0;white-space:nowrap;font:900 230px/1 'Big Shoulders Display',Impact,sans-serif;color:transparent;-webkit-text-stroke:2px #ffffff16;pointer-events:none}
.mq span{display:inline-block;animation:mq 28s linear infinite}
.tile{width:560px;height:260px;border-left:8px solid var(--a);padding-left:28px}
.bar{height:60px;background:var(--a);transform-origin:0 50%;animation:grow 1s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}
.row{display:flex;align-items:center;gap:20px}
#mo{position:absolute;inset:0;display:grid;grid-template:repeat(9,1fr)/repeat(16,1fr);pointer-events:none;z-index:9}
#mo i{transform:scale(0)}#mo.go i{animation:mo .9s ease-in-out both;animation-delay:var(--d)}
#pb{position:absolute;left:0;bottom:0;height:6px;background:var(--a);z-index:10}
#st.p *{animation-play-state:paused!important}
@keyframes drop{from{opacity:0;transform:translateY(-150%) rotate(-14deg) scale(1.5)}55%{opacity:1}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(70px)}to{opacity:1;transform:none}}
@keyframes slam{0%{opacity:0;transform:scale(3.4)}55%{opacity:1;transform:scale(.93)}75%{transform:scale(1.05)}100%{opacity:1;transform:none}}
@keyframes sl{from{opacity:0;transform:translateX(-420px)}to{opacity:1;transform:none}}
@keyframes sr{from{opacity:0;transform:translateX(420px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0)}}
@keyframes pop{0%{opacity:0;transform:scale(0) rotate(-90deg)}70%{transform:scale(1.35) rotate(8deg)}100%{opacity:1;transform:none}}
@keyframes mq{to{transform:translateX(-50%)}}
@keyframes pan{to{background-position:160px 80px}}
@keyframes zoom{to{transform:scale(1.06)}}
@keyframes gp{from{opacity:0;transform:scale(1.6) rotate(-25deg)}to{opacity:.08;transform:scale(1) rotate(0)}}
@keyframes mo{0%{transform:scale(0)}35%,58%{transform:scale(1.04)}100%{transform:scale(0)}}
@keyframes out{to{opacity:0;transform:scale(.5) translateY(-60px)}}
@keyframes ring{from{opacity:.9;transform:scale(.2)}to{opacity:0;transform:scale(3)}}
#ctl{width:100%;max-width:760px;flex:none}
#seg{display:flex;gap:3px;height:22px;align-items:center}
#seg s{flex:1;height:6px;background:#ffffff22;border-radius:3px;overflow:hidden;cursor:pointer;text-decoration:none;position:relative}
#seg s i{display:block;height:100%;width:0;background:var(--gold)}
#bt{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:6px}
#bt button{font:inherit;font-size:20px;min-width:48px;height:48px;border:0;border-radius:14px;background:#ffffff16;color:var(--ink)}
#bt button:active{background:#ffffff30}#tm{min-width:92px;text-align:center;color:var(--mut);font-variant-numeric:tabular-nums}
#hint{text-align:center;color:var(--mut);font-size:13px;margin-top:8px}
</style></head><body>
<div id="app"><div id="box"><div id="st"><div id="bg"></div><div id="gl"></div><div id="scn"></div><div id="mo"></div><div id="pb"></div></div></div>
<div id="ctl"><div id="seg"></div><div id="bt"><button id="pv" aria-label="Previous">⏮</button><button id="pp" aria-label="Play or pause">⏸</button><button id="nx" aria-label="Next">⏭</button><span id="tm">0:00 / 1:00</span><button id="fsb" aria-label="Full screen">⛶</button></div>
<p id="hint">Plays automatically · tap the screen to pause · tap left/right edges to step · ⛶ fills your phone in landscape</p></div></div>
<script>
const $=s=>document.querySelector(s),st=$('#st'),scn=$('#scn'),box=$('#box'),mo=$('#mo');
const GOLD='#D9B75B',RED='#E0566B',V='\uFE0E';
const K=(t,d=0)=>[...t].map((c,i)=>`<i class=ch style="--i:${i};--d:${d}s">${c==' '?'&nbsp;':c}</i>`).join('');
const a=(an,d,x='',du)=>`data-a style="--an:${an};--d:${d}s;${du?'--du:'+du+'s;':''}${x}"`;

const mq=(t,y,r)=>`<div class=mq style="top:${y}px"><span style="animation-direction:${r?'reverse':'normal'}">${(t+' ').repeat(10)}</span></div>`;

const grid=(it,sz,foot)=>it.map((t,i)=>`<div class="p tile a" style="--an:${i%2?'sr':'sl'};--d:${.2+i*.35}s;--du:.9s;left:${i%2?650:70}px;top:${i<2?85:370}px"><div class=D style="font-size:${sz}px;color:var(--a)">${N(t.to,{dec:t.dec,p:t.p,d:.3+i*.35,dur:1.8})}</div><div class=s style="color:var(--ink);margin-top:8px">${t.l}</div><div style="color:var(--mut);font-size:21px;margin-top:6px">${t.sub||''}</div></div>`).join('')+(foot?`<div class="p s" ${a('rise',2.2,'left:70px;right:70px;top:662px;text-align:center;font-size:20px')}>${foot}</div>`:'');
const bars=(rows,max,w,o={})=>rows.map((r,i)=>`<div class="p row" style="left:70px;right:70px;top:${o.y+i*o.h}px;height:${o.h-12}px"><div class="D a" ${a('sl',.2+i*.18,`width:${o.nw}px;font-size:${o.f}px;${i?'':'color:var(--a)'}`)}>${r[0]}</div><div class=bar style="width:${r[1]/max*w}px;height:${o.h-30}px;--d:${.4+i*.18}s;${i?'opacity:.5':''}"></div><div class="D a" ${a('slam',1+i*.18,`font-size:${o.f}px`)}>${N(r[1],{dec:r[2]||0,d:.5+i*.18,dur:1.4})}</div></div>`).join('');
const ACC=[GOLD,RED];
const SC=[
// 0 title
()=>`${gp('♟')}${mq('FIRST MOVE',30)}${mq('FIRST MOVE',470,1)}<div class="p D" style="left:0;right:0;top:80px;text-align:center;font-size:290px">${K('FIRST')}</div><div class="p D" style="left:0;right:0;top:325px;text-align:center;font-size:290px;color:var(--a)">${K('MOVE',.5)}</div><div class="p s" ${a('rise',1.7,'left:0;right:0;top:632px;text-align:center;color:var(--ink);font-size:21px')}>SRM VEC Chess Club · First-Year Tournaments · 24 Oct 2026</div>`,
// 1 big three
()=>`${gp('♞')}${mq('GAMES PLAYERS EVENTS',560,1)}<div class="p" style="left:0;right:0;top:130px;display:flex;justify-content:center;align-items:flex-end;gap:70px">${[[4,'Events',.2,260,'var(--ink)'],[91,'Players',1,300,'var(--ink)'],[419,'Games',1.8,420,'var(--a)']].map(([n,l,d,sz,c])=>`<div ${a('slam',d,'text-align:center',.7)}><div class=D style="font-size:${sz}px;color:${c}">${N(n,{d,dur:1.4})}</div><div class=s style="color:var(--ink)">${l}</div></div>`).join('')}</div><div class="p s" ${a('rise',3.1,'left:0;right:0;top:640px;text-align:center')}>One day · four tournaments · every board counted</div>`,
// 2 scale
()=>`${gp('♜')}${grid([{to:11654,l:'Moves played'},{to:34.3,dec:1,l:'Hours of chess (≈)'},{to:5755,l:'Pieces captured'},{to:2644,l:'Checks given'}],185,'243 castles · 118 pawns promoted · 13 mates in 4 moves or fewer')}`,
// 3 white vs black
()=>`${gp('♚')}<div class="p D" style="left:70px;top:40px;font-size:150px;color:var(--a)">${K('WHITE')}</div><div class="p D" style="right:70px;top:40px;font-size:150px">${K('BLACK',.4)}</div><div class="p" ${a('wipe',.9,'left:70px;right:70px;top:250px;height:120px;display:flex;border:3px solid var(--ink)',1.3)}><div style="flex:202;background:var(--gold)"></div><div style="flex:33;background:#9AA3B2"></div><div style="flex:184;background:#1b1e27"></div></div><div class="p D" style="left:70px;top:395px;font-size:210px;color:var(--a)">${N(48,{s:'%',d:1.6})}</div><div class="p D" style="left:0;right:0;text-align:center;top:470px;font-size:100px;color:var(--mut)">${N(8,{s:'%',d:1.8})}</div><div class="p D" style="right:70px;top:395px;font-size:210px">${N(44,{s:'%',d:2})}</div><div class="p s" ${a('rise',2.6,'left:0;right:0;top:640px;text-align:center;color:var(--ink);font-size:24px')}>202 white wins · 33 draws · 184 black wins — the first move is worth 18 games</div>`,
// 4 endings
()=>`${gp('♛')}<div class="p D" style="left:70px;top:28px;font-size:84px">${K('63% ended in ',0)}<span style="color:var(--a)">${K('checkmate',.7)}</span></div>${bars([['CHECKMATE',264],['TIMEOUT',66],['DRAW',32],['ABANDONED',30],['RESIGNATION',27]],264,600,{y:140,h:112,nw:420,f:76})}`,
// 5 events
()=>`<div class="p D" style="left:60px;top:25px;font-size:76px">${K('Four events. ',0)}<span style="color:var(--a)">${K('one day.',.7)}</span></div>${[['Swiss',134,54,'C Karnesh Raja','7.5 pts'],['Rapid',89,28,'Navein A','30 pts'],['Blitz',64,29,'Mohana Krishna Murthy S','26 pts'],['Bullet',132,30,'Thilak Eswaran S','69 pts']].map((e,i)=>`<div class="p a" ${a('rise',.3+i*.4,`left:${60+i*295}px;top:130px;width:275px;height:545px;padding:22px;background:#ffffff0c;border-top:7px solid ${i%2?'var(--red)':'var(--gold)'}`,.9)}><div class=D style="font-size:76px;color:${i%2?'var(--red)':'var(--gold)'}">${e[0]}</div><div class=D style="font-size:170px;margin-top:14px">${N(e[1],{d:.6+i*.4,dur:1.5})}</div><div class=s>Games · ${e[2]} players</div><div style="height:2px;background:#ffffff30;margin:22px 0"></div><div class=s style="font-size:15px">Top registered finisher</div><div style="font-size:31px;font-weight:700;line-height:1.1;margin:8px 0 10px">${e[3]}</div><div class=D style="font-size:58px;color:${i%2?'var(--red)':'var(--gold)'}">${e[4]}</div></div>`).join('')}`,
// 6 Thilak
()=>`${gp('♟')}<div class="p s" ${a('rise',0,'left:70px;top:36px;color:var(--a)')}>Bullet · a perfect run</div><div class="p D" ${a('slam',.3,'left:60px;top:60px;font-size:420px;color:var(--a)',.8)}>${N(18,{d:.4,dur:1.2})}–0</div><div class="p D" style="left:70px;top:410px;font-size:96px">${K('Thilak Eswaran S',1)}</div><div class="p s" ${a('rise',2.2,'left:70px;top:512px;color:var(--ink);font-size:21px')}>ECE-3 · 100% win rate · 15 checkmates · unbeaten</div><div class="p" style="left:70px;top:585px;display:flex;gap:9px">${Array.from({length:18},(_,i)=>`<i class=a style="--an:pop;--d:${1.4+i*.07}s;width:56px;height:56px;background:var(--a);display:grid;place-items:center;color:#000;font:900 30px sans-serif;font-style:normal">✓</i>`).join('')}</div>`,
// 7 first move
()=>`${gp('♙')}<div class="p s" ${a('rise',0,'left:70px;top:44px;color:var(--ink)')}>White's favourite first move</div><div class="p D" style="left:50px;top:80px;font-size:470px;color:var(--a);text-transform:none">${K('e4')}</div><div class="p D" style="left:70px;top:520px;font-size:100px">${N(208,{d:.8})} <span style="font-size:48px;color:var(--mut)">games</span></div>${bars([['e4',208],['d4',65],['e3',39],['Nf3',24],['g3',12],['Nh3',10]].map(r=>r),208,300,{y:90,h:88,nw:130,f:60}).replace(/left:70px;right:70px/g,'left:640px;right:60px')}<div class="p s" ${a('rise',2.4,'left:70px;top:650px;color:var(--ink);font-size:20px')}>Most played line: 1.e4 e5 2.Nf3 · 34 games</div>`,
// 8 departments
()=>`${gp('♝')}<div class="p D" style="left:70px;top:24px;font-size:84px">${K('Department ',0)}<span style="color:var(--a)">${K('race',.7)}</span></div>${bars([['CSE – 2',202.5,1],['EIE',88],['ECE – 3',81.5,1],['AI & DS – 1',70.5,1],['IT – 2',67],['ECE – 2',63]],202.5,560,{y:125,h:90,nw:380,f:60})}<div class="p s" ${a('rise',2.2,'left:70px;top:672px;font-size:18px')}>Total tournament points · CSE-2 fielded 27 of its 41 registered players</div>`,
// 9 hall of fame
()=>`${gp('♜')}${[['Most games played','Rajaraman B',35],['Most wins','Rajaraman B',21],['Most checkmates','Thilak Eswaran S',15],['Highest rating on the day','Gokul G',1205],['Giant slayer · wins vs 100+ higher','Taresh Infant S',3]].map((r,i)=>`<div class="p row" style="left:70px;right:70px;top:${42+i*124}px;height:112px;border-bottom:2px solid #ffffff22;gap:26px"><div class="s a" ${a('sl',.15+i*.55,'width:300px;font-size:21px;line-height:1.3;color:var(--ink)',.7)}>${r[0]}</div><div class="D a" ${a(i%2?'sr':'sl',.25+i*.55,'flex:1;font-size:82px',.8)}>${r[1]}</div><div class="D a" ${a('slam',.5+i*.55,'font-size:112px;color:var(--a)',.7)}>${N(r[2],{d:.6+i*.55,dur:1})}</div></div>`).join('')}`,
// 10 records
()=>`${gp('♞')}${grid([{to:92,l:'Moves · longest game',sub:'Kapilesh Vendhan vs A Kohulan · a rapid draw'},{to:3,l:'Moves · fastest checkmate',sub:'Thilak Eswaran S, in 8 seconds'},{to:630,p:'+',l:'Rating points · biggest upset',sub:'T Lakshitha Devi (212) beat N. Dhivakaran (842)'},{to:30,l:'Captures · bloodiest game',sub:'Ragavi. E vs Acholu Pranay Kumar Reddy'}],170)}`,
// 11 outro
()=>`${mq('THANK YOU',500,1)}<div class="p D" style="left:70px;top:50px;font-size:165px;color:var(--ink)">${K('419 games.')}</div><div class="p D" style="left:70px;top:205px;font-size:165px;color:var(--a)">${K('91 players.',.6)}</div><div class="p D" style="left:70px;top:360px;font-size:165px">${K('One day.',1.2)}</div><div class="p" style="left:900px;top:80px;width:320px;height:520px;text-align:center;font-size:330px;line-height:1;color:var(--a)"><div ${a('rise',.8,'position:absolute;left:0;right:0;top:120px;animation-name:rise,out;animation-duration:.9s,.4s;animation-delay:.8s,2.6s',1)}>♟${V}</div><div ${a('pop',2.8,'position:absolute;left:0;right:0;top:100px',.7)}>♛${V}</div><div class=a style="--an:ring;--d:2.8s;--du:1.2s;position:absolute;left:35px;top:150px;width:250px;height:250px;border:6px solid var(--a);border-radius:50%"></div></div><div class="p s" ${a('rise',3,'left:70px;top:600px;font-size:34px;color:var(--ink)')}>Thank you, first-years</div><div class="p s" ${a('rise',3.3,'left:70px;top:650px;font-size:20px')}>SRM VEC Chess Club</div>`
];
const DUR=[4,5,5.5,5,5,6.5,5,4.5,5,5,4.5,5];const S=[];let acc=0;DUR.forEach(d=>{S.push(acc);acc+=d});const TOT=acc;
const SW=.52;let T=0,P=0,cur=-1,sw=0,last=performance.now(),tmo,ended=0;
// mosaic cells
mo.innerHTML=Array.from({length:144},(_,i)=>{const x=i%16,y=(i/16)|0;return`<i style="--d:${(x+y)*8}ms;background:${(x+y)%2?'#12151c':'var(--a)'}"></i>`}).join('');
const seg=$('#seg');seg.innerHTML=DUR.map(d=>`<s style="flex:${d}"><i></i></s>`).join('');
[...seg.children].forEach((e,i)=>e.onclick=()=>go(i));
function fill(i){st.style.setProperty('--a',ACC[i%2]);scn.innerHTML=`<div class=sw>${SC[i]()}</div>`}
function set(i,anim){cur=i;clearTimeout(tmo);if(anim){sw=SW;mo.classList.remove('go');void mo.offsetWidth;mo.classList.add('go');tmo=setTimeout(()=>fill(i),SW*1000)}else{sw=0;fill(i)}}
function go(i,anim=1){i=Math.max(0,Math.min(DUR.length-1,i));T=S[i]+.001;ended=0;pause(0);set(i,anim)}
function pause(v){P=v;st.classList.toggle('p',!!v);$('#pp').textContent=ended?'↻':v?'▶':'⏸'}
const idx=t=>{let k=0;S.forEach((s,i)=>{if(t>=s)k=i});return k};
const fmt=(v,d)=>(+v).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
function fr(n){const dt=Math.min(.1,(n-last)/1000);last=n;
 if(!P&&!ended){T+=dt;if(T>=TOT){T=TOT;ended=1;pause(1)}else{const i=idx(T);if(i!==cur)set(i,1)}}
 const lt=T-S[cur]-sw;
 scn.querySelectorAll('.n').forEach(e=>{const to=+e.dataset.to,p=Math.max(0,Math.min(1,(lt-e.dataset.d)/e.dataset.dur)),v=to*(1-Math.pow(1-p,4));e.textContent=e.dataset.p+fmt(v,+e.dataset.dec)+e.dataset.s});
 [...seg.children].forEach((e,i)=>e.firstChild.style.width=(i<cur?100:i==cur?Math.min(100,(T-S[i])/DUR[i]*100):0)+'%');
 $('#pb').style.width=T/TOT*100+'%';const m=Math.floor(T);$('#tm').textContent=`0:${String(m).padStart(2,'0')} / 1:00`;
 requestAnimationFrame(fr)}
// layout: fit 16:9 stage; rotate in portrait full-screen
function fit(){const W=innerWidth,H=innerHeight,fs=document.body.classList.contains('fs'),rot=fs&&H>W;let s,w,h,t;
 if(fs){s=rot?Math.min(H/1280,W/720):Math.min(W/1280,H/720)}else{const ch=$('#ctl').offsetHeight+24;s=Math.min((W-24)/1280,(H-ch-30)/720)}
 w=rot?720*s:1280*s;h=rot?1280*s:720*s;box.style.width=w+'px';box.style.height=h+'px';
 st.style.transform=rot?`translateX(${720*s}px) rotate(90deg) scale(${s})`:`scale(${s})`;box.dataset.rot=rot?1:''}
addEventListener('resize',fit);
box.addEventListener('click',e=>{const r=box.getBoundingClientRect(),f=box.dataset.rot?(e.clientY-r.top)/r.height:(e.clientX-r.left)/r.width;
 if(f<.22)go(Math.max(0,cur-(T-S[cur]>1.2?0:1)));else if(f>.78)go(cur+1);else{if(ended){go(0,0)}else pause(P?0:1)}});
$('#pv').onclick=()=>go(cur-(T-S[cur]>1.2?0:1));$('#nx').onclick=()=>go(cur+1);
$('#pp').onclick=()=>{if(ended)go(0,0);else pause(P?0:1)};
$('#fsb').onclick=()=>{const b=document.body,on=b.classList.toggle('fs');if(on){(document.documentElement.requestFullscreen||(()=>0)).call(document.documentElement);try{screen.orientation.lock('landscape').catch(()=>0)}catch(e){}}else if(document.fullscreenElement)document.exitFullscreen();fit()};
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&document.body.classList.contains('fs')){document.body.classList.remove('fs');fit()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&!ended)pause(1)});

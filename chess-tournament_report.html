html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 'Familjen Grotesk',system-ui,sans-serif;font-variant-numeric:tabular-nums}

header{padding:18px 14px 0;max-width:1100px;margin:auto}
.board{height:16px;background:repeating-conic-gradient(var(--ink) 0 25%,transparent 0 50%) 0 0/16px 16px;border-radius:3px;opacity:.9}

main{max-width:1100px;margin:auto;padding:6px 14px 40px}
h2{font-size:1.15rem;margin:22px 0 8px}
.c{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:14px}
.k div{border-left:3px solid var(--acc);padding:0 10px}.k b{font-size:1.8rem;display:block;line-height:1.1}.k small,td small,.mut{color:var(--mut)}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}

td small{display:block;font-size:.75rem}tr[data-p]{cursor:pointer}tr[data-p]:hover td{background:var(--bg)}
.bad{color:var(--bad)}.pl{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}.rb td{background:var(--badbg)}
.tag{font-style:normal;font-size:.7rem;border:1px solid var(--bad);color:var(--bad);border-radius:4px;padding:0 4px;margin-left:4px}
.br{display:grid;grid-template-columns:105px 1fr 38px;gap:8px;align-items:center;font-size:.85rem;margin:5px 0}
.br div{background:var(--line);height:10px;border-radius:5px;overflow:hidden}.br i{display:block;height:100%;background:var(--acc)}.br b{text-align:right}
.st{display:flex;height:24px;border-radius:6px;overflow:hidden;min-width:90px}.st span{display:grid;place-items:center;font-size:.72rem;color:#fff;overflow:hidden}
.ev{display:flex;gap:6px;overflow-x:auto;margin:12px 0}
input[type=search],textarea{font:inherit;width:100%;box-sizing:border-box;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);margin:8px 0}
textarea{min-height:110px}
.btn{font:inherit;background:var(--acc);color:#fff;border:0;border-radius:8px;padding:9px 16px;cursor:pointer}
.btn.o{background:none;color:var(--ink);border:1px solid var(--line)}
ul{padding-left:18px;margin:6px 0}li{margin:6px 0}
dialog{width:min(640px,94vw);max-height:88vh;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);padding:14px}
dialog::backdrop{background:rgba(0,0,0,.5)}
.warn{border-left:4px solid var(--bad);background:var(--badbg);padding:8px 12px;border-radius:6px}
.bad-note{color:var(--bad)}

 asc=f=>[...g].sort((a,b)=>f(a)-f(b)),dsc=f=>asc(f).reverse(),ne=p=>Object.keys(p.ev).length;
 const up=g.filter(x=>x.res!=='1/2-1/2').map(x=>{const w=x.res==='1-0',wr=w?x.we:x.be,lr=w?x.be:x.we;return{...x,_d:lr-wr,_w:wr}}).filter(u=>u._d>0&&u._w>0).sort((a,b)=>b._d-a._d);

 const rv=Object.values(A.PR).filter(r=>r.n>1&&!r.a.bad&&!r.b.bad).sort((a,b)=>b.n-a.n).slice(0,5).map(r=>`<li>${nm(r.a)} vs ${nm(r.b)} <b>${r.n} games</b></li>`),hm=Math.max(...Object.values(hrs),1);
 return`<div class="rg">`+[
 card('Most games played',pl(top(p=>p.g),p=>p.g)),card('Most wins',pl(top(p=>p.w),p=>p.w)),card('Best win rate (8+ games)',pl(top(p=>p.w/p.g,5,p=>p.g>=8),p=>pct(p.w,p.g))),

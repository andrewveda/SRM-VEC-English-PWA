<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SRM VEC Chess Club Dashboard</title>
    
    <!-- Google Fonts for Aristocratic Theme -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <!-- PapaParse for parsing the live CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <!-- Chart.js for the Pie Chart -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --gold: #D4AF37;
            --gold-hover: #F3E5AB;
            --text-main: #E0E0E0;
            --text-muted: #A0A0A0;
            --font-heading: 'Cinzel', serif;
            --font-body: 'Playfair Display', serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-body);
            line-height: 1.6;
            padding: 20px;
            background-image: linear-gradient(45deg, #181818 25%, transparent 25%, transparent 75%, #181818 75%, #181818), 
                              linear-gradient(45deg, #181818 25%, transparent 25%, transparent 75%, #181818 75%, #181818);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            padding: 20px 0;
            border-bottom: 2px solid var(--gold);
        }

        h1 {
            font-family: var(--font-heading);
            color: var(--gold);
            font-size: 2rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
            align-items: center;
        }

        .action-btn {
            display: inline-block;
            width: 100%;
            max-width: 350px;
            padding: 12px 20px;
            background: linear-gradient(135deg, #2a2a2a, #1a1a1a);
            color: var(--gold);
            text-decoration: none;
            font-family: var(--font-heading);
            font-size: 1.1rem;
            border: 1px solid var(--gold);
            border-radius: 8px;
            text-transform: uppercase;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }

        .btn-time {
            display: block;
            margin-top: 2px;
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .action-btn.highlight {
            background: linear-gradient(135deg, #4A0E0E, #8B0000);
            color: #FFF;
            border-color: #FF4444;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(255, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 68, 68, 0); }
        }

        .action-btn:active {
            transform: scale(0.98);
            background: var(--gold);
            color: var(--bg-color);
        }

        .dashboard-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .total-participants {
            font-family: var(--font-heading);
            font-size: 1.8rem;
            color: var(--gold);
            background-color: rgba(30, 30, 30, 0.8);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid var(--gold);
            display: inline-block;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .chart-container {
            background-color: var(--card-bg);
            border: 1px solid #333;
            border-radius: 10px;
            padding: 20px;
            margin: 0 auto 30px auto;
            max-width: 400px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .chart-title {
            text-align: center;
            font-family: var(--font-heading);
            color: var(--gold);
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        #loading {
            text-align: center;
            font-style: italic;
            color: var(--gold);
            font-size: 1.2rem;
            margin: 40px 0;
        }

        /* Department Cards */
        .dept-card {
            background-color: var(--card-bg);
            border: 1px solid #333;
            border-radius: 10px;
            margin-bottom: 15px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .dept-header {
            padding: 18px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            background: linear-gradient(90deg, #1e1e1e, #2a2a2a);
            font-family: var(--font-heading);
            font-size: 1.1rem;
            border-bottom: 1px solid transparent;
            user-select: none;
        }

        .badge {
            background-color: var(--gold);
            color: var(--bg-color);
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 800;
            font-family: sans-serif;
            font-size: 0.9rem;
        }

        /* Student List */
        .student-list {
            display: none;
            padding: 0;
            margin: 0;
            list-style-type: none;
            counter-reset: student-counter;
        }

        .student-list.active {
            display: block;
            border-top: 1px solid #333;
        }

        .student-item {
            padding: 15px 20px;
            border-bottom: 1px solid #2a2a2a;
            cursor: pointer;
            counter-increment: student-counter;
        }

        .student-item::before {
            content: counter(student-counter) ". ";
            color: var(--gold);
            font-family: var(--font-heading);
            margin-right: 8px;
            font-weight: bold;
        }

        .student-item:last-child {
            border-bottom: none;
        }

        .student-name {
            font-size: 1.1rem;
            font-weight: 600;
        }

        /* Chess.com Username reveal */
        .username-reveal {
            display: none;
            margin-top: 8px;
            padding: 8px 12px;
            background-color: rgba(212, 175, 55, 0.1);
            border-left: 3px solid var(--gold);
            color: var(--gold-hover);
            font-family: sans-serif;
            font-size: 0.95rem;
            border-radius: 4px;
            animation: fadeIn 0.3s ease-in-out;
        }

        .username-reveal.active {
            display: block;
        }

        .chess-icon {
            font-size: 1.2rem;
            vertical-align: middle;
            margin-right: 5px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (min-width: 768px) {
            body { max-width: 800px; margin: 0 auto; }
            h1 { font-size: 2.5rem; }
            .action-btn:hover { background: var(--gold); color: var(--bg-color); cursor: pointer; }
            .dept-header:hover { background: #252525; }
            .student-item:hover { background-color: #222; }
        }
    </style>
</head>
<body>

    <header>
        <h1>♚ SRM VEC Chess Club ♛</h1>
        <div class="links-container">
            <a href="https://www.chess.com/club/srm-vec-chess-club" target="_blank" class="action-btn">⚔️ Club Page</a>
            <a href="https://www.chess.com/play/tournament/31197695" target="_blank" class="action-btn highlight">⚡ Join Rapid Tournament<span class="btn-time">(9:50 AM – 12:40 PM)</span></a>
            <a href="https://www.chess.com/play/tournament/31197753" target="_blank" class="action-btn highlight">🔥 Join Blitz Tournament<span class="btn-time">(1:50 PM – 2:45 PM)</span></a>
            <a href="https://www.chess.com/play/tournament/31197759" target="_blank" class="action-btn highlight">🚀 Join Bullet Tournament<span class="btn-time">(2:50 PM – 3:15 PM)</span></a>
            <a href="https://discord.gg/NhSEnyHMR" target="_blank" class="action-btn">💬 Join Discord</a>
            <a href="https://www.instagram.com/srm_vec_chess_club/" target="_blank" class="action-btn">📸 Instagram</a>
        </div>
    </header>

    <main>
        <div class="dashboard-header" id="stats-header" style="display: none;">
            <div class="total-participants">
                Total Warriors: <span id="total-count">0</span>
            </div>
            
            <div class="chart-container">
                <div class="chart-title">Preferred Time Format</div>
                <canvas id="timeFormatChart"></canvas>
            </div>
        </div>
        
        <div id="loading">Gathering Scrolls... (Loading Data)</div>
        <div id="dashboard-container"></div>
    </main>

    <script>
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS92CW8PrDmV5uUJgTnY2dVLAzB7jr68RypCa2biQGmzdT-mW-cn_7WetadozDNngatz7IJA87S3Wh7/pub?output=csv';

        Papa.parse(csvUrl, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('stats-header').style.display = 'block';
                processData(results.data);
            },
            error: function(err) {
                document.getElementById('loading').innerText = "Failed to load data. Please check the sheet link.";
            }
        });

        function processData(data) {
            const departments = {};
            const timeFormats = {};
            let totalParticipants = 0;
            
            // Dynamic column name detection
            let nameCol, deptCol, chessCol, timeCol;
            
            if(data.length > 0) {
                const keys = Object.keys(data[0]);
                keys.forEach(k => {
                    const lowerK = k.toLowerCase();
                    if (lowerK.includes('full name')) nameCol = k;
                    if (lowerK.includes('department')) deptCol = k;
                    if (lowerK.includes('chess.com')) chessCol = k;
                    if (lowerK.includes('time') || lowerK.includes('format')) timeCol = k;
                });
            }

            data.forEach(row => {
                const name = row[nameCol] ? row[nameCol].trim() : '';
                const dept = row[deptCol] ? row[deptCol].trim() : 'Unknown Department';
                const username = row[chessCol] ? row[chessCol].trim() : '';
                const timePref = (timeCol && row[timeCol]) ? row[timeCol].trim() : 'Not Specified';

                if (!name && !username) return; // Skip blank rows

                totalParticipants++;

                // Process Departments
                if (!departments[dept]) {
                    departments[dept] = [];
                }
                departments[dept].push({ name, username });

                // Process Time Formats
                if (!timeFormats[timePref]) {
                    timeFormats[timePref] = 0;
                }
                timeFormats[timePref]++;
            });

            // Update Total Count
            document.getElementById('total-count').innerText = totalParticipants;

            renderChart(timeFormats, totalParticipants);
            renderDashboard(departments);
        }

        function renderChart(timeFormats, total) {
            const ctx = document.getElementById('timeFormatChart').getContext('2d');
            
            const labels = [];
            const dataCounts = [];
            
            // Themed colors for the pie chart
            const backgroundColors = [
                '#D4AF37', // Gold
                '#C0C0C0', // Silver
                '#CD7F32', // Bronze
                '#8B0000', // Dark Red
                '#2F4F4F', // Dark Slate Gray
                '#4B0082'  // Indigo
            ];

            // Calculate numbers and percentages, setup labels
            Object.keys(timeFormats).forEach(format => {
                const count = timeFormats[format];
                const percentage = ((count / total) * 100).toFixed(1);
                // Shows "Format: count (percentage%)"
                labels.push(`${format}: ${count} (${percentage}%)`);
                dataCounts.push(count);
            });

            new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: labels,
                    datasets: [{
                        data: dataCounts,
                        backgroundColor: backgroundColors,
                        borderColor: '#1e1e1e',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                color: '#E0E0E0',
                                font: {
                                    family: "'Playfair Display', serif",
                                    size: 14
                                }
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return ` ${context.raw} players`;
                                }
                            }
                        }
                    }
                }
            });
        }

        function renderDashboard(departments) {
            const container = document.getElementById('dashboard-container');
            container.innerHTML = '';

            const sortedDepts = Object.keys(departments).sort();

            sortedDepts.forEach(dept => {
                const students = departments[dept];
                
                const card = document.createElement('div');
                card.className = 'dept-card';

                const header = document.createElement('div');
                header.className = 'dept-header';
                header.innerHTML = `
                    <span>🏛️ ${dept}</span>
                    <span class="badge">${students.length}</span>
                `;

                const list = document.createElement('ol');
                list.className = 'student-list';

                students.forEach(student => {
                    const li = document.createElement('li');
                    li.className = 'student-item';
                    
                    const nameSpan = document.createElement('span');
                    nameSpan.className = 'student-name';
                    nameSpan.innerText = student.name || "Unnamed";
                    
                    const usernameDiv = document.createElement('div');
                    usernameDiv.className = 'username-reveal';
                    usernameDiv.innerHTML = `<span class="chess-icon">♘</span> <strong>${student.username || 'No username provided'}</strong>`;

                    li.appendChild(nameSpan);
                    li.appendChild(usernameDiv);

                    li.addEventListener('click', (e) => {
                        e.stopPropagation(); 
                        usernameDiv.classList.toggle('active');
                    });

                    list.appendChild(li);
                });

                header.addEventListener('click', () => {
                    list.classList.toggle('active');
                });

                card.appendChild(header);
                card.appendChild(list);
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>

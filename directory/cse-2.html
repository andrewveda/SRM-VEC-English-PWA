<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student GitHub Dashboard</title>
<style>
:root{--bg:#f4f6fb;--c:#fff;--t:#1b2233;--m:#6b7590;--a:#5b5bf0;--g:#16a34a;--b:#e5e8f0}
@media(prefers-color-scheme:dark){:root{--bg:#0e1220;--c:#171d30;--t:#e8ecf8;--m:#8d97b5;--b:#262e48}}
*{box-sizing:border-box}body{font:15px system-ui,sans-serif;background:var(--bg);color:var(--t);padding:12px;max-width:900px;margin:auto}
h1{font-size:20px;margin:4px 0}h2{font-size:15px;margin:0 0 10px}.m{color:var(--m);font-size:12px}
.card{background:var(--c);border:1px solid var(--b);border-radius:16px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(min-width:640px){.grid{grid-template-columns:repeat(4,1fr)}}
.k{border-radius:16px;padding:14px;color:#fff}.k b{font-size:28px;display:block}.k span{font-size:12px}
.k1{background:linear-gradient(135deg,#5b5bf0,#8b5cf6)}.k2{background:linear-gradient(135deg,#16a34a,#22c55e)}.k3{background:linear-gradient(135deg,#f59e0b,#f97316)}.k4{background:linear-gradient(135deg,#e11d48,#f43f5e)}
.bars{display:flex;align-items:flex-end;gap:4px;height:110px}.bars div{flex:1;text-align:center;font-size:10px;color:var(--m);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bars i{display:block;background:var(--a);border-radius:5px 5px 0 0;min-height:2px;margin-bottom:3px}.bars em{font-style:normal;color:var(--t)}
input,button{font:inherit;padding:9px;border-radius:10px;border:1px solid var(--b);background:var(--c);color:var(--t);width:100%}button{background:var(--a);color:#fff;border:0;font-weight:600}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--b);cursor:pointer}.row:last-child{border:0}
.av{width:36px;height:36px;border-radius:50%;background:var(--b);flex:none}.grow{flex:1;min-width:0}.grow b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dots{display:flex;gap:3px}.dots s{width:9px;height:9px;border-radius:3px;background:var(--b)}.dots s.on{background:var(--g)}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--b)}.hot{background:#fde68a;color:#78350f}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{background:var(--c);color:var(--t);border:1px solid var(--b)}.tabs button.on{background:var(--a);color:#fff}
#d{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end}#d.s{display:flex}#d>div{background:var(--c);width:100%;max-height:85vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px;max-width:900px;margin:auto}
progress{width:100%}
</style></head><body>
<h1>📊 GitHub Class Dashboard</h1><div class="m" id="st">Loading…</div>
<div class="card"><div class="grid" id="kp"></div></div>
<div class="card"><h2>Settings</h2>
<div class="m">Inactive after <b id="dv">7</b> days without activity</div><input type="range" id="sl" min="1" max="30" value="7">
<button id="go" style="margin-top:8px">Refresh (only fetches data older than 1 hour)</button><progress id="pg" value="0" max="1" style="margin-top:8px"></progress></div>
<div class="card"><h2>Last 7 days (class total)</h2><div class="bars" id="w7"></div></div>
<div class="card"><h2>Trends</h2><div class="tabs"><button class="on" data-v="w">Weekly (12 wks)</button><button data-v="mo">Monthly (3 mo)</button></div><div class="bars" id="tr"></div><div class="m" style="margin-top:6px">GitHub's public feed only covers ~90 days / 100 events per student.</div></div>
<div class="card"><h2>🔥 Top streaks</h2><div id="sk"></div></div>
<div class="card"><h2>👩‍🎓 All students</h2><input id="q" placeholder="Search username…" style="margin-bottom:6px"><div id="al"></div></div>
<div class="card"><h2>⚠️ Needs your attention</h2><div class="m" id="sk2"></div></div>
<div class="card"><h2>😴 Inactive students</h2><div id="ia"></div></div>
<div class="card"><h2>📁 Repository activity</h2><div id="rp"></div></div>
<div id="d"><div id="dc"></div></div>
<script>
const USERS=["kameshh013", "kanishka1910", "karthikeyanskarthik694-hub", "karthi18sekar-sketch", "KasiViswanathan3112-dot", "kathiksha711", "kavinilakavi444-jpg", "kavitha403", "kavithashree-eng", "kaviyasri89474-collab", "Keerthimano3", "khajafahim", "keerthisri45123-sudo", "krithibas11-alt", "kishorevijayakanth126", "kohulan754-stack", "vxrshh14-era", "tlakshithadevi31-pixel", "lavanyaganesan166-ui", "lavanyaabinaya40-crypto", "lohendra12logu-sketch", "Lokeshwervk", "Maddyyyy-08", "madhukrishna0708", "madhumathis912-ctrl", "manishmari96", "achu1234nn", "mohammedmagthum8-web", "smohanakrishnamurthy-star", "Mugunthan1810", "mdnawfalriyaz2009-collab", "mukilansrinivas", "Nandita017", "Narendran-developer", "naveeenaa", "ambikasrini2007-source", "nithyapriya0008-rgb", "nivetha21102008-cmd", "niwin", "oviyaparthiban36-web", "pavithrasuresh5626-glitch", "philipjoshua221015-cpu", "beingpoornashri", "prabakar20", "prasanna29jk", "prasanthrajini-cpu", "praveenn19", "prawinkumark", "preethisri20", "princyj1015-pixel", "ragavkrishna950-gif", "Ragavi1904", "RagulNexus"];
const ROSTER=[["KALEELUR RAHMAN S", []], ["KAMESHH V", ["kameshh013"]], ["KANISHKA M", ["kanishka1910"]], ["KARTHIKEYAN S (14-03-2008)", ["karthikeyanskarthik694-hub"]], ["KARTHIKEYAN S (04-03-2009)", ["karthi18sekar-sketch"]], ["KASI VISWANATHAN", ["KasiViswanathan3112-dot"]], ["KATHIKSHA V", ["kathiksha711"]], ["KAVINILA M", ["kavinilakavi444-jpg"]], ["KAVITHA S", ["kavitha403"]], ["KAVITHASHREE B", ["kavithashree-eng"]], ["K KAVIYA SRI", ["kaviyasri89474-collab"]], ["KEERTHIKA M", ["Keerthimano3"]], ["KHAJA MOHIDEEN P", ["khajafahim"]], ["B KIRTHIKA SRI", ["keerthisri45123-sudo"]], ["B KIRUTHIKA", ["krithibas11-alt"]], ["KISHOR S S", []], ["KISHORE KUMAR D E", []], ["KISHORE V", ["kishorevijayakanth126"]], ["A KOHULAN", ["kohulan754-stack"]], ["KOWSHIK KAMAL L", []], ["KRISHNAVARSHINI S V", ["vxrshh14-era"]], ["T LAKSHITHA DEVI", ["tlakshithadevi31-pixel"]], ["LAVANYA G", ["lavanyaganesan166-ui"]], ["LAVANYA R", ["lavanyaabinaya40-crypto"]], ["LOHENDRA TG", ["lohendra12logu-sketch"]], ["LOKESHWER V K", ["Lokeshwervk"]], ["MADHAAVAN D", ["Maddyyyy-08"]], ["P MADHUKRISHNA", ["madhukrishna0708"]], ["MADHUMATHI S", ["madhumathis912-ctrl"]], ["MANISH M", ["manishmari96"]], ["MEGARSHITH PACHA", ["achu1234nn"]], ["MOHAMMED MAGTHUM P", ["mohammedmagthum8-web"]], ["MOHANA KRISHNA MURTHY S", ["smohanakrishnamurthy-star"]], ["MUGUNTHA PRIYAN S", ["Mugunthan1810"]], ["A MUHAMMAD NAWFAL RIYAZ", ["mdnawfalriyaz2009-collab"]], ["MUKILAN S", ["mukilansrinivas"]], ["NANDHINI M", []], ["R NANDITA", ["Nandita017"]], ["NARENDRAN K", ["Narendran-developer"]], ["NAVEENA M S", ["naveeenaa"]], ["NETHRA S", ["ambikasrini2007-source"]], ["NITHYAPRIYA S", ["nithyapriya0008-rgb"]], ["NIVETHA T", ["nivetha21102008-cmd"]], ["NIVETHA V", ["nivetha21102008-cmd"]], ["NIWIN KUMAR S", ["niwin"]], ["OVIYA P", ["oviyaparthiban36-web"]], ["PAVITHRA S", ["pavithrasuresh5626-glitch"]], ["PHILIP P", ["philipjoshua221015-cpu"]], ["POORNASHRI S", ["beingpoornashri"]], ["PRABAKAR A", ["prabakar20"]], ["PRASANNA KUMAR P", ["prasanna29jk"]], ["PRASANTH R", ["prasanthrajini-cpu"]], ["PRAVEEN KUMAR M", ["praveenn19"]], ["PRAWIN KUMAR K", ["prawinkumark"]], ["PREETHI SRI.A", ["preethisri20"]], ["PRINCY J", ["princyj1015-pixel"]], ["RAGAV KRISHNA V", ["ragavkrishna950-gif"]], ["RAGAVI E", ["Ragavi1904"]], ["RAGUL R", ["RagulNexus"]]];
const SKIPPED=["maddyyyyy_08 (underscore; maybe Maddyyyy-08)","lux_blackstar31","Kavi_D_tha","karthi18sekar@gmail.com","Megam (Pacman jr)","~25 display names with spaces/dots (e.g. Lokeshwer V K, lavanya.R, Naveena M S, Nethra.S)"];
const $=i=>document.getElementById(i),DAY=864e5,dk=d=>{d=new Date(d);return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()};
let S={};try{S=JSON.parse(localStorage.ghd||"{}")}catch(e){}
const days=n=>[...Array(n)].map((_,i)=>dk(Date.now()-(n-1-i)*DAY));
let P=[];
async function load(force){
 const tk="";
 let blocked=+(localStorage.ghb||0);
 if(Date.now()<blocked){$("st").textContent="Rate limit active until "+new Date(blocked).toLocaleTimeString()+" · showing cached data";render();return}
 const todo=USERS.filter(u=>!S[u]||Date.now()-S[u].t>36e5);let i=0;
 for(const u of todo){
  $("pg").value=++i/todo.length;$("st").textContent=`Fetching ${i}/${todo.length}…`;
  try{const hd={};if(tk)hd.Authorization="Bearer "+tk;if(S[u]?.etag)hd["If-None-Match"]=S[u].etag;
   const r=await fetch(`https://api.github.com/users/${u}/events/public?per_page=100`,{headers:hd});
   if(r.status==304)S[u].t=Date.now();
   else if(r.status==404)S[u]={t:Date.now(),s:"missing",e:[]};
   else if(r.status==403||r.status==429){const rs=+r.headers.get("x-ratelimit-reset")*1000||Date.now()+36e5;try{localStorage.ghb=rs}catch(e){}$("st").textContent="Rate limit hit. Will resume after "+new Date(rs).toLocaleTimeString()+" · showing cached data";render();return}
   else{const j=await r.json();S[u]={t:Date.now(),etag:r.headers.get("etag"),s:"ok",e:j.filter(e=>["PushEvent","PullRequestEvent","IssuesEvent"].includes(e.type)).map(e=>[e.created_at,e.repo.name,e.type=="PushEvent"?(e.payload.size||1):1])}}
  }catch(e){}
  try{localStorage.ghd=JSON.stringify(S)}catch(e){}
  if(i%10==0)render();
 }
 const ts=Object.values(S).map(s=>s.t);const old=ts.length?new Date(Math.min(...ts)):0;
 render();$("st").textContent=$("st").textContent+(old?` · oldest data ${old.toLocaleTimeString()} · auto-refresh hourly`:"")}
function bars(a,lab){const mx=Math.max(1,...a);return a.map((v,i)=>`<div><em>${v}</em><i style="height:${v/mx*80}px"></i>${lab[i]}</div>`).join("")}
function render(){
 const L=days(7),T=dk(Date.now()),lim=+$("sl").value;$("dv").textContent=lim;
 P=ROSTER.map(([n,ac,f])=>{const by={},repos={};let ok2=0,miss=0,last=0;
  ac.forEach(u=>{const s=S[u];if(s?.s=="ok")ok2=1;if(s?.s=="missing")miss++;(s?.e||[]).forEach(e=>{const k=dk(e[0]);by[k]=(by[k]||0)+e[2];repos[e[1]]=(repos[e[1]]||0)+e[2];last=Math.max(last,+new Date(e[0]))})});
  let st=0,c=Date.now();if(!by[T])c-=DAY;while(by[dk(c)]){st++;c-=DAY}
  return{u:n,ac,f,s:!ac.length?"nouser":ok2?"ok":miss==ac.length?"missing":"none",by,repos,st,last,w:L.map(d=>by[d]||0),ago:last?Math.floor((Date.now()-last)/DAY):999}});
 const ok=P.filter(p=>p.s=="ok"),act=ok.filter(p=>p.by[T]),tot=d=>ok.reduce((a,p)=>a+(p.by[d]||0),0),inact=ok.filter(p=>p.ago>=lim);
 $("kp").innerHTML=[["k1",tot(T),"Commits/PRs today"],["k2",act.length,"Active today"],["k3",Math.max(0,...ok.map(p=>p.st)),"Best streak (days)"],["k4",inact.length,"Inactive ("+lim+"d+)"]].map(k=>`<div class="k ${k[0]}"><b>${k[1]}</b><span>${k[2]}</span></div>`).join("");
 $("w7").innerHTML=bars(L.map(tot),L.map(d=>d.split("-").slice(1).join("/")));
 window.tot=tot;window.ok=ok;trend(document.querySelector(".tabs .on").dataset.v);
 const dots=p=>`<span class="dots">${p.w.map(v=>`<s class="${v?"on":""}"></s>`).join("")}</span>`;
 const row=p=>`<div class="row" onclick="det('${p.u}')"><img class="av" src="${p.ac[0]?`https://github.com/${p.ac[0]}.png?size=72`:''}" alt=""><div class="grow"><b>${p.u}</b><span class="m">${p.s=="nouser"?"no username yet":p.s=="missing"?"not found on GitHub":p.s=="none"?"not loaded yet":p.last?(p.ago?p.ago+"d ago":"active today"):"no recent activity"}${p.f==1?" · ⚠ confirm match":""}</span></div>${dots(p)}${p.st>1?`<span class="tag hot">🔥${p.st}</span>`:""}</div>`;
 $("sk").innerHTML=ok.filter(p=>p.st).sort((a,b)=>b.st-a.st).slice(0,8).map(row).join("")||'<span class="m">No active streaks</span>';
 $("ia").innerHTML=inact.sort((a,b)=>b.ago-a.ago).map(row).join("")||'<span class="m">Everyone is active 🎉</span>';
 const R={};ok.forEach(p=>Object.entries(p.repos).forEach(([r,n])=>{R[r]=R[r]||{n:0,u:new Set()};R[r].n+=n;R[r].u.add(p.u)}));
 $("rp").innerHTML=Object.entries(R).sort((a,b)=>b[1].n-a[1].n).slice(0,12).map(([r,v])=>`<div class="row" style="cursor:default"><div class="grow"><b>${r}</b><span class="m">${v.u.size} student(s)</span></div><span class="tag">${v.n}</span></div>`).join("")||'<span class="m">No data yet</span>';
 const q=$("q").value.toLowerCase();
 $("al").innerHTML=P.filter(p=>(p.u+p.ac.join()).toLowerCase().includes(q)).sort((a,b)=>b.last-a.last).map(row).join("");
 if(!$("st").textContent.startsWith("Rate")&&!$("st").textContent.startsWith("Fetch")&&!$("st").textContent.includes("cached"))$("st").textContent=`${ok.length}/${ROSTER.length} students loaded · ${P.filter(p=>p.s=="nouser").length} without username`}
function trend(v){const a=[],l=[];
 if(v=="w")for(let w=11;w>=0;w--){let n=0;for(let d=0;d<7;d++)n+=tot(dk(Date.now()-(w*7+d)*DAY));a.push(n);l.push(w?"-"+w:"now")}
 else for(let m=2;m>=0;m--){const x=new Date();x.setDate(1);x.setMonth(x.getMonth()-m);let n=0;ok.forEach(p=>Object.keys(p.by).forEach(k=>{const[y,mo]=k.split("-");if(+y==x.getFullYear()&&+mo==x.getMonth()+1)n+=p.by[k]}));a.push(n);l.push(x.toLocaleString("en",{month:"short"}))}
 $("tr").innerHTML=bars(a,l)}
window.det=u=>{const p=P.find(x=>x.u==u),L=days(14);$("dc").innerHTML=`<h2>${u}</h2><div class="m">${p.ac.join(', ')}</div><a href="https://github.com/${p.ac[0]||""}" target="_blank" class="m">Open on GitHub</a><p>Streak: <b>${p.st}</b> days</p><div class="bars">${L.map(d=>`<div><em>${p.by[d]||0}</em><i style="height:${Math.min(80,(p.by[d]||0)*8)}px"></i></div>`).join("")}</div><div class="m">Last 14 days</div><p>${Object.entries(p.repos).map(([r,n])=>`<div class="m">${r}: ${n}</div>`).join("")||"No recent activity"}</p><button onclick="$('d').classList.remove('s')">Close</button>`;$("d").classList.add("s")};
$("sl").oninput=render;$("q").oninput=render;$("go").onclick=()=>load();setInterval(load,36e5);
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("on"));b.classList.add("on");trend(b.dataset.v)});
const used=new Set(ROSTER.flatMap(r=>r[1]));
$("sk2").innerHTML=`<p><b>No username (${ROSTER.filter(r=>!r[1].length).length}):</b> ${ROSTER.filter(r=>!r[1].length).map(r=>r[0]).join(", ")}</p><p><b>⚠ Guessed matches, please confirm:</b> ${ROSTER.filter(r=>r[2]==1).map(r=>r[0]+" → "+r[1][0]).join("; ")}</p>`;render();load();
</script></body></html>

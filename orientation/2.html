<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Viewport settings for strict mobile optimization and disabling scaling/scrolling -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SRM VEC - Pre-Orientation Programme</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap');

        :root {
            --bg-gradient-top: #0a0f1d;
            --bg-gradient-bottom: #02040a;
            --accent-gold: #d4af37;
            --text-light: #f8f9fa;
            --text-dim: #a0aec0;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(212, 175, 55, 0.2);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100dvh; /* Uses dynamic viewport height */
            background: linear-gradient(135deg, var(--bg-gradient-top), var(--bg-gradient-bottom));
            font-family: 'Montserrat', sans-serif;
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Background subtle glow effect */
        .glow {
            position: absolute;
            top: -10%;
            left: -20%;
            width: 140%;
            height: 50%;
            background: radial-gradient(circle, rgba(212,175,55,0.05) 0%, rgba(0,0,0,0) 70%);
            z-index: 0;
            pointer-events: none;
        }

        .container {
            z-index: 1;
            width: 90%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4vh 0;
        }

        header {
            text-align: center;
            margin-bottom: 3vh;
        }

        h1 {
            font-size: clamp(1.1rem, 4vw, 1.5rem);
            font-weight: 600;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin: 0 0 5px 0;
            line-height: 1.3;
        }

        h2 {
            font-size: clamp(0.75rem, 3vw, 1rem);
            font-weight: 300;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin: 0;
        }

        .divider {
            width: 40px;
            height: 2px;
            background-color: var(--accent-gold);
            margin: 2vh auto;
            border-radius: 2px;
        }

        .link-grid {
            display: flex;
            flex-direction: column;
            gap: 2.2vh; /* Scales gap dynamically based on screen height */
            width: 100%;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 2.2vh 1rem;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            color: var(--text-light);
            text-decoration: none;
            font-size: clamp(0.9rem, 3.5vw, 1.1rem);
            font-weight: 400;
            letter-spacing: 1px;
            text-transform: uppercase;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .btn span {
            color: var(--accent-gold);
            margin-right: 10px;
            font-weight: 600;
        }

        /* Hover / Touch Active Effects */
        .btn:hover, .btn:active {
            background: var(--accent-gold);
            color: #000;
            border-color: var(--accent-gold);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.3);
        }

        .btn:hover span, .btn:active span {
            color: #000;
        }

        /* Day One button gets a slightly distinct treatment to mark it as the finale step */
        .btn.day-one {
            background: rgba(212, 175, 55, 0.08);
            border: 1px solid var(--accent-gold);
        }

        /* GitHub notice styling */
        .notice {
            width: 100%;
            margin-top: 3vh;
            padding: 1.6vh 1rem;
            background: var(--glass-bg);
            border: 1px dashed var(--glass-border);
            border-radius: 12px;
            text-align: center;
        }

        .notice p {
            margin: 0;
            font-size: clamp(0.7rem, 2.6vw, 0.85rem);
            font-weight: 300;
            line-height: 1.5;
            color: var(--text-dim);
            letter-spacing: 0.3px;
        }

        .notice strong {
            color: var(--accent-gold);
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="glow"></div>

    <div class="container">
        <header>
            <h1>SRM Valliammai<br>Engineering College</h1>
            <div class="divider"></div>
            <h2>Pre-Orientation</h2>
        </header>

        <div class="link-grid">
            <a href="https://andrewveda.com/verve/CEFR/subject-verb.html" target="_blank" rel="noopener noreferrer" class="btn">
                Warm Up Quest
            </a>
            
            <a href="https://andrewveda.com/SRM-VEC-English-PWA/orientation/ted-ed" target="_blank" rel="noopener noreferrer" class="btn">
                Main Quest
            </a>
            
            <a href="https://andrewveda.com/verve/buttons/jigsaw_orientation" target="_blank" rel="noopener noreferrer" class="btn">
                Fun Quest
            </a>
            
            <a href="https://andrewveda.com/SRM-VEC-English-PWA/buttons/bookinsights" target="_blank" rel="noopener noreferrer" class="btn">
                Book Insights
            </a>
            
            <a href="https://andrewveda.com/SRM-VEC-English-PWA/buttons/vocab" target="_blank" rel="noopener noreferrer" class="btn">
                Vocabulary
            </a>

            <a href="https://andrewveda.com/SRM-VEC-English-PWA/orientation/1" target="_blank" rel="noopener noreferrer" class="btn">
                Day One
            </a>
        </div>

        <div class="notice">
            <p>Create a <strong>GitHub</strong> account if you haven't already. We'll use it to feature you on the leaderboard tomorrow, so do have it ready!</p>
        </div>
    </div>

</body>
</html>

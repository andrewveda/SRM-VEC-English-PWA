<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burke Club - Kinetic Typography</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600;700&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <!-- GSAP & SplitType CDNs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://unpkg.com/split-type"></script>

    <style>
        :root {
            --bg-cream: #FFF8F0;
            --text-main: #1A1A1A;
            --accent-gold: #C9A227;
            --bronze: #A97142;
            --card-bg: rgba(255, 255, 255, 0.6);
            --card-border: rgba(201, 162, 39, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-cream);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            width: 1080px;
            height: 1920px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* Animated Background */
        .bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .mesh-gradient {
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background: radial-gradient(circle at 30% 30%, rgba(201, 162, 39, 0.08) 0%, transparent 50%),
                        radial-gradient(circle at 70% 70%, rgba(169, 113, 66, 0.06) 0%, transparent 50%),
                        radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.4) 0%, transparent 70%);
            animation: rotateMesh 30s linear infinite;
        }

        @keyframes rotateMesh {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Layout Sections */
        .typography-stage {
            position: relative;
            width: 1080px;
            height: 1344px; /* 70% of 1920 */
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 80px;
            text-align: center;
        }

        .video-placeholder {
            position: relative;
            width: 920px;
            height: 480px; /* 30% of 1920 with margins */
            margin: 0 auto;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.04);
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-placeholder span {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 14px;
            letter-spacing: 4px;
            color: var(--bronze);
            text-transform: uppercase;
            font-weight: 600;
        }

        /* Scene Container */
        .scene {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            left: 0;
            top: 0;
            padding: 60px;
        }

        .scene.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Typography Base Styles */
        h1, h2, div.custom-text {
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            line-height: 1.1;
            color: var(--text-main);
            text-transform: uppercase;
            word-break: break-word;
        }

        .mono {
            font-family: 'IBM Plex Mono', monospace;
        }

        .plex {
            font-family: 'IBM Plex Sans', sans-serif;
        }

        .gold {
            color: var(--accent-gold);
        }

        .bronze {
            color: var(--bronze);
        }

        .outline {
            color: transparent;
            -webkit-text-stroke: 2px var(--text-main);
        }

        .outline-gold {
            color: transparent;
            -webkit-text-stroke: 2px var(--accent-gold);
        }

        /* HUD / Controls Overlay */
        .hud {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 999;
            display: flex;
            gap: 10px;
            background: rgba(26, 26, 26, 0.8);
            backdrop-filter: blur(8px);
            padding: 10px 16px;
            border-radius: 30px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .hud button {
            background: transparent;
            border: none;
            color: #FFF8F0;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 15px;
            transition: background 0.2s;
        }

        .hud button:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .progress-bar-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(0,0,0,0.05);
            z-index: 999;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--accent-gold);
            transition: width 0.1s linear;
        }
    </style>
</head>
<body>

    <div class="progress-bar-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <!-- Background Canvas Layer -->
    <div class="bg-canvas">
        <div class="mesh-gradient"></div>
    </div>

    <!-- Top 70%: Typography Stage -->
    <div class="typography-stage" id="stage">
        <!-- Scenes injected dynamically via JS matching full refined script -->
    </div>

    <!-- Bottom 30%: Video Overlay Placeholder -->
    <div class="video-placeholder">
        <span>Video</span>
    </div>

    <!-- HUD Control Panel -->
    <div class="hud">
        <button id="playBtn">PAUSE</button>
        <button id="replayBtn">REPLAY</button>
        <button id="fullscreenBtn">FULLSCREEN</button>
    </div>

    <script>
        // Full precise scene definitions mapped directly to the complete script
        const scriptData = [
            {
                id: 1, duration: 3.5,
                render: (container) => {
                    container.innerHTML = `<h1 style="font-size: 68px;">Every engineer learns to solve problems.</h1>`;
                    const words = new SplitType(container.querySelector('h1'), { types: 'words' }).words;
                    gsap.from(words, { duration: 0.8, opacity: 0, y: (i) => (i % 2 === 0 ? -100 : 100), x: (i) => (i % 3 === 0 ? -150 : 150), rotation: (i) => i * 15 - 30, ease: "back.out(1.7)", stagger: 0.08 });
                }
            },
            {
                id: 2, duration: 3.5,
                render: (container) => {
                    container.innerHTML = `<h1 style="font-size: 60px;" class="plex">Few learn to make the world <span class="gold">believe</span> in their solutions.</h1>`;
                    const phrase = container.querySelector('h1');
                    const believe = container.querySelector('.gold');
                    gsap.from(phrase, { duration: 1, opacity: 0, scale: 0.9, ease: "power3.out" });
                    gsap.from(believe, { duration: 0.5, scale: 3, opacity: 0, delay: 0.8, ease: "elastic.out(1, 0.3)" });
                }
            },
            {
                id: 3, duration: 3.5,
                render: (container) => {
                    container.innerHTML = `<div style="display:flex; flex-direction:column; align-items:center; justify-content:center;"><span id="idea" style="font-size: 28px; font-weight:700;">A brilliant idea</span><span id="everything" style="font-size: 84px; margin-top:20px;" class="gold">can change everything.</span></div>`;
                    const idea = container.querySelector('#idea');
                    const everything = container.querySelector('#everything');
                    gsap.to(idea, { duration: 1.5, scale: 3.5, ease: "power2.inOut" });
                    gsap.from(everything, { duration: 0.8, scale: 0, opacity: 0, delay: 1.2, ease: "back.out(2)" });
                }
            },
            {
                id: 4, duration: 3.0,
                render: (container) => {
                    container.innerHTML = `<h1 style="font-size: 68px;">But only if someone <span class="gold">understands</span> it.</h1>`;
                    const chars = new SplitType(container.querySelector('h1'), { types: 'chars' }).chars;
                    gsap.from(chars, { duration: 0.6, opacity: 0, filter: "blur(12px)", stagger: 0.03, ease: "power3.out" });
                }
            },
            {
                id: 5, duration: 4.0,
                render: (container) => {
                    container.innerHTML = `<div style="display:flex; flex-direction:column; gap:16px; align-items:center;"><span style="font-size:22px; font-weight:600; letter-spacing:2px;" class="bronze">THE DEPARTMENT OF ENGLISH</span><h1 style="font-size:48px; line-height:1.2;">Believes every engineer deserves a voice equal to their ideas.</h1></div>`;
                    gsap.from(container.firstChild, { duration: 1, opacity: 0, y: 40, ease: "power3.out" });
                }
            },
            {
                id: 6, duration: 3.5,
                render: (container) => {
                    container.innerHTML = `<h1 style="font-size: 80px;" class="gold">Burke Club</h1><p style="font-size: 24px; margin-top:20px; font-weight:600;">is where that voice is built.</p>`;
                    const chars = new SplitType(container.querySelector('.gold'), { types: 'chars' }).chars;
                    gsap.from(chars, { duration: 1, opacity: 0, x: () => gsap.utils.random(-300, 300), y: () => gsap.utils.random(-300, 300), rotation: () => gsap.utils.random(-180, 180), ease: "power3.out", stagger: 0.04 });
                    gsap.from(container.querySelector('p'), { duration: 0.8, opacity: 0, y: 20, delay: 0.8 });
                }
            },
            {
                id: 7, duration: 3.5,
                render: (container) => {
                    container.innerHTML = `<h1 style="font-size: 60px;">Transform <span id="k" class="gold">knowledge</span> into <span id="i" class="outline">influence</span>.</h1>`;
                    const tl = gsap.timeline();
                    tl.from(container.querySelector('h1'), { duration: 0.8, opacity: 0, y: 50 })
                      .to("#k", { duration: 1, scale: 1.2, color: "var(--text-main)", ease: "power2.inOut" })
                      .to("#i", { duration: 1, WebkitTextStrokeColor: "var(--accent-gold)", color: "var(--accent-gold)", ease: "power2.inOut" }, "-=0.5");
                }
            },
            {
                id: 8, duration: 3.5,
                render: (container) => {
                    container.innerHTML = `<div style="display:flex; flex-direction:column; gap:10px;"><h2 style="font-size:56px;">Build arguments</h2><h2 style="font-size:56px;" class="gold">that withstand</h2><h2 style="font-size:56px;">scrutiny.</h2></div>`;
                    const lines = container.querySelectorAll('h2');
                    gsap.from(lines, { duration: 0.8, y: 100, opacity: 0, rotationX: -90, transformOrigin: "bottom center", stagger: 0.2, ease: "back.out(1.2)" });
                }
            },
            {
                id: 9, duration: 3.0,
                render: (container) => {
                    container.innerHTML = `<h1 style="font-size: 64px;">Think on their feet when questions come without warning.</h1>`;
                    const words = new SplitType(container.querySelector('h1'), { types: 'words' }).words;
                    gsap.from(words, { duration: 0.6, x: -200, opacity: 0, stagger: 0.1, ease: "power4.out" });
                }
            },
            {
                id: 10, duration: 3.5,
                render: (container) => {
                    container.innerHTML = `<div style="display:flex; flex-direction:column; align-items:center;"><span style="font-size:24px; font-weight:600;">Command a room.</span><span style="font-size:20px; margin-top:10px; color:var(--bronze);">Not through volume, but through clarity.</span><h1 style="font-size:96px; margin-top:20px;" class="gold">CLARITY</h1></div>`;
                    gsap.from(container.querySelector('h1'), { duration: 1, scale: 0.2, filter: "blur(20px)", opacity: 0, ease: "power4.out", delay: 0.5 });
                }
            },
            {
                id: 11, duration: 3.5,
                render: (container) => {
                    container.innerHTML = `<div style="display:flex; flex-direction:column; gap:16px; font-size:60px; font-weight:900;" class="gold"><div>PERSUADE.</div><div>NEGOTIATE.</div><div>COLLABORATE.</div><div>LEAD.</div></div>`;
                    const items = container.querySelectorAll('div > div');
                    gsap.from(items, { duration: 0.6, x: 200, opacity: 0, stagger: 0.15, ease: "power3.out" });
                }
            },
            {
                id: 12, duration: 3.5,
                render: (container) => {
                    container.innerHTML = `<h1 style="font-size:56px;">These aren't just <span style="text-decoration:line-through; color:var(--bronze);">soft</span> <span class="gold">ENGINEERING</span> skills.</h1>`;
                    gsap.from(container.querySelector('h1'), { duration: 0.8, opacity: 0, y: 40, ease: "power2.out" });
                }
            },
            {
                id: 13, duration: 4.0,
                render: (container) => {
                    container.innerHTML = `<div style="display:flex; flex-direction:column; gap:16px; width:100%; max-width:800px;">
                        <div style="background:white; padding:24px; border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,0.05); font-size:26px; font-weight:700;">Every design review.</div>
                        <div style="background:white; padding:24px; border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,0.05); font-size:26px; font-weight:700;">Every client presentation.</div>
                        <div style="background:white; padding:24px; border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,0.05); font-size:26px; font-weight:700;">Every project defence.</div>
                        <div style="background:white; padding:24px; border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,0.05); font-size:26px; font-weight:700;">Every technical interview.</div>
                    </div>`;
                    const cards = container.querySelectorAll('div > div');
                    gsap.from(cards, { duration: 0.6, opacity: 0, y: 40, scale: 0.95, stagger: 0.2, ease: "back.out(1.5)" });
                }
            },
            {
                id: 14, duration: 4.5,
                render: (container) => {
                    container.innerHTML = `<div style="display:flex; flex-direction:column; gap:16px;"><span style="font-size:22px; font-weight:600; line-height:1.4;">History remembers engineers not only for what they built, but for how they shared their vision.</span><h1 style="font-size:64px;" class="gold">STEVE JOBS</h1></div>`;
                    gsap.from(container.querySelector('h1'), { duration: 1, scale: 2.5, opacity: 0, filter: "blur(10px)", ease: "power3.out", delay: 0.8 });
                }
            },
            {
                id: 15, duration: 3.5,
                render: (container) => {
                    container.innerHTML = `<h1 style="font-size: 56px;">...made complex ideas feel <span id="simple" class="gold" style="display:inline-block;">SIMPLE</span>.</h1>`;
                    gsap.from(container.querySelector('h1'), { duration: 0.8, opacity: 0, y: 30 });
                    gsap.to("#simple", { duration: 1.5, scale: 1.8, ease: "elastic.out(1, 0.4)", delay: 1 });
                }
            },
            {
                id: 16, duration: 3.5,
                render: (container) => {
                    container.innerHTML = `<div style="display:flex; flex-direction:column; align-items:center;"><h1 style="font-size: 56px;">Great engineering changes the</h1><h1 style="font-size: 100px;" class="gold" id="world1">WORLD</h1></div>`;
                    gsap.from(container.querySelectorAll('h1'), { duration: 0.8, opacity: 0, y: 50, stagger: 0.2 });
                    gsap.to("#world1", { duration: 2, rotationY: 360, repeat: -1, ease: "linear" });
                }
            },
            {
                id: 17, duration: 3.5,
                render: (container) => {
                    container.innerHTML = `<h1 style="font-size: 52px; line-height:1.3;">Great communication helps the world <span class="gold">embrace</span> it.</h1>`;
                    const words = new SplitType(container.querySelector('h1'), { types: 'words' }).words;
                    gsap.from(words, { duration: 0.8, opacity: 0, scale: 0.5, stagger: 0.08, ease: "back.out(1.7)" });
                }
            },
            {
                id: 18, duration: 4.0,
                render: (container) => {
                    container.innerHTML = `<div style="display:flex; flex-direction:column; gap:12px; align-items:center;"><span style="font-size:20px; font-weight:600;" class="bronze">SERIES REVIEW & VOICE OF LEGENDS</span><h2 style="font-size:44px; line-height:1.3;">Department of English gives you opportunities to experiment, create, perform, and discover your own voice.</h2></div>`;
                    gsap.from(container.firstChild, { duration: 1, scale: 0.9, opacity: 0, ease: "power3.out" });
                }
            },
            {
                id: 19, duration: 3.5,
                render: (container) => {
                    container.innerHTML = `<h1 style="font-size: 56px;" class="plex">The competitions are enjoyable and character building.</h1>`;
                    const chars = new SplitType(container.querySelector('h1'), { types: 'chars' }).chars;
                    gsap.from(chars, { duration: 0.8, y: -50, opacity: 0, stagger: 0.02, ease: "bounce.out" });
                }
            },
            {
                id: 20, duration: 3.5,
                render: (container) => {
                    container.innerHTML = `<div style="display:flex; flex-direction:column; align-items:center;"><span style="font-size:24px; font-weight:600;">The confidence you build</span><h1 style="font-size:68px; margin-top:20px;" class="gold" id="conf">LASTS A LIFETIME</h1></div>`;
                    gsap.from("#conf", { duration: 1, y: 150, opacity: 0, ease: "power4.out" });
                }
            },
            {
                id: 21, duration: 4.0,
                render: (container) => {
                    container.innerHTML = `<div style="background:#111; color:#0f0; font-family:'IBM Plex Mono', monospace; padding:40px; border-radius:16px; width:100%; text-align:left; font-size:26px; box-shadow:0 20px 40px rgba(0,0,0,0.3);">
                        <p>> Code may compile...</p>
                        <p style="color:#C9A227; margin-top:20px;">> But ideas must connect.</p>
                    </div>`;
                    gsap.from(container.querySelectorAll('p'), { duration: 1, opacity: 0, y: 20, stagger: 1.5 });
                }
            },
            {
                id: 22, duration: 4.5,
                render: (container) => {
                    container.innerHTML = `<div style="display:flex; flex-direction:column; gap:16px; align-items:center;"><span style="font-size:22px; font-weight:600;" class="bronze">THROUGH BURKE CLUB</span><h2 style="font-size:40px; line-height:1.3;">You graduate with more than technical excellence. You graduate with the confidence to inspire, the clarity to persuade, and the voice to lead.</h2></div>`;
                    gsap.from(container.firstChild, { duration: 1, opacity: 0, y: 30, ease: "power3.out" });
                }
            },
            {
                id: 23, duration: 4.0,
                render: (container) => {
                    container.innerHTML = `<h1 style="font-size: 100px;" class="gold">LEAD.</h1>`;
                    gsap.from(container.querySelector('h1'), { duration: 2, scale: 0.2, opacity: 0, ease: "power3.out" });
                    gsap.to(container.querySelector('h1'), { duration: 2, scale: 1.1, ease: "linear", delay: 2 });
                }
            }
        ];

        let currentSceneIndex = 0;
        let isPlaying = true;
        let sceneTimeout = null;

        const stage = document.getElementById('stage');
        const playBtn = document.getElementById('playBtn');
        const replayBtn = document.getElementById('replayBtn');
        const progressBar = document.getElementById('progressBar');

        const totalDuration = scriptData.reduce((acc, curr) => acc + curr.duration, 0);

        function renderScene(index) {
            if (index >= scriptData.length) {
                currentSceneIndex = scriptData.length - 1;
                isPlaying = false;
                playBtn.textContent = "PLAY";
                return;
            }

            stage.innerHTML = '';
            const sceneWrapper = document.createElement('div');
            sceneWrapper.className = 'scene active';
            stage.appendChild(sceneWrapper);

            const sceneData = scriptData[index];
            sceneData.render(sceneWrapper);

            let pastDuration = 0;
            for(let i=0; i<index; i++) pastDuration += scriptData[i].duration;
            
            gsap.to(progressBar, {
                duration: sceneData.duration,
                width: `${((pastDuration + sceneData.duration) / totalDuration) * 100}%`,
                ease: "linear"
            });

            if (isPlaying) {
                sceneTimeout = setTimeout(() => {
                    currentSceneIndex++;
                    renderScene(currentSceneIndex);
                }, sceneData.duration * 1000);
            }
        }

        playBtn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            if (isPlaying) {
                playBtn.textContent = "PAUSE";
                renderScene(currentSceneIndex);
            } else {
                playBtn.textContent = "PLAY";
                clearTimeout(sceneTimeout);
                gsap.globalTimeline.pause();
            }
        });

        replayBtn.addEventListener('click', () => {
            clearTimeout(sceneTimeout);
            gsap.globalTimeline.restart();
            currentSceneIndex = 0;
            isPlaying = true;
            playBtn.textContent = "PAUSE";
            renderScene(currentSceneIndex);
        });

        document.getElementById('fullscreenBtn').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                playBtn.click();
            } else if (e.code === 'ArrowRight') {
                clearTimeout(sceneTimeout);
                currentSceneIndex = Math.min(currentSceneIndex + 1, scriptData.length - 1);
                renderScene(currentSceneIndex);
            } else if (e.code === 'ArrowLeft') {
                clearTimeout(sceneTimeout);
                currentSceneIndex = Math.max(currentSceneIndex - 1, 0);
                renderScene(currentSceneIndex);
            }
        });

        window.addEventListener('load', () => {
            renderScene(currentSceneIndex);
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Burke Club - Cinematic Kinetic Typography & Butter-Smooth Choreography</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600;700&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <!-- GSAP & SplitType CDNs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://unpkg.com/split-type"></script>

    <style>
        :root {
            --bg-cream: #FFF8F0;
            --text-main: #1A1A1A;
            --accent-gold: #C9A227;
            --bronze: #A97142;
            --card-bg: rgba(255, 255, 255, 0.95);
            --card-border: rgba(201, 162, 39, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: var(--bg-cream);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            position: fixed;
            -webkit-font-smoothing: antialiased;
        }

        /* Animated Background Canvas */
        .bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .mesh-gradient {
            position: absolute;
            width: 300%;
            height: 300%;
            top: -100%;
            left: -100%;
            background: radial-gradient(circle at 30% 30%, rgba(201, 162, 39, 0.16) 0%, transparent 40%),
                        radial-gradient(circle at 70% 70%, rgba(169, 113, 66, 0.14) 0%, transparent 40%),
                        radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.8) 0%, transparent 60%);
            animation: rotateMesh 30s linear infinite;
        }

        @keyframes rotateMesh {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* GPU-Accelerated Media Containers with zero overlap */
        .media-container {
            position: absolute;
            border-radius: 16px;
            z-index: 3;
            opacity: 0;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            will-change: transform, top, left, width, height;
            transform: translateZ(0);
        }

        .media-container video, 
        .media-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .media-label {
            position: absolute;
            top: 8px;
            left: 10px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 9px;
            letter-spacing: 2px;
            color: var(--bronze);
            text-transform: uppercase;
            font-weight: 600;
            z-index: 4;
            background: rgba(255, 248, 240, 0.9);
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* Typography Stage */
        .typography-stage {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            pointer-events: none;
        }

        .scene {
            position: absolute;
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            padding: 10px;
        }

        .scene.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Massive Display Typography Styles */
        h1, h2, div.custom-text {
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            line-height: 0.85;
            letter-spacing: -0.03em;
            color: var(--text-main);
            text-transform: uppercase;
            width: 100%;
            word-break: normal;
            overflow-wrap: break-word;
        }

        .mono { font-family: 'IBM Plex Mono', monospace; }
        .plex { font-family: 'IBM Plex Sans', sans-serif; }
        .gold { color: var(--accent-gold); }
        .bronze { color: var(--bronze); }
        .outline {
            color: transparent;
            -webkit-text-stroke: 1.5px var(--text-main);
        }

        /* HUD & Controls */
        .hud {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 999;
            display: flex;
            gap: 8px;
            background: rgba(26, 26, 26, 0.85);
            backdrop-filter: blur(8px);
            padding: 6px 12px;
            border-radius: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
            pointer-events: auto;
        }

        .hud button {
            background: transparent;
            border: none;
            color: #FFF8F0;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 12px;
            transition: background 0.2s;
        }

        .hud button:active {
            background: rgba(255, 255, 255, 0.3);
        }

        .progress-bar-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: rgba(0,0,0,0.05);
            z-index: 999;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--accent-gold);
            transition: width 0.1s linear;
        }
    </style>
</head>
<body>

    <div class="progress-bar-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <!-- Background Canvas -->
    <div class="bg-canvas">
        <div class="mesh-gradient"></div>
    </div>

    <!-- Persistent Video Container (Glides smoothly via butter-smooth choreography) -->
    <div id="videoContainer" class="media-container">
        <span class="media-label">VIDEO</span>
        <video src="" muted loop playsinline></video>
    </div>

    <!-- Photo Collage Placeholders (1 to 16) -->
    <div id="photo1" class="media-container"><span class="media-label">PHOTO 01</span></div>
    <div id="photo2" class="media-container"><span class="media-label">PHOTO 02</span></div>
    <div id="photo3" class="media-container"><span class="media-label">PHOTO 03</span></div>
    <div id="photo4" class="media-container"><span class="media-label">PHOTO 04</span></div>
    <div id="photo5" class="media-container"><span class="media-label">PHOTO 05</span></div>
    <div id="photo6" class="media-container"><span class="media-label">PHOTO 06</span></div>

    <div id="photo15" class="media-container"><span class="media-label">PHOTO 15</span></div>
    <div id="photo16" class="media-container"><span class="media-label">PHOTO 16</span></div>

    <!-- Typography Stage -->
    <div class="typography-stage" id="stage"></div>

    <!-- HUD Control Panel -->
    <div class="hud">
        <button id="playBtn">PAUSE</button>
        <button id="replayBtn">REPLAY</button>
        <button id="fullscreenBtn">FULL</button>
    </div>

    <script>
        // Non-overlapping geometric grid coordinates
        const posTopFull = { top: '4%', left: '5%', width: '90%', height: '27%' };

        const posTopSplitRight = { top: '4%', left: '52%', width: '43%', height: '27%' };

        // Master Script with butter-smooth choreography and massive kinetic word typography
        const scriptData = [
            {
                id: 1, duration: 3.5,

                }

                textPos: 'top: 31%; height: 38%;',
                render: (container) => {
                    container.innerHTML = `<h1 style="font-size: clamp(34px, 10vw, 56px);" class="plex">Few learn to make the world <span class="gold">believe</span> in their solutions.</h1>`;
                    const words = new SplitType(container.querySelector('h1'), { types: 'words' }).words;
                    gsap.set(words, { display: 'inline-block' });
                    gsap.from(words, { duration: 1.0, opacity: 0, y: '100%', stagger: 0.06, ease: "power4.out" });
                    gsap.from(container.querySelector('.gold'), { duration: 0.6, scale: 2, opacity: 0, delay: 0.8, ease: "elastic.out(1, 0.3)" });

            {
                id: 3, duration: 3.5,

                textPos: 'top: 31%; height: 38%;',

                    gsap.to('#idea', { duration: 1.2, scale: 1.5, ease: "power2.inOut" });
                    const words = new SplitType(container.querySelector('#everything'), { types: 'words' }).words;
                    gsap.set(words, { display: 'inline-block' });
                    gsap.from(words, { duration: 0.9, y: '100%', opacity: 0, delay: 0.4, stagger: 0.1, ease: "power4.out" });
                }
            },
            {
                id: 4, duration: 3.0,
                media: { active: ['videoContainer', 'photo5'], pos: { videoContainer: posTopFull, photo5: posBottomFull } },
                textPos: 'top: 31%; height: 38%;',
                render: (container) => {
                    container.innerHTML = `<h1 style="font-size: clamp(40px, 12vw, 68px);">But only if someone <span class="gold">understands</span> it.</h1>`;
                    const words = new SplitType(container.querySelector('h1'), { types: 'words' }).words;
                    gsap.set(words, { display: 'inline-block' });

            {

                media: { active: ['videoContainer', 'photo6', 'photo7'], pos: { videoContainer: posBottomFull, photo6: posTopSplitLeft, photo7: posTopSplitRight } },

                    container.innerHTML = `<div style="display:flex; flex-direction:column; gap:6px; align-items:center; width:100%;"><span style="font-size: clamp(12px, 3.8vw, 16px); font-weight:600; letter-spacing:2px;" class="bronze">DEPARTMENT OF ENGLISH</span><h1 style="font-size: clamp(28px, 8.5vw, 48px); line-height:0.9;">Believes every engineer deserves a voice equal to their ideas.</h1></div>`;

                render: (container) => {
                    container.innerHTML = `<div style="width:100%; text-align:center;"><h1 style="font-size: clamp(56px, 18vw, 110px); line-height:0.85;" class="gold">BURKE CLUB</h1><p style="font-size: clamp(18px, 5.5vw, 24px); margin-top:10px; font-weight:600;">is where that voice is built.</p></div>`;
                    const chars = new SplitType(container.querySelector('h1'), { types: 'chars' }).chars;
                    gsap.set(chars, { display: 'inline-block' });

                    container.innerHTML = `<h1 style="font-size: clamp(34px, 10vw, 56px);">Transform <span id="k" class="gold">knowledge</span> into <span id="i" class="outline">influence</span>.</h1>`;
                    const tl = gsap.timeline();
                    tl.from(container.querySelector('h1'), { duration: 0.8, opacity: 0, y: 20 })

            {

                textPos: 'top: 31%; height: 38%;',
                render: (container) => {
                    container.innerHTML = `<div style="display:flex; flex-direction:column; align-items:center; width:100%;"><span style="font-size:clamp(18px, 5.5vw, 24px); font-weight:600;">Command a room.</span><span style="font-size:clamp(13px, 4vw, 18px); margin-top:2px; color:var(--bronze);">Not through volume, but clarity.</span><h1 style="font-size:clamp(48px, 15vw, 80px); margin-top:6px;" class="gold">CLARITY</h1></div>`;

                    gsap.from(words, { duration: 1.0, scale: 0.2, filter: "blur(10px)", opacity: 0, ease: "power4.out", delay: 0.4 });

            {

                media: { active: ['videoContainer', 'photo15', 'photo16'], pos: { videoContainer: posTopFull, photo15: posSplitLeft, photo16: posSplitRight } },

            {

                    container.innerHTML = `<h1 style="font-size: clamp(30px, 9vw, 50px);">These aren't just <span style="text-decoration:line-through; color:var(--bronze);">soft</span> <span class="gold">ENGINEERING</span> skills.</h1>`;

            {

            },
            {
                id: 19, duration: 3.5,
                media: { active: ['videoContainer', 'photo12'], pos: { videoContainer: posTopSplitLeft, photo12: posTopSplitRight } },
                textPos: 'top: 31%; height: 38%;',
                render: (container) => {
                    container.innerHTML = `<div style="display:flex; flex-direction:column; align-items:center; width:100%;"><span style="font-size:clamp(16px, 5vw, 22px); font-weight:600;">The confidence you build</span><h1 style="font-size:clamp(36px, 11vw, 56px); margin-top:6px;" class="gold" id="conf">LASTS A LIFETIME</h1></div>`;
                    gsap.from("#conf", { duration: 1, y: 30, opacity: 0, ease: "power4.out" });
                }
            },
            {
                id: 20, duration: 4.0,
                media: { active: ['videoContainer', 'photo13', 'photo14'], pos: { videoContainer: posTopFull, photo13: posSplitLeft, photo14: posSplitRight } },
                textPos: 'top: 31%; height: 38%;',
                render: (container) => {
                    container.innerHTML = `<div style="background:#111; color:#0f0; font-family:'IBM Plex Mono', monospace; padding:14px; border-radius:8px; width:100%; max-width:340px; text-align:left; font-size:clamp(13px, 4vw, 17px); box-shadow:0 6px 15px rgba(0,0,0,0.3);">
                        <p>> Code may compile...</p>
                        <p style="color:#C9A227; margin-top:6px;">> But ideas must connect.</p>
                    </div>`;
                    gsap.from(container.querySelectorAll('p'), { duration: 0.8, opacity: 0, y: 8, stagger: 1 });
                }
            },
            {
                id: 21, duration: 4.5,
                media: { active: ['videoContainer', 'photo15'], pos: { videoContainer: posBottomFull, photo15: posTopSplitLeft } },
                textPos: 'top: 31%; height: 38%;',
                render: (container) => {
                    container.innerHTML = `<div style="display:flex; flex-direction:column; gap:4px; align-items:center; width:100%;"><span style="font-size:clamp(12px, 3.5vw, 15px); font-weight:600;" class="bronze">THROUGH BURKE CLUB</span><h2 style="font-size:clamp(14px, 4.5vw, 21px); line-height:1.2;">You graduate with more than technical excellence. You graduate with the confidence to inspire, the clarity to persuade, and the voice to lead.</h2></div>`;
                    gsap.from(container.firstChild, { duration: 1, opacity: 0, y: 8, ease: "power3.out" });
                }
            },
            {
                id: 22, duration: 4.0,
                media: { active: ['videoContainer', 'photo16'], pos: { videoContainer: posTopFull, photo16: posBottomFull } },
                textPos: 'top: 31%; height: 38%;',
                render: (container) => {
                    container.innerHTML = `<h1 style="font-size: clamp(64px, 20vw, 100px);" class="gold">LEAD.</h1>`;
                    gsap.from(container.querySelector('h1'), { duration: 1.5, scale: 0.2, opacity: 0, ease: "power3.out" });
                    gsap.to(container.querySelector('h1'), { duration: 1.5, scale: 1.05, ease: "linear", delay: 1.5 });
                }
            }
        ];

        let currentSceneIndex = 0;
        let isPlaying = true;
        let sceneTimeout = null;

        const stage = document.getElementById('stage');
        const playBtn = document.getElementById('playBtn');
        const replayBtn = document.getElementById('replayBtn');
        const progressBar = document.getElementById('progressBar');

        const totalDuration = scriptData.reduce((acc, curr) => acc + curr.duration, 0);

        // Butter-smooth container choreography using power2.inOut morphing and staggered photo waves
        function updateMediaChoreography(mediaAction) {
            const allPhotos = ['photo1','photo2','photo3','photo4','photo5','photo6',
                               'photo7','photo8','photo9','photo10','photo11','photo12',
                               'photo13','photo14','photo15','photo16'];
            
            // 1. Hide inactive photos with smooth fade
            allPhotos.forEach(id => {
                const el = document.getElementById(id);
                if (el && !mediaAction.active.includes(id)) {
                    gsap.to(el, { duration: 0.5, opacity: 0, scale: 0.92, ease: "power2.in", overwrite: "auto" });
                }
            });

            // 2. Smoothly MORPH video container (never fades, always active, glides seamlessly)
            const videoEl = document.getElementById('videoContainer');
            const videoPos = mediaAction.pos['videoContainer'] || posTopFull;
            gsap.to(videoEl, {
                duration: 1.2,
                ease: "power2.inOut",
                top: videoPos.top,
                left: videoPos.left,
                width: videoPos.width,
                height: videoPos.height,
                scale: 1,
                opacity: 1,
                borderRadius: '16px',
                overwrite: "auto"
            });

            // 3. Stagger photo entrances for a choreographed wave effect
            const photoIds = mediaAction.active.filter(id => id !== 'videoContainer');
            photoIds.forEach((id, i) => {
                const el = document.getElementById(id);
                const pos = mediaAction.pos[id];
                if (el && pos) {
                    gsap.to(el, {
                        duration: 1.0,
                        delay: i * 0.12,
                        ease: "power2.out",
                        top: pos.top,
                        left: pos.left,
                        width: pos.width,
                        height: pos.height,
                        opacity: 1,
                        scale: 1,
                        borderRadius: '16px',
                        overwrite: "auto"
                    });
                }
            });
        }

        function renderScene(index) {
            if (index >= scriptData.length) {
                currentSceneIndex = scriptData.length - 1;
                isPlaying = false;
                playBtn.textContent = "PLAY";
                return;
            }

            stage.innerHTML = '';
            const sceneWrapper = document.createElement('div');
            sceneWrapper.className = 'scene active';
            sceneWrapper.style.cssText = scriptData[index].textPos;
            stage.appendChild(sceneWrapper);

            const sceneData = scriptData[index];
            sceneData.render(sceneWrapper);
            
            updateMediaChoreography(sceneData.media);

            let pastDuration = 0;
            for(let i=0; i<index; i++) pastDuration += scriptData[i].duration;
            
            gsap.to(progressBar, {
                duration: sceneData.duration,
                width: `${((pastDuration + sceneData.duration) / totalDuration) * 100}%`,
                ease: "linear"
            });

            if (isPlaying) {
                sceneTimeout = setTimeout(() => {
                    currentSceneIndex++;
                    renderScene(currentSceneIndex);
                }, sceneData.duration * 1000);
            }
        }

        playBtn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            if (isPlaying) {
                playBtn.textContent = "PAUSE";
                renderScene(currentSceneIndex);
            } else {
                playBtn.textContent = "PLAY";
                clearTimeout(sceneTimeout);
                gsap.globalTimeline.pause();
            }
        });

        replayBtn.addEventListener('click', () => {
            clearTimeout(sceneTimeout);
            gsap.globalTimeline.restart();
            currentSceneIndex = 0;
            isPlaying = true;
            playBtn.textContent = "PAUSE";
            // Reset all media items
            ['videoContainer', 'photo1', 'photo2', 'photo3', 'photo4', 'photo5', 'photo6', 'photo7', 'photo8', 'photo9', 'photo10', 'photo11', 'photo12', 'photo13', 'photo14', 'photo15', 'photo16'].forEach(id => {
                gsap.set(document.getElementById(id), { opacity: 0, scale: 0.9 });
            });
            renderScene(currentSceneIndex);
        });

        document.getElementById('fullscreenBtn').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        });

        window.addEventListener('load', () => {
            renderScene(currentSceneIndex);
        });
    </script>
</body>
</html>

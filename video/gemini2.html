<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Burke Club - Cinematic Kinetic Typography & Immersive Media Collage</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600;700&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <!-- GSAP & SplitType CDNs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://unpkg.com/split-type"></script>

    <style>
        :root {
            --bg-cream: #FFF8F0;
            --text-main: #1A1A1A;
            --accent-gold: #C9A227;
            --bronze: #A97142;
            --card-bg: rgba(255, 255, 255, 0.92);
            --card-border: rgba(201, 162, 39, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: var(--bg-cream);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            position: fixed;
            -webkit-font-smoothing: antialiased;
        }

        /* Animated Background Canvas */
        .bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .mesh-gradient {
            position: absolute;
            width: 300%;
            height: 300%;
            top: -100%;
            left: -100%;
            background: radial-gradient(circle at 30% 30%, rgba(201, 162, 39, 0.16) 0%, transparent 40%),
                        radial-gradient(circle at 70% 70%, rgba(169, 113, 66, 0.14) 0%, transparent 40%),
                        radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.8) 0%, transparent 60%);
            animation: rotateMesh 30s linear infinite;
        }

        @keyframes rotateMesh {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Persistent Video Container - Stays active and moves dynamically */
        .media-container {
            position: absolute;
            border-radius: 20px;
            z-index: 3;
            opacity: 0;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0,0,0,0.18);
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            transform: scale(0.95);
        }

        .media-container video, 
        .media-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .media-label {
            position: absolute;
            top: 10px;
            left: 12px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            letter-spacing: 2px;
            color: var(--bronze);
            text-transform: uppercase;
            font-weight: 600;
            z-index: 4;
            background: rgba(255, 248, 240, 0.85);
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* Typography Stage - Full screen utilization with dynamic vertical offset */
        .typography-stage {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            pointer-events: none;
        }

        .scene {
            position: absolute;
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            padding: 10px;
        }

        .scene.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Typography Styles */
        h1, h2, div.custom-text {
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            line-height: 1.05;
            color: var(--text-main);
            text-transform: uppercase;
            width: 100%;
            word-break: break-word;
        }

        .mono { font-family: 'IBM Plex Mono', monospace; }
        .plex { font-family: 'IBM Plex Sans', sans-serif; }
        .gold { color: var(--accent-gold); }
        .bronze { color: var(--bronze); }
        .outline {
            color: transparent;
            -webkit-text-stroke: 1.5px var(--text-main);
        }

        /* HUD & Controls */
        .hud {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 999;
            display: flex;
            gap: 8px;
            background: rgba(26, 26, 26, 0.85);
            backdrop-filter: blur(8px);
            padding: 6px 12px;
            border-radius: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
            pointer-events: auto;
        }

        .hud button {
            background: transparent;
            border: none;
            color: #FFF8F0;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 12px;
            transition: background 0.2s;
        }

        .hud button:active {
            background: rgba(255, 255, 255, 0.3);
        }

        .progress-bar-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: rgba(0,0,0,0.05);
            z-index: 999;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--accent-gold);
            transition: width 0.1s linear;
        }
    </style>
</head>
<body>

    <div class="progress-bar-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <!-- Background Canvas -->
    <div class="bg-canvas">
        <div class="mesh-gradient"></div>
    </div>

    <!-- Persistent Video Container (Present throughout the entire experience) -->
    <div id="videoContainer" class="media-container">
        <span class="media-label">FEATURED VIDEO</span>
        <video src="" muted loop playsinline></video>
    </div>

    <!-- Expanded Collage Photo Containers (1 to 16 placeholders for seamless dynamic layout) -->
    <div id="photo1" class="media-container"><span class="media-label">PHOTO 01</span></div>
    <div id="photo2" class="media-container"><span class="media-label">PHOTO 02</span></div>
    <div id="photo3" class="media-container"><span class="media-label">PHOTO 03</span></div>
    <div id="photo4" class="media-container"><span class="media-label">PHOTO 04</span></div>
    <div id="photo5" class="media-container"><span class="media-label">PHOTO 05</span></div>
    <div id="photo6" class="media-container"><span class="media-label">PHOTO 06</span></div>
    <div id="photo7" class="media-container"><span class="media-label">PHOTO 07</span></div>
    <div id="photo8" class="media-container"><span class="media-label">PHOTO 08</span></div>
    <div id="photo9" class="media-container"><span class="media-label">PHOTO 09</span></div>
    <div id="photo10" class="media-container"><span class="media-label">PHOTO 10</span></div>
    <div id="photo11" class="media-container"><span class="media-label">PHOTO 11</span></div>
    <div id="photo12" class="media-container"><span class="media-label">PHOTO 12</span></div>
    <div id="photo13" class="media-container"><span class="media-label">PHOTO 13</span></div>
    <div id="photo14" class="media-container"><span class="media-label">PHOTO 14</span></div>
    <div id="photo15" class="media-container"><span class="media-label">PHOTO 15</span></div>
    <div id="photo16" class="media-container"><span class="media-label">PHOTO 16</span></div>

    <!-- Typography Stage -->
    <div class="typography-stage" id="stage"></div>

    <!-- HUD Control Panel -->
    <div class="hud">
        <button id="playBtn">PAUSE</button>
        <button id="replayBtn">REPLAY</button>
        <button id="fullscreenBtn">FULL</button>
    </div>

    <script>
        // Layout positions for full-screen collage choreography
        const posCenter = { top: '22%', left: '10%', width: '80%', height: '36%' };
        const posTopFull = { top: '5%', left: '6%', width: '88%', height: '30%' };
        const posBottomFull = { top: '65%', left: '6%', width: '88%', height: '30%' };
        const posCollageLeft = { top: '58%', left: '5%', width: '43%', height: '36%' };
        const posCollageRight = { top: '58%', left: '52%', width: '43%', height: '36%' };
        const posCollageTopLeft = { top: '6%', left: '5%', width: '43%', height: '32%' };
        const posCollageTopRight = { top: '6%', left: '52%', width: '43%', height: '32%' };

        // Master Script integrating the video container throughout, dynamic photo collage placeholders, and typography
        const scriptData = [
            {
                id: 1, duration: 3.5,
                media: { active: ['videoContainer', 'photo1'], hide: [], pos: { videoContainer: posTopFull, photo1: posBottomFull } },
                render: (container) => {
                    container.style.top = '36%';
                    container.innerHTML = `<h1 style="font-size: clamp(24px, 7vw, 38px);">Every engineer learns to solve problems.</h1>`;
                    const words = new SplitType(container.querySelector('h1'), { types: 'words' }).words;
                    gsap.from(words, { duration: 0.8, opacity: 0, y: (i) => (i % 2 === 0 ? -30 : 30), stagger: 0.08, ease: "back.out(1.7)" });
                }
            },
            {
                id: 2, duration: 3.5,
                media: { active: ['videoContainer', 'photo2'], hide: ['photo1'], pos: { videoContainer: posBottomFull, photo2: posCollageTopLeft } },
                render: (container) => {
                    container.style.top = '40%';
                    container.innerHTML = `<h1 style="font-size: clamp(22px, 6.5vw, 34px);" class="plex">Few learn to make the world <span class="gold">believe</span> in their solutions.</h1>`;
                    const believe = container.querySelector('.gold');
                    gsap.from(container.querySelector('h1'), { duration: 1, opacity: 0, scale: 0.9, ease: "power3.out" });
                    gsap.from(believe, { duration: 0.5, scale: 2, opacity: 0, delay: 0.8, ease: "elastic.out(1, 0.3)" });
                }
            },
            {
                id: 3, duration: 3.5,
                media: { active: ['videoContainer', 'photo3', 'photo4'], hide: ['photo2'], pos: { videoContainer: posCenter, photo3: posCollageTopLeft, photo4: posCollageRight } },
                render: (container) => {
                    container.style.top = '65%';
                    container.innerHTML = `<div style="display:flex; flex-direction:column; align-items:center; width:100%;"><span id="idea" style="font-size: clamp(14px, 4vw, 18px); font-weight:700;">A brilliant idea</span><span id="everything" style="font-size: clamp(28px, 9vw, 48px); margin-top:6px;" class="gold">can change everything.</span></div>`;
                    gsap.to('#idea', { duration: 1.2, scale: 1.8, ease: "power2.inOut" });
                    gsap.from('#everything', { duration: 0.8, scale: 0, opacity: 0, delay: 1, ease: "back.out(2)" });
                }
            },
            {
                id: 4, duration: 3.0,
                media: { active: ['videoContainer', 'photo5'], hide: ['photo3', 'photo4'], pos: { videoContainer: posTopFull, photo5: posBottomFull } },
                render: (container) => {
                    container.style.top = '36%';
                    container.innerHTML = `<h1 style="font-size: clamp(24px, 7vw, 40px);">But only if someone <span class="gold">understands</span> it.</h1>`;
                    const chars = new SplitType(container.querySelector('h1'), { types: 'chars' }).chars;
                    gsap.from(chars, { duration: 0.6, opacity: 0, filter: "blur(10px)", stagger: 0.03, ease: "power3.out" });
                }
            },
            {
                id: 5, duration: 4.0,
                media: { active: ['videoContainer', 'photo6', 'photo7'], hide: ['photo5'], pos: { videoContainer: posBottomFull, photo6: posCollageTopLeft, photo7: posCollageTopRight } },
                render: (container) => {
                    container.style.top = '42%';
                    container.innerHTML = `<div style="display:flex; flex-direction:column; gap:6px; align-items:center; width:100%;"><span style="font-size: clamp(10px, 3vw, 13px); font-weight:600; letter-spacing:2px;" class="bronze">DEPARTMENT OF ENGLISH</span><h1 style="font-size: clamp(18px, 5.5vw, 28px); line-height:1.2;">Believes every engineer deserves a voice equal to their ideas.</h1></div>`;
                    gsap.from(container.firstChild, { duration: 1, opacity: 0, y: 20, ease: "power3.out" });
                }
            },
            {
                id: 6, duration: 3.5,
                media: { active: ['videoContainer', 'photo8'], hide: ['photo6', 'photo7'], pos: { videoContainer: posCollageTopLeft, photo8: posCollageRight } },
                render: (container) => {
                    container.style.top = '45%';
                    container.innerHTML = `<h1 style="font-size: clamp(34px, 11vw, 60px);" class="gold">Burke Club</h1><p style="font-size: clamp(14px, 4vw, 18px); margin-top:8px; font-weight:600;">is where that voice is built.</p>`;
                    const chars = new SplitType(container.querySelector('.gold'), { types: 'chars' }).chars;
                    gsap.from(chars, { duration: 1, opacity: 0, x: () => gsap.utils.random(-50, 50), y: () => gsap.utils.random(-50, 50), ease: "power3.out", stagger: 0.04 });
                    gsap.from(container.querySelector('p'), { duration: 0.8, opacity: 0, y: 15, delay: 0.8 });
                }
            },
            {
                id: 7, duration: 3.5,
                media: { active: ['videoContainer', 'photo9', 'photo10'], hide: ['photo8'], pos: { videoContainer: posCenter, photo9: posCollageTopLeft, photo10: posCollageTopRight } },
                render: (container) => {
                    container.style.top = '68%';
                    container.innerHTML = `<h1 style="font-size: clamp(22px, 6.5vw, 36px);">Transform <span id="k" class="gold">knowledge</span> into <span id="i" class="outline">influence</span>.</h1>`;
                    const tl = gsap.timeline();
                    tl.from(container.querySelector('h1'), { duration: 0.8, opacity: 0, y: 20 })
                      .to("#k", { duration: 0.8, scale: 1.1, color: "var(--text-main)", ease: "power2.inOut" })
                      .to("#i", { duration: 0.8, WebkitTextStrokeColor: "var(--accent-gold)", color: "var(--accent-gold)", ease: "power2.inOut" }, "-=0.4");
                }
            },
            {
                id: 8, duration: 3.5,
                media: { active: ['videoContainer', 'photo11'], hide: ['photo9', 'photo10'], pos: { videoContainer: posTopFull, photo11: posBottomFull } },
                render: (container) => {
                    container.style.top = '36%';
                    container.innerHTML = `<div style="display:flex; flex-direction:column; gap:4px; width:100%;"><h2 style="font-size:clamp(22px, 7vw, 36px);">Build arguments</h2><h2 style="font-size:clamp(22px, 7vw, 36px);" class="gold">that withstand</h2><h2 style="font-size:clamp(22px, 7vw, 36px);">scrutiny.</h2></div>`;
                    const lines = container.querySelectorAll('h2');
                    gsap.from(lines, { duration: 0.8, y: 30, opacity: 0, stagger: 0.15, ease: "back.out(1.2)" });
                }
            },
            {
                id: 9, duration: 3.0,
                media: { active: ['videoContainer', 'photo12', 'photo13'], hide: ['photo11'], pos: { videoContainer: posBottomFull, photo12: posCollageTopLeft, photo13: posCollageTopRight } },
                render: (container) => {
                    container.style.top = '40%';
                    container.innerHTML = `<h1 style="font-size: clamp(20px, 6vw, 32px);">Think on their feet when questions come without warning.</h1>`;
                    const words = new SplitType(container.querySelector('h1'), { types: 'words' }).words;
                    gsap.from(words, { duration: 0.6, x: -40, opacity: 0, stagger: 0.08, ease: "power4.out" });
                }
            },
            {
                id: 10, duration: 3.5,
                media: { active: ['videoContainer', 'photo14'], hide: ['photo12', 'photo13'], pos: { videoContainer: posCollageLeft, photo14: posCollageRight } },
                render: (container) => {
                    container.style.top = '22%';
                    container.innerHTML = `<div style="display:flex; flex-direction:column; align-items:center; width:100%;"><span style="font-size:clamp(14px, 4vw, 18px); font-weight:600;">Command a room.</span><span style="font-size:clamp(11px, 3vw, 14px); margin-top:2px; color:var(--bronze);">Not through volume, but clarity.</span><h1 style="font-size:clamp(32px, 10vw, 56px); margin-top:8px;" class="gold">CLARITY</h1></div>`;
                    gsap.from(container.querySelector('h1'), { duration: 1, scale: 0.3, filter: "blur(10px)", opacity: 0, ease: "power4.out", delay: 0.4 });
                }
            },
            {
                id: 11, duration: 3.5,
                media: { active: ['videoContainer', 'photo15', 'photo16'], hide: ['photo14'], pos: { videoContainer: posTopFull, photo15: posCollageLeft, photo16: posCollageRight } },
                render: (container) => {
                    container.style.top = '45%';
                    container.innerHTML = `<div style="display:flex; flex-direction:column; gap:4px; font-size:clamp(22px, 7vw, 38px); font-weight:900; width:100%;" class="gold"><div>PERSUADE.</div><div>NEGOTIATE.</div><div>COLLABORATE.</div><div>LEAD.</div></div>`;
                    const items = container.querySelectorAll('div > div');
                    gsap.from(items, { duration: 0.5, x: 40, opacity: 0, stagger: 0.1, ease: "power3.out" });
                }
            },
            {
                id: 12, duration: 3.5,
                media: { active: ['videoContainer', 'photo1'], hide: ['photo15', 'photo16'], pos: { videoContainer: posBottomFull, photo1: posCollageTopLeft } },
                render: (container) => {
                    container.style.top = '36%';
                    container.innerHTML = `<h1 style="font-size: clamp(20px, 6vw, 32px);">These aren't just <span style="text-decoration:line-through; color:var(--bronze);">soft</span> <span class="gold">ENGINEERING</span> skills.</h1>`;
                    gsap.from(container.querySelector('h1'), { duration: 0.8, opacity: 0, y: 20, ease: "power2.out" });
                }
            },
            {
                id: 13, duration: 4.0,
                media: { active: ['videoContainer', 'photo2', 'photo3'], hide: ['photo1'], pos: { videoContainer: posCenter, photo2: posCollageTopLeft, photo3: posCollageTopRight } },
                render: (container) => {
                    container.style.top = '62%';
                    container.innerHTML = `<div style="display:flex; flex-direction:column; gap:4px; width:100%; max-width:320px;">
                        <div style="background:white; padding:6px 10px; border-radius:6px; font-size:clamp(11px, 3.2vw, 14px); font-weight:700; box-shadow:0 3px 10px rgba(0,0,0,0.04);">Every design review.</div>
                        <div style="background:white; padding:6px 10px; border-radius:6px; font-size:clamp(11px, 3.2vw, 14px); font-weight:700; box-shadow:0 3px 10px rgba(0,0,0,0.04);">Every client presentation.</div>
                        <div style="background:white; padding:6px 10px; border-radius:6px; font-size:clamp(11px, 3.2vw, 14px); font-weight:700; box-shadow:0 3px 10px rgba(0,0,0,0.04);">Every project defence.</div>
                    </div>`;
                    const cards = container.querySelectorAll('div > div');
                    gsap.from(cards, { duration: 0.4, opacity: 0, y: 10, stagger: 0.1, ease: "back.out(1.5)" });
                }
            },
            {
                id: 14, duration: 4.5,
                media: { active: ['videoContainer', 'photo4', 'photo5'], hide: ['photo2', 'photo3'], pos: { videoContainer: posTopFull, photo4: posCollageLeft, photo5: posCollageRight } },
                render: (container) => {
                    container.style.top = '48%';
                    container.innerHTML = `<div style="display:flex; flex-direction:column; gap:4px; width:100%;"><span style="font-size:clamp(11px, 3.2vw, 14px); font-weight:600; line-height:1.2;">History remembers engineers not only for what they built, but for how they shared their vision.</span><h1 style="font-size:clamp(26px, 8vw, 40px); margin-top:4px;" class="gold">STEVE JOBS</h1></div>`;
                    gsap.from(container.querySelector('h1'), { duration: 1, scale: 1.5, opacity: 0, filter: "blur(5px)", ease: "power3.out", delay: 0.6 });
                }
            },
            {
                id: 15, duration: 3.5,
                media: { active: ['videoContainer', 'photo6'], hide: ['photo4', 'photo5'], pos: { videoContainer: posCollageLeft, photo6: posCollageRight } },
                render: (container) => {
                    container.style.top = '25%';
                    container.innerHTML = `<div style="display:flex; flex-direction:column; align-items:center; width:100%;"><h1 style="font-size: clamp(18px, 5.5vw, 28px);">Great engineering changes the</h1><h1 style="font-size: clamp(34px, 11vw, 56px); margin-top:2px;" class="gold" id="world1">WORLD</h1></div>`;
                    gsap.from(container.querySelectorAll('h1'), { duration: 0.8, opacity: 0, y: 15, stagger: 0.15 });
                    gsap.to("#world1", { duration: 2, rotationY: 360, repeat: -1, ease: "linear" });
                }
            },
            {
                id: 16, duration: 3.5,
                media: { active: ['videoContainer', 'photo7', 'photo8'], hide: ['photo6'], pos: { videoContainer: posBottomFull, photo7: posCollageTopLeft, photo8: posCollageTopRight } },
                render: (container) => {
                    container.style.top = '38%';
                    container.innerHTML = `<h1 style="font-size: clamp(18px, 5.5vw, 28px); line-height:1.2;">Great communication helps the world <span class="gold">embrace</span> it.</h1>`;
                    const words = new SplitType(container.querySelector('h1'), { types: 'words' }).words;
                    gsap.from(words, { duration: 0.8, opacity: 0, scale: 0.5, stagger: 0.08, ease: "back.out(1.7)" });
                }
            },
            {
                id: 17, duration: 4.0,
                media: { active: ['videoContainer', 'photo9'], hide: ['photo7', 'photo8'], pos: { videoContainer: posTopFull, photo9: posBottomFull } },
                render: (container) => {
                    container.style.top = '36%';
                    container.innerHTML = `<div style="display:flex; flex-direction:column; gap:3px; align-items:center; width:100%;"><span style="font-size:clamp(10px, 2.5vw, 12px); font-weight:600;" class="bronze">VOICE OF LEGENDS</span><h2 style="font-size:clamp(12px, 3.8vw, 18px); line-height:1.2;">Department of English gives you opportunities to experiment, create, perform, and discover your own voice.</h2></div>`;
                    gsap.from(container.firstChild, { duration: 1, scale: 0.9, opacity: 0, ease: "power3.out" });
                }
            },
            {
                id: 18, duration: 3.5,
                media: { active: ['videoContainer', 'photo10', 'photo11'], hide: ['photo9'], pos: { videoContainer: posCenter, photo10: posCollageTopLeft, photo11: posCollageTopRight } },
                render: (container) => {
                    container.style.top = '65%';
                    container.innerHTML = `<h1 style="font-size: clamp(18px, 5.5vw, 28px);" class="plex">The competitions are enjoyable and character building.</h1>`;
                    const chars = new SplitType(container.querySelector('h1'), { types: 'chars' }).chars;
                    gsap.from(chars, { duration: 0.8, y: -15, opacity: 0, stagger: 0.02, ease: "bounce.out" });
                }
            },
            {
                id: 19, duration: 3.5,
                media: { active: ['videoContainer', 'photo12'], hide: ['photo10', 'photo11'], pos: { videoContainer: posCollageLeft, photo12: posCollageRight } },
                render: (container) => {
                    container.style.top = '22%';
                    container.innerHTML = `<div style="display:flex; flex-direction:column; align-items:center; width:100%;"><span style="font-size:clamp(13px, 3.8vw, 16px); font-weight:600;">The confidence you build</span><h1 style="font-size:clamp(24px, 8vw, 38px); margin-top:6px;" class="gold" id="conf">LASTS A LIFETIME</h1></div>`;
                    gsap.from("#conf", { duration: 1, y: 30, opacity: 0, ease: "power4.out" });
                }
            },
            {
                id: 20, duration: 4.0,
                media: { active: ['videoContainer', 'photo13', 'photo14'], hide: ['photo12'], pos: { videoContainer: posTopFull, photo13: posCollageLeft, photo14: posCollageRight } },
                render: (container) => {
                    container.style.top = '50%';
                    container.innerHTML = `<div style="background:#111; color:#0f0; font-family:'IBM Plex Mono', monospace; padding:10px; border-radius:8px; width:100%; max-width:300px; text-align:left; font-size:clamp(11px, 3vw, 14px); box-shadow:0 6px 15px rgba(0,0,0,0.3);">
                        <p>> Code may compile...</p>
                        <p style="color:#C9A227; margin-top:6px;">> But ideas must connect.</p>
                    </div>`;
                    gsap.from(container.querySelectorAll('p'), { duration: 0.8, opacity: 0, y: 8, stagger: 1 });
                }
            },
            {
                id: 21, duration: 4.5,
                media: { active: ['videoContainer', 'photo15'], hide: ['photo13', 'photo14'], pos: { videoContainer: posBottomFull, photo15: posCollageTopLeft } },
                render: (container) => {
                    container.style.top = '36%';
                    container.innerHTML = `<div style="display:flex; flex-direction:column; gap:3px; align-items:center; width:100%;"><span style="font-size:clamp(10px, 2.8vw, 12px); font-weight:600;" class="bronze">THROUGH BURKE CLUB</span><h2 style="font-size:clamp(11px, 3.5vw, 16px); line-height:1.2;">You graduate with more than technical excellence. You graduate with the confidence to inspire, the clarity to persuade, and the voice to lead.</h2></div>`;
                    gsap.from(container.firstChild, { duration: 1, opacity: 0, y: 8, ease: "power3.out" });
                }
            },
            {
                id: 22, duration: 4.0,
                media: { active: ['videoContainer', 'photo16'], hide: ['photo15'], pos: { videoContainer: posTopFull, photo16: posBottomFull } },
                render: (container) => {
                    container.style.top = '40%';
                    container.innerHTML = `<h1 style="font-size: clamp(42px, 14vw, 72px);" class="gold">LEAD.</h1>`;
                    gsap.from(container.querySelector('h1'), { duration: 1.5, scale: 0.2, opacity: 0, ease: "power3.out" });
                    gsap.to(container.querySelector('h1'), { duration: 1.5, scale: 1.05, ease: "linear", delay: 1.5 });
                }
            }
        ];

        let currentSceneIndex = 0;
        let isPlaying = true;
        let sceneTimeout = null;

        const stage = document.getElementById('stage');
        const playBtn = document.getElementById('playBtn');
        const replayBtn = document.getElementById('replayBtn');
        const progressBar = document.getElementById('progressBar');

        const totalDuration = scriptData.reduce((acc, curr) => acc + curr.duration, 0);

        function updateMediaChoreography(mediaAction) {
            // Hide all media containers first
            ['videoContainer', 'photo1', 'photo2', 'photo3', 'photo4', 'photo5', 'photo6', 'photo7', 'photo8', 'photo9', 'photo10', 'photo11', 'photo12', 'photo13', 'photo14', 'photo15', 'photo16'].forEach(id => {
                const el = document.getElementById(id);
                if (el && !mediaAction.active.includes(id)) {
                    gsap.to(el, { duration: 0.4, opacity: 0, scale: 0.9, pointerEvents: 'none' });
                }
            });

            // Activate and position current active media elements (video + collage photos)
            mediaAction.active.forEach(id => {
                const el = document.getElementById(id);
                const posLayout = mediaAction.pos[id] || posTopFull;
                if (el) {
                    gsap.to(el, {
                        duration: 0.7,
                        opacity: 1,
                        scale: 1,
                        top: posLayout.top,
                        left: posLayout.left,
                        width: posLayout.width,
                        height: posLayout.height,
                        borderRadius: '16px',
                        ease: "power3.out",
                        overwrite: "auto"
                    });
                }
            });
        }

        function renderScene(index) {
            if (index >= scriptData.length) {
                currentSceneIndex = scriptData.length - 1;
                isPlaying = false;
                playBtn.textContent = "PLAY";
                return;
            }

            stage.innerHTML = '';
            const sceneWrapper = document.createElement('div');
            sceneWrapper.className = 'scene active';
            stage.appendChild(sceneWrapper);

            const sceneData = scriptData[index];
            sceneData.render(sceneWrapper);
            
            updateMediaChoreography(sceneData.media);

            let pastDuration = 0;
            for(let i=0; i<index; i++) pastDuration += scriptData[i].duration;
            
            gsap.to(progressBar, {
                duration: sceneData.duration,
                width: `${((pastDuration + sceneData.duration) / totalDuration) * 100}%`,
                ease: "linear"
            });

            if (isPlaying) {
                sceneTimeout = setTimeout(() => {
                    currentSceneIndex++;
                    renderScene(currentSceneIndex);
                }, sceneData.duration * 1000);
            }
        }

        playBtn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            if (isPlaying) {
                playBtn.textContent = "PAUSE";
                renderScene(currentSceneIndex);
            } else {
                playBtn.textContent = "PLAY";
                clearTimeout(sceneTimeout);
                gsap.globalTimeline.pause();
            }
        });

        replayBtn.addEventListener('click', () => {
            clearTimeout(sceneTimeout);
            gsap.globalTimeline.restart();
            currentSceneIndex = 0;
            isPlaying = true;
            playBtn.textContent = "PAUSE";
            // Reset all media items
            ['videoContainer', 'photo1', 'photo2', 'photo3', 'photo4', 'photo5', 'photo6', 'photo7', 'photo8', 'photo9', 'photo10', 'photo11', 'photo12', 'photo13', 'photo14', 'photo15', 'photo16'].forEach(id => {
                gsap.set(document.getElementById(id), { opacity: 0, scale: 0.9 });
            });
            renderScene(currentSceneIndex);
        });

        document.getElementById('fullscreenBtn').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        });

        window.addEventListener('load', () => {
            renderScene(currentSceneIndex);
        });
    </script>
</body>
</html>

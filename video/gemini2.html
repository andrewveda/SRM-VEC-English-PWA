<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Burke Club - Kinetic Typography</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600;700&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <!-- GSAP & SplitType CDNs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://unpkg.com/split-type"></script>

    <style>
        :root {
            --bg-cream: #FFF8F0;
            --text-main: #1A1A1A;
            --accent-gold: #C9A227;
            --bronze: #A97142;
            --card-bg: rgba(255, 255, 255, 0.75);
            --card-border: rgba(201, 162, 39, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: var(--bg-cream);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            position: fixed;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* Animated Background Canvas */
        .bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .mesh-gradient {
            position: absolute;
            width: 300%;
            height: 300%;
            top: -100%;
            left: -100%;
            background: radial-gradient(circle at 30% 30%, rgba(201, 162, 39, 0.12) 0%, transparent 40%),
                        radial-gradient(circle at 70% 70%, rgba(169, 113, 66, 0.1) 0%, transparent 40%),
                        radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.6) 0%, transparent 60%);
            animation: rotateMesh 25s linear infinite;
        }

        @keyframes rotateMesh {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Layout Sections - Strictly Enforced 70% / 30% Flex Split */
        .typography-stage {
            position: relative;
            width: 100%;
            height: 70vh;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            overflow: hidden;
        }

        .video-placeholder {
            position: relative;
            width: calc(100% - 32px);
            height: calc(30vh - 16px);
            max-width: 500px;
            margin: 0 auto 8px auto;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            box-shadow: 0 16px 32px rgba(0, 0, 0, 0.05);
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-placeholder span {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            letter-spacing: 4px;
            color: var(--bronze);
            text-transform: uppercase;
            font-weight: 600;
        }

        /* Scene Container fills entire 70% stage container dynamically */
        .scene {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            left: 0;
            top: 0;
            padding: 10px;
        }

        .scene.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Typography Auto-Scaling Utilities */
        h1, h2, div.custom-text {
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            line-height: 1.05;
            color: var(--text-main);
            text-transform: uppercase;
            width: 100%;
            max-width: 100%;
            word-break: break-word;
        }

        .mono { font-family: 'IBM Plex Mono', monospace; }
        .plex { font-family: 'IBM Plex Sans', sans-serif; }
        .gold { color: var(--accent-gold); }
        .bronze { color: var(--bronze); }
        .outline {
            color: transparent;
            -webkit-text-stroke: 1.5px var(--text-main);
        }
        .outline-gold {
            color: transparent;
            -webkit-text-stroke: 1.5px var(--accent-gold);
        }

        /* HUD / Controls Overlay */
        .hud {
            position: fixed;
            bottom: calc(30vh + 16px);
            right: 16px;
            z-index: 999;
            display: flex;
            gap: 8px;
            background: rgba(26, 26, 26, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 6px 12px;
            border-radius: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
        }

        .hud button {
            background: transparent;
            border: none;
            color: #FFF8F0;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 12px;
            transition: background 0.2s;
        }

        .hud button:active {
            background: rgba(255, 255, 255, 0.3);
        }

        .progress-bar-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: rgba(0,0,0,0.05);
            z-index: 999;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--accent-gold);
            transition: width 0.1s linear;
        }
    </style>
</head>
<body>

    <div class="progress-bar-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <!-- Background Canvas Layer -->
    <div class="bg-canvas">
        <div class="mesh-gradient"></div>
    </div>

    <!-- Top 70% Height: Typography Stage -->
    <div class="typography-stage" id="stage"></div>

    <!-- Bottom 30% Height: Video Overlay Placeholder -->
    <div class="video-placeholder">
        <span>Video</span>
    </div>

    <!-- Mobile HUD Control Panel -->
    <div class="hud">
        <button id="playBtn">PAUSE</button>
        <button id="replayBtn">REPLAY</button>
        <button id="fullscreenBtn">FULL</button>
    </div>

    <script>
        // Full script optimized with max viewport-filling typography scale factors
        const scriptData = [
            {
                id: 1, duration: 3.5,
                render: (container) => {
                    container.innerHTML = `<h1 style="font-size: clamp(32px, 9vw, 54px);">Every engineer learns to solve problems.</h1>`;
                    const words = new SplitType(container.querySelector('h1'), { types: 'words' }).words;
                    gsap.from(words, { duration: 0.8, opacity: 0, y: (i) => (i % 2 === 0 ? -60 : 60), x: (i) => (i % 3 === 0 ? -80 : 80), rotation: (i) => i * 12 - 20, ease: "back.out(1.7)", stagger: 0.08 });
                }
            },
            {
                id: 2, duration: 3.5,
                render: (container) => {
                    container.innerHTML = `<h1 style="font-size: clamp(28px, 8.5vw, 48px);" class="plex">Few learn to make the world <span class="gold">believe</span> in their solutions.</h1>`;
                    const phrase = container.querySelector('h1');
                    const believe = container.querySelector('.gold');
                    gsap.from(phrase, { duration: 1, opacity: 0, scale: 0.9, ease: "power3.out" });
                    gsap.from(believe, { duration: 0.5, scale: 2.5, opacity: 0, delay: 0.8, ease: "elastic.out(1, 0.3)" });
                }
            },
            {
                id: 3, duration: 3.5,
                render: (container) => {
                    container.innerHTML = `<div style="display:flex; flex-direction:column; align-items:center; justify-content:center; width:100%;"><span id="idea" style="font-size: clamp(16px, 5vw, 24px); font-weight:700;">A brilliant idea</span><span id="everything" style="font-size: clamp(36px, 11vw, 64px); margin-top:12px;" class="gold">can change everything.</span></div>`;
                    const idea = container.querySelector('#idea');
                    const everything = container.querySelector('#everything');
                    gsap.to(idea, { duration: 1.5, scale: 2.5, ease: "power2.inOut" });
                    gsap.from(everything, { duration: 0.8, scale: 0, opacity: 0, delay: 1.2, ease: "back.out(2)" });
                }
            },
            {
                id: 4, duration: 3.0,
                render: (container) => {
                    container.innerHTML = `<h1 style="font-size: clamp(32px, 9vw, 54px);">But only if someone <span class="gold">understands</span> it.</h1>`;
                    const chars = new SplitType(container.querySelector('h1'), { types: 'chars' }).chars;
                    gsap.from(chars, { duration: 0.6, opacity: 0, filter: "blur(10px)", stagger: 0.03, ease: "power3.out" });
                }
            },
            {
                id: 5, duration: 4.0,
                render: (container) => {
                    container.innerHTML = `<div style="display:flex; flex-direction:column; gap:10px; align-items:center; width:100%;"><span style="font-size: clamp(12px, 3.5vw, 16px); font-weight:600; letter-spacing:2px;" class="bronze">THE DEPARTMENT OF ENGLISH</span><h1 style="font-size: clamp(22px, 6.5vw, 38px); line-height:1.2;">Believes every engineer deserves a voice equal to their ideas.</h1></div>`;
                    gsap.from(container.firstChild, { duration: 1, opacity: 0, y: 30, ease: "power3.out" });
                }
            },
            {
                id: 6, duration: 3.5,
                render: (container) => {
                    container.innerHTML = `<h1 style="font-size: clamp(44px, 14vw, 80px);" class="gold">Burke Club</h1><p style="font-size: clamp(16px, 4.5vw, 22px); margin-top:12px; font-weight:600;">is where that voice is built.</p>`;
                    const chars = new SplitType(container.querySelector('.gold'), { types: 'chars' }).chars;
                    gsap.from(chars, { duration: 1, opacity: 0, x: () => gsap.utils.random(-150, 150), y: () => gsap.utils.random(-150, 150), rotation: () => gsap.utils.random(-120, 120), ease: "power3.out", stagger: 0.04 });
                    gsap.from(container.querySelector('p'), { duration: 0.8, opacity: 0, y: 15, delay: 0.8 });
                }
            },
            {
                id: 7, duration: 3.5,
                render: (container) => {
                    container.innerHTML = `<h1 style="font-size: clamp(28px, 8vw, 46px);">Transform <span id="k" class="gold">knowledge</span> into <span id="i" class="outline">influence</span>.</h1>`;
                    const tl = gsap.timeline();
                    tl.from(container.querySelector('h1'), { duration: 0.8, opacity: 0, y: 30 })
                      .to("#k", { duration: 1, scale: 1.15, color: "var(--text-main)", ease: "power2.inOut" })
                      .to("#i", { duration: 1, WebkitTextStrokeColor: "var(--accent-gold)", color: "var(--accent-gold)", ease: "power2.inOut" }, "-=0.5");
                }
            },
            {
                id: 8, duration: 3.5,
                render: (container) => {
                    container.innerHTML = `<div style="display:flex; flex-direction:column; gap:8px; width:100%;"><h2 style="font-size:clamp(28px, 8.5vw, 48px);">Build arguments</h2><h2 style="font-size:clamp(28px, 8.5vw, 48px);" class="gold">that withstand</h2><h2 style="font-size:clamp(28px, 8.5vw, 48px);">scrutiny.</h2></div>`;
                    const lines = container.querySelectorAll('h2');
                    gsap.from(lines, { duration: 0.8, y: 60, opacity: 0, rotationX: -90, transformOrigin: "bottom center", stagger: 0.2, ease: "back.out(1.2)" });
                }
            },
            {
                id: 9, duration: 3.0,
                render: (container) => {
                    container.innerHTML = `<h1 style="font-size: clamp(26px, 7.5vw, 42px);">Think on their feet when questions come without warning.</h1>`;
                    const words = new SplitType(container.querySelector('h1'), { types: 'words' }).words;
                    gsap.from(words, { duration: 0.6, x: -100, opacity: 0, stagger: 0.1, ease: "power4.out" });
                }
            },
            {
                id: 10, duration: 3.5,
                render: (container) => {
                    container.innerHTML = `<div style="display:flex; flex-direction:column; align-items:center; width:100%;"><span style="font-size:clamp(16px, 4.5vw, 22px); font-weight:600;">Command a room.</span><span style="font-size:clamp(13px, 3.5vw, 17px); margin-top:6px; color:var(--bronze);">Not through volume, but through clarity.</span><h1 style="font-size:clamp(40px, 13vw, 76px); margin-top:12px;" class="gold">CLARITY</h1></div>`;
                    gsap.from(container.querySelector('h1'), { duration: 1, scale: 0.2, filter: "blur(15px)", opacity: 0, ease: "power4.out", delay: 0.5 });
                }
            },
            {
                id: 11, duration: 3.5,
                render: (container) => {
                    container.innerHTML = `<div style="display:flex; flex-direction:column; gap:8px; font-size:clamp(32px, 10vw, 56px); font-weight:900; width:100%;" class="gold"><div>PERSUADE.</div><div>NEGOTIATE.</div><div>COLLABORATE.</div><div>LEAD.</div></div>`;
                    const items = container.querySelectorAll('div > div');
                    gsap.from(items, { duration: 0.6, x: 100, opacity: 0, stagger: 0.15, ease: "power3.out" });
                }
            },
            {
                id: 12, duration: 3.5,
                render: (container) => {
                    container.innerHTML = `<h1 style="font-size:clamp(26px, 7.5vw, 42px);">These aren't just <span style="text-decoration:line-through; color:var(--bronze);">soft</span> <span class="gold">ENGINEERING</span> skills.</h1>`;
                    gsap.from(container.querySelector('h1'), { duration: 0.8, opacity: 0, y: 30, ease: "power2.out" });
                }
            },
            {
                id: 13, duration: 4.0,
                render: (container) => {
                    container.innerHTML = `<div style="display:flex; flex-direction:column; gap:8px; width:100%; max-width:400px; padding:0 8px;">
                        <div style="background:white; padding:12px 16px; border-radius:12px; box-shadow:0 6px 20px rgba(0,0,0,0.04); font-size:clamp(15px, 4.2vw, 20px); font-weight:700;">Every design review.</div>
                        <div style="background:white; padding:12px 16px; border-radius:12px; box-shadow:0 6px 20px rgba(0,0,0,0.04); font-size:clamp(15px, 4.2vw, 20px); font-weight:700;">Every client presentation.</div>
                        <div style="background:white; padding:12px 16px; border-radius:12px; box-shadow:0 6px 20px rgba(0,0,0,0.04); font-size:clamp(15px, 4.2vw, 20px); font-weight:700;">Every project defence.</div>
                        <div style="background:white; padding:12px 16px; border-radius:12px; box-shadow:0 6px 20px rgba(0,0,0,0.04); font-size:clamp(15px, 4.2vw, 20px); font-weight:700;">Every technical interview.</div>
                    </div>`;
                    const cards = container.querySelectorAll('div > div');
                    gsap.from(cards, { duration: 0.6, opacity: 0, y: 30, scale: 0.95, stagger: 0.18, ease: "back.out(1.5)" });
                }
            },
            {
                id: 14, duration: 4.5,
                render: (container) => {
                    container.innerHTML = `<div style="display:flex; flex-direction:column; gap:12px; width:100%;"><span style="font-size:clamp(14px, 4vw, 18px); font-weight:600; line-height:1.4;">History remembers engineers not only for what they built, but for how they shared their vision.</span><h1 style="font-size:clamp(36px, 11vw, 56px);" class="gold">STEVE JOBS</h1></div>`;
                    gsap.from(container.querySelector('h1'), { duration: 1, scale: 2, opacity: 0, filter: "blur(8px)", ease: "power3.out", delay: 0.8 });
                }
            },
            {
                id: 15, duration: 3.5,
                render: (container) => {
                    container.innerHTML = `<h1 style="font-size: clamp(26px, 7.5vw, 42px);">...made complex ideas feel <span id="simple" class="gold" style="display:inline-block;">SIMPLE</span>.</h1>`;
                    gsap.from(container.querySelector('h1'), { duration: 0.8, opacity: 0, y: 20 });
                    gsap.to("#simple", { duration: 1.5, scale: 1.6, ease: "elastic.out(1, 0.4)", delay: 1 });
                }
            },
            {
                id: 16, duration: 3.5,
                render: (container) => {
                    container.innerHTML = `<div style="display:flex; flex-direction:column; align-items:center; width:100%;"><h1 style="font-size: clamp(26px, 7.5vw, 42px);">Great engineering changes the</h1><h1 style="font-size: clamp(48px, 15vw, 84px); margin-top:8px;" class="gold" id="world1">WORLD</h1></div>`;
                    gsap.from(container.querySelectorAll('h1'), { duration: 0.8, opacity: 0, y: 30, stagger: 0.2 });
                    gsap.to("#world1", { duration: 2, rotationY: 360, repeat: -1, ease: "linear" });
                }
            },
            {
                id: 17, duration: 3.5,
                render: (container) => {
                    container.innerHTML = `<h1 style="font-size: clamp(24px, 7vw, 38px); line-height:1.3;">Great communication helps the world <span class="gold">embrace</span> it.</h1>`;
                    const words = new SplitType(container.querySelector('h1'), { types: 'words' }).words;
                    gsap.from(words, { duration: 0.8, opacity: 0, scale: 0.5, stagger: 0.08, ease: "back.out(1.7)" });
                }
            },
            {
                id: 18, duration: 4.0,
                render: (container) => {
                    container.innerHTML = `<div style="display:flex; flex-direction:column; gap:8px; align-items:center; width:100%;"><span style="font-size:clamp(11px, 3.2vw, 15px); font-weight:600;" class="bronze">SERIES REVIEW & VOICE OF LEGENDS</span><h2 style="font-size:clamp(18px, 5.2vw, 30px); line-height:1.3;">Department of English gives you opportunities to experiment, create, perform, and discover your own voice.</h2></div>`;
                    gsap.from(container.firstChild, { duration: 1, scale: 0.9, opacity: 0, ease: "power3.out" });
                }
            },
            {
                id: 19, duration: 3.5,
                render: (container) => {
                    container.innerHTML = `<h1 style="font-size: clamp(26px, 7.5vw, 42px);" class="plex">The competitions are enjoyable and character building.</h1>`;
                    const chars = new SplitType(container.querySelector('h1'), { types: 'chars' }).chars;
                    gsap.from(chars, { duration: 0.8, y: -30, opacity: 0, stagger: 0.02, ease: "bounce.out" });
                }
            },
            {
                id: 20, duration: 3.5,
                render: (container) => {
                    container.innerHTML = `<div style="display:flex; flex-direction:column; align-items:center; width:100%;"><span style="font-size:clamp(16px, 4.5vw, 22px); font-weight:600;">The confidence you build</span><h1 style="font-size:clamp(32px, 10vw, 56px); margin-top:12px;" class="gold" id="conf">LASTS A LIFETIME</h1></div>`;
                    gsap.from("#conf", { duration: 1, y: 80, opacity: 0, ease: "power4.out" });
                }
            },
            {
                id: 21, duration: 4.0,
                render: (container) => {
                    container.innerHTML = `<div style="background:#111; color:#0f0; font-family:'IBM Plex Mono', monospace; padding:20px; border-radius:12px; width:100%; max-width:420px; text-align:left; font-size:clamp(14px, 4vw, 20px); box-shadow:0 12px 30px rgba(0,0,0,0.3);">
                        <p>> Code may compile...</p>
                        <p style="color:#C9A227; margin-top:14px;">> But ideas must connect.</p>
                    </div>`;
                    gsap.from(container.querySelectorAll('p'), { duration: 1, opacity: 0, y: 15, stagger: 1.5 });
                }
            },
            {
                id: 22, duration: 4.5,
                render: (container) => {
                    container.innerHTML = `<div style="display:flex; flex-direction:column; gap:8px; align-items:center; width:100%;"><span style="font-size:clamp(12px, 3.5vw, 16px); font-weight:600;" class="bronze">THROUGH BURKE CLUB</span><h2 style="font-size:clamp(16px, 4.8vw, 28px); line-height:1.3;">You graduate with more than technical excellence. You graduate with the confidence to inspire, the clarity to persuade, and the voice to lead.</h2></div>`;
                    gsap.from(container.firstChild, { duration: 1, opacity: 0, y: 20, ease: "power3.out" });
                }
            },
            {
                id: 23, duration: 4.0,
                render: (container) => {
                    container.innerHTML = `<h1 style="font-size: clamp(56px, 18vw, 100px);" class="gold">LEAD.</h1>`;
                    gsap.from(container.querySelector('h1'), { duration: 2, scale: 0.2, opacity: 0, ease: "power3.out" });
                    gsap.to(container.querySelector('h1'), { duration: 2, scale: 1.1, ease: "linear", delay: 2 });
                }
            }
        ];

        let currentSceneIndex = 0;
        let isPlaying = true;
        let sceneTimeout = null;

        const stage = document.getElementById('stage');
        const playBtn = document.getElementById('playBtn');
        const replayBtn = document.getElementById('replayBtn');
        const progressBar = document.getElementById('progressBar');

        const totalDuration = scriptData.reduce((acc, curr) => acc + curr.duration, 0);

        function renderScene(index) {
            if (index >= scriptData.length) {
                currentSceneIndex = scriptData.length - 1;
                isPlaying = false;
                playBtn.textContent = "PLAY";
                return;
            }

            stage.innerHTML = '';
            const sceneWrapper = document.createElement('div');
            sceneWrapper.className = 'scene active';
            stage.appendChild(sceneWrapper);

            const sceneData = scriptData[index];
            sceneData.render(sceneWrapper);

            let pastDuration = 0;
            for(let i=0; i<index; i++) pastDuration += scriptData[i].duration;
            
            gsap.to(progressBar, {
                duration: sceneData.duration,
                width: `${((pastDuration + sceneData.duration) / totalDuration) * 100}%`,
                ease: "linear"
            });

            if (isPlaying) {
                sceneTimeout = setTimeout(() => {
                    currentSceneIndex++;
                    renderScene(currentSceneIndex);
                }, sceneData.duration * 1000);
            }
        }

        playBtn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            if (isPlaying) {
                playBtn.textContent = "PAUSE";
                renderScene(currentSceneIndex);
            } else {
                playBtn.textContent = "PLAY";
                clearTimeout(sceneTimeout);
                gsap.globalTimeline.pause();
            }
        });

        replayBtn.addEventListener('click', () => {
            clearTimeout(sceneTimeout);
            gsap.globalTimeline.restart();
            currentSceneIndex = 0;
            isPlaying = true;
            playBtn.textContent = "PAUSE";
            renderScene(currentSceneIndex);
        });

        document.getElementById('fullscreenBtn').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        });

        window.addEventListener('load', () => {
            renderScene(currentSceneIndex);
        });
    </script>
</body>
</html>

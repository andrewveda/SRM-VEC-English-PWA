<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Burke Club - Cinematic Kinetic Typography & Continuous Video Choreography</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600;700&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <!-- GSAP & SplitType CDNs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://unpkg.com/split-type"></script>

    <style>
        :root {
            --bg-cream: #FFF8F0;
            --text-main: #1A1A1A;
            --accent-gold: #C9A227;
            --bronze: #A97142;
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-border: rgba(201, 162, 39, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: var(--bg-cream);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            position: fixed;
            -webkit-font-smoothing: antialiased;
        }

        /* Animated Background */
        .bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .mesh-gradient {
            position: absolute;
            width: 300%;
            height: 300%;
            top: -100%;
            left: -100%;
            background: radial-gradient(circle at 30% 30%, rgba(201, 162, 39, 0.14) 0%, transparent 40%),
                        radial-gradient(circle at 70% 70%, rgba(169, 113, 66, 0.12) 0%, transparent 40%),
                        radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.7) 0%, transparent 60%);
            animation: rotateMesh 30s linear infinite;
        }

        @keyframes rotateMesh {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Continuous Video1 Stage Container (Animates Shape & Position Throughout) */
        #video1 {
            position: absolute;
            z-index: 2;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: border-radius 0.5s ease;
        }

        #video1 video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Photos Layer (For Supporting Media Interspersing) */
        .photo-container {
            position: absolute;
            opacity: 0;
            z-index: 1;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .photo-container span {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            letter-spacing: 3px;
            color: var(--bronze);
            text-transform: uppercase;
            font-weight: 600;
        }

        /* Typography Stage */
        .typography-stage {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 4;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px;
            text-align: center;
            pointer-events: none;
        }

        .scene {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            padding: 20px;
        }

        .scene.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Typography Styles */
        h1, h2, div.custom-text {
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            line-height: 1.05;
            color: var(--text-main);
            text-transform: uppercase;
            width: 100%;
            max-width: 900px;
            word-break: break-word;
        }

        .mono { font-family: 'IBM Plex Mono', monospace; }
        .plex { font-family: 'IBM Plex Sans', sans-serif; }
        .gold { color: var(--accent-gold); }
        .bronze { color: var(--bronze); }
        .outline {
            color: transparent;
            -webkit-text-stroke: 1.5px var(--text-main);
        }
        .outline-gold {
            color: transparent;
            -webkit-text-stroke: 1.5px var(--accent-gold);
        }

        /* HUD & Controls */
        .hud {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 999;
            display: flex;
            gap: 8px;
            background: rgba(26, 26, 26, 0.85);
            backdrop-filter: blur(8px);
            padding: 6px 12px;
            border-radius: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
            pointer-events: auto;
        }

        .hud button {
            background: transparent;
            border: none;
            color: #FFF8F0;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 12px;
            transition: background 0.2s;
        }

        .hud button:active {
            background: rgba(255, 255, 255, 0.3);
        }

        .progress-bar-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: rgba(0,0,0,0.05);
            z-index: 999;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--accent-gold);
            transition: width 0.1s linear;
        }
    </style>
</head>
<body>

    <div class="progress-bar-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <!-- Background Canvas -->
    <div class="bg-canvas">
        <div class="mesh-gradient"></div>
    </div>

    <!-- Continuous Video 1 Element (Morphs shape and screen positioning throughout) -->
    <div id="video1">
        <video src="" muted loop playsinline></video>
    </div>

    <!-- Supporting Photo Containers -->
    <div id="photo1" class="photo-container"><span class="photo-label">PHOTO 1</span></div>
    <div id="photo2" class="photo-container"><span class="photo-label">PHOTO 2</span></div>
    <div id="photo3" class="photo-container"><span class="photo-label">PHOTO 3</span></div>

    <!-- Typography Stage -->
    <div class="typography-stage" id="stage"></div>

    <!-- HUD Control Panel -->
    <div class="hud">
        <button id="playBtn">PAUSE</button>
        <button id="replayBtn">REPLAY</button>
        <button id="fullscreenBtn">FULL</button>
    </div>

    <script>
        // Master Choreography with continuous video morphing (fullscreen, floating card, oval pip, bottom panel, etc.)
        const scriptData = [
            {
                id: 1, duration: 3.5,
                narration: "Every engineer learns to solve problems.",
                videoLayout: { top: '5%', left: '5%', width: '90%', height: '28%', borderRadius: '20px' },
                photoAction: { show: [], hide: ['photo1', 'photo2', 'photo3'] },
                render: (container) => {
                    container.innerHTML = `<h1 style="font-size: clamp(32px, 8.5vw, 52px);">Every engineer learns to solve problems.</h1>`;
                    const words = new SplitType(container.querySelector('h1'), { types: 'words' }).words;
                    gsap.from(words, { duration: 0.8, opacity: 0, y: (i) => (i % 2 === 0 ? -50 : 50), stagger: 0.08, ease: "back.out(1.7)" });
                }
            },
            {
                id: 2, duration: 3.5,
                narration: "Few learn to make the world believe in their solutions.",
                videoLayout: { top: '10%', right: '8%', width: '35%', height: '22%', borderRadius: '16px' },
                photoAction: { show: ['photo1'], hide: ['photo2', 'photo3'], pos: { bottom: '8%', left: '8%', width: '45%', height: '22%' } },
                render: (container) => {
                    container.innerHTML = `<h1 style="font-size: clamp(26px, 7.5vw, 44px);" class="plex">Few learn to make the world <span class="gold">believe</span> in their solutions.</h1>`;
                    const believe = container.querySelector('.gold');
                    gsap.from(container.querySelector('h1'), { duration: 1, opacity: 0, scale: 0.9, ease: "power3.out" });
                    gsap.from(believe, { duration: 0.5, scale: 2.5, opacity: 0, delay: 0.8, ease: "elastic.out(1, 0.3)" });
                }
            },
            {
                id: 3, duration: 3.5,
                narration: "A brilliant idea can change everything.",
                videoLayout: { top: '35%', left: '30%', width: '40%', height: '30%', borderRadius: '50% / 30%' }, // Oval PIP in center
                photoAction: { show: [], hide: ['photo1'] },
                render: (container) => {
                    container.innerHTML = `<div style="display:flex; flex-direction:column; align-items:center; justify-content:center; width:100%;"><span id="idea" style="font-size: clamp(16px, 4.5vw, 22px); font-weight:700;">A brilliant idea</span><span id="everything" style="font-size: clamp(34px, 10vw, 60px); margin-top:10px;" class="gold">can change everything.</span></div>`;
                    gsap.to('#idea', { duration: 1.5, scale: 2.2, ease: "power2.inOut" });
                    gsap.from('#everything', { duration: 0.8, scale: 0, opacity: 0, delay: 1.2, ease: "back.out(2)" });
                }
            },
            {
                id: 4, duration: 3.0,
                narration: "But only if someone understands it.",
                videoLayout: { bottom: '5%', left: '5%', width: '90%', height: '24%', borderRadius: '16px' },
                photoAction: { show: ['photo2'], hide: ['photo1'], pos: { top: '8%', left: '10%', width: '35%', height: '22%' } },
                render: (container) => {
                    container.innerHTML = `<h1 style="font-size: clamp(30px, 8vw, 50px);">But only if someone <span class="gold">understands</span> it.</h1>`;
                    const chars = new SplitType(container.querySelector('h1'), { types: 'chars' }).chars;
                    gsap.from(chars, { duration: 0.6, opacity: 0, filter: "blur(10px)", stagger: 0.03, ease: "power3.out" });
                }
            },
            {
                id: 5, duration: 4.0,
                narration: "The Department of English believes every engineer deserves a voice equal to their ideas.",
                videoLayout: { top: '0%', left: '0%', width: '100%', height: '100%', borderRadius: '0px' }, // Fullscreen immersive video background
                photoAction: { show: [], hide: ['photo2'] },
                render: (container) => {
                    container.innerHTML = `<div style="display:flex; flex-direction:column; gap:8px; align-items:center; width:100%; background: rgba(255,248,240,0.85); padding: 30px; border-radius: 20px;"><span style="font-size: clamp(11px, 3.2vw, 15px); font-weight:600; letter-spacing:2px;" class="bronze">THE DEPARTMENT OF ENGLISH</span><h1 style="font-size: clamp(20px, 6vw, 36px); line-height:1.2;">Believes every engineer deserves a voice equal to their ideas.</h1></div>`;
                    gsap.from(container.firstChild, { duration: 1, opacity: 0, y: 25, ease: "power3.out" });
                }
            },
            {
                id: 6, duration: 3.5,
                narration: "Burke Club is where that voice is built.",
                videoLayout: { top: '15%', right: '10%', width: '30%', height: '30%', borderRadius: '50%' }, // Perfect Circle PIP
                photoAction: { show: ['photo3'], hide: [], pos: { bottom: '10%', left: '10%', width: '40%', height: '22%' } },
                render: (container) => {
                    container.innerHTML = `<h1 style="font-size: clamp(40px, 13vw, 76px);" class="gold">Burke Club</h1><p style="font-size: clamp(15px, 4.2vw, 20px); margin-top:10px; font-weight:600;">is where that voice is built.</p>`;
                    const chars = new SplitType(container.querySelector('.gold'), { types: 'chars' }).chars;
                    gsap.from(chars, { duration: 1, opacity: 0, x: () => gsap.utils.random(-100, 100), y: () => gsap.utils.random(-100, 100), ease: "power3.out", stagger: 0.04 });
                    gsap.from(container.querySelector('p'), { duration: 0.8, opacity: 0, y: 15, delay: 0.8 });
                }
            },
            {
                id: 7, duration: 3.5,
                narration: "This is where engineers learn to transform knowledge into influence.",
                videoLayout: { bottom: '5%', left: '10%', width: '80%', height: '25%', borderRadius: '24px' },
                photoAction: { show: [], hide: ['photo3'] },
                render: (container) => {
                    container.innerHTML = `<h1 style="font-size: clamp(26px, 7.5vw, 44px);">Transform <span id="k" class="gold">knowledge</span> into <span id="i" class="outline">influence</span>.</h1>`;
                    const tl = gsap.timeline();
                    tl.from(container.querySelector('h1'), { duration: 0.8, opacity: 0, y: 25 })
                      .to("#k", { duration: 1, scale: 1.15, color: "var(--text-main)", ease: "power2.inOut" })
                      .to("#i", { duration: 1, WebkitTextStrokeColor: "var(--accent-gold)", color: "var(--accent-gold)", ease: "power2.inOut" }, "-=0.5");
                }
            },
            {
                id: 8, duration: 3.5,
                narration: "To build arguments that withstand scrutiny.",
                videoLayout: { top: '8%', left: '8%', width: '35%', height: '24%', borderRadius: '16px' },
                photoAction: { show: ['photo1'], hide: [], pos: { bottom: '8%', right: '8%', width: '45%', height: '24%' } },
                render: (container) => {
                    container.innerHTML = `<div style="display:flex; flex-direction:column; gap:6px; width:100%;"><h2 style="font-size:clamp(26px, 8vw, 44px);">Build arguments</h2><h2 style="font-size:clamp(26px, 8vw, 44px);" class="gold">that withstand</h2><h2 style="font-size:clamp(26px, 8vw, 44px);">scrutiny.</h2></div>`;
                    const lines = container.querySelectorAll('h2');
                    gsap.from(lines, { duration: 0.8, y: 50, opacity: 0, rotationX: -90, transformOrigin: "bottom center", stagger: 0.2, ease: "back.out(1.2)" });
                }
            },
            {
                id: 9, duration: 3.0,
                narration: "To think on their feet when questions come without warning.",
                videoLayout: { top: '35%', left: '10%', width: '30%', height: '30%', borderRadius: '30% 70% 70% 30% / 30% 30% 70% 70%' }, // Organic blob shape
                photoAction: { show: [], hide: ['photo1'] },
                render: (container) => {
                    container.innerHTML = `<h1 style="font-size: clamp(24px, 7vw, 40px);">Think on their feet when questions come without warning.</h1>`;
                    const words = new SplitType(container.querySelector('h1'), { types: 'words' }).words;
                    gsap.from(words, { duration: 0.6, x: -80, opacity: 0, stagger: 0.1, ease: "power4.out" });
                }
            },
            {
                id: 10, duration: 3.5,
                narration: "To command a room. Not through volume, but through clarity.",
                videoLayout: { top: '8%', right: '8%', width: '40%', height: '26%', borderRadius: '20px' },
                photoAction: { show: ['photo2'], hide: [], pos: { bottom: '8%', left: '15%', width: '70%', height: '22%' } },
                render: (container) => {
                    container.innerHTML = `<div style="display:flex; flex-direction:column; align-items:center; width:100%;"><span style="font-size:clamp(15px, 4.2vw, 20px); font-weight:600;">Command a room.</span><span style="font-size:clamp(12px, 3.2vw, 16px); margin-top:4px; color:var(--bronze);">Not through volume, but through clarity.</span><h1 style="font-size:clamp(38px, 12vw, 70px); margin-top:10px;" class="gold">CLARITY</h1></div>`;
                    gsap.from(container.querySelector('h1'), { duration: 1, scale: 0.2, filter: "blur(12px)", opacity: 0, ease: "power4.out", delay: 0.5 });
                }
            },
            {
                id: 11, duration: 3.5,
                narration: "To persuade, negotiate, collaborate, and lead.",
                videoLayout: { bottom: '5%', right: '10%', width: '80%', height: '25%', borderRadius: '24px' },
                photoAction: { show: [], hide: ['photo2'] },
                render: (container) => {
                    container.innerHTML = `<div style="display:flex; flex-direction:column; gap:6px; font-size:clamp(28px, 9vw, 50px); font-weight:900; width:100%;" class="gold"><div>PERSUADE.</div><div>NEGOTIATE.</div><div>COLLABORATE.</div><div>LEAD.</div></div>`;
                    const items = container.querySelectorAll('div > div');
                    gsap.from(items, { duration: 0.6, x: 80, opacity: 0, stagger: 0.15, ease: "power3.out" });
                }
            },
            {
                id: 12, duration: 3.5,
                narration: "These aren't just soft skills. They're engineering skills.",
                videoLayout: { top: '10%', left: '25%', width: '50%', height: '25%', borderRadius: '50%' },
                photoAction: { show: [], hide: [] },
                render: (container) => {
                    container.innerHTML = `<h1 style="font-size: clamp(24px, 7vw, 38px);">These aren't just <span style="text-decoration:line-through; color:var(--bronze);">soft</span> <span class="gold">ENGINEERING</span> skills.</h1>`;
                    gsap.from(container.querySelector('h1'), { duration: 0.8, opacity: 0, y: 25, ease: "power2.out" });
                }
            },
            {
                id: 13, duration: 4.0,
                narration: "Every design review. Every client presentation. Every project defence. Every technical interview.",
                videoLayout: { bottom: '5%', left: '5%', width: '90%', height: '22%', borderRadius: '16px' },
                photoAction: { show: ['photo3'], hide: [], pos: { top: '8%', right: '10%', width: '35%', height: '22%' } },
                render: (container) => {
                    container.innerHTML = `<div style="display:flex; flex-direction:column; gap:6px; width:100%; max-width:380px;">
                        <div style="background:white; padding:10px 14px; border-radius:10px; font-size:clamp(13px, 3.8vw, 17px); font-weight:700; box-shadow:0 4px 15px rgba(0,0,0,0.04);">Every design review.</div>
                        <div style="background:white; padding:10px 14px; border-radius:10px; font-size:clamp(13px, 3.8vw, 17px); font-weight:700; box-shadow:0 4px 15px rgba(0,0,0,0.04);">Every client presentation.</div>
                        <div style="background:white; padding:10px 14px; border-radius:10px; font-size:clamp(13px, 3.8vw, 17px); font-weight:700; box-shadow:0 4px 15px rgba(0,0,0,0.04);">Every project defence.</div>
                        <div style="background:white; padding:10px 14px; border-radius:10px; font-size:clamp(13px, 3.8vw, 17px); font-weight:700; box-shadow:0 4px 15px rgba(0,0,0,0.04);">Every technical interview.</div>
                    </div>`;
                    const cards = container.querySelectorAll('div > div');
                    gsap.from(cards, { duration: 0.5, opacity: 0, y: 20, stagger: 0.15, ease: "back.out(1.5)" });
                }
            },
            {
                id: 14, duration: 4.5,
                narration: "Steve Jobs didn't invent every technology behind the iPhone, but he inspired millions by making complex ideas feel simple.",
                videoLayout: { top: '10%', left: '10%', width: '80%', height: '26%', borderRadius: '24px' },
                photoAction: { show: [], hide: ['photo3'] },
                render: (container) => {
                    container.innerHTML = `<div style="display:flex; flex-direction:column; gap:8px; width:100%;"><span style="font-size:clamp(13px, 3.8vw, 16px); font-weight:600; line-height:1.3;">History remembers engineers not only for what they built, but for how they shared their vision.</span><h1 style="font-size:clamp(32px, 10vw, 52px);" class="gold">STEVE JOBS</h1></div>`;
                    gsap.from(container.querySelector('h1'), { duration: 1, scale: 2, opacity: 0, filter: "blur(6px)", ease: "power3.out", delay: 0.8 });
                }
            },
            {
                id: 15, duration: 3.5,
                narration: "Great engineering changes the world. Great communication helps the world embrace it.",
                videoLayout: { bottom: '8%', right: '10%', width: '40%', height: '28%', borderRadius: '50% / 20%' },
                photoAction: { show: ['photo1'], hide: [], pos: { top: '10%', left: '10%', width: '38%', height: '24%' } },
                render: (container) => {
                    container.innerHTML = `<div style="display:flex; flex-direction:column; align-items:center; width:100%;"><h1 style="font-size: clamp(24px, 7vw, 38px);">Great engineering changes the</h1><h1 style="font-size: clamp(44px, 14vw, 78px); margin-top:6px;" class="gold" id="world1">WORLD</h1></div>`;
                    gsap.from(container.querySelectorAll('h1'), { duration: 0.8, opacity: 0, y: 25, stagger: 0.2 });
                    gsap.to("#world1", { duration: 2, rotationY: 360, repeat: -1, ease: "linear" });
                }
            },
            {
                id: 16, duration: 3.5,
                narration: "Through carefully designed events like Series Review and Voice of Legends...",
                videoLayout: { top: '25%', left: '30%', width: '40%', height: '35%', borderRadius: '16px' },
                photoAction: { show: [], hide: ['photo1'] },
                render: (container) => {
                    container.innerHTML = `<h1 style="font-size: clamp(22px, 6.5vw, 36px); line-height:1.3;">Great communication helps the world <span class="gold">embrace</span> it.</h1>`;
                    const words = new SplitType(container.querySelector('h1'), { types: 'words' }).words;
                    gsap.from(words, { duration: 0.8, opacity: 0, scale: 0.5, stagger: 0.08, ease: "back.out(1.7)" });
                }
            },
            {
                id: 17, duration: 4.0,
                narration: "...the Department of English gives you opportunities to experiment, create, perform, and discover your own voice.",
                videoLayout: { bottom: '5%', left: '5%', width: '90%', height: '25%', borderRadius: '24px' },
                photoAction: { show: ['photo2'], hide: [], pos: { top: '8%', right: '8%', width: '40%', height: '24%' } },
                render: (container) => {
                    container.innerHTML = `<div style="display:flex; flex-direction:column; gap:6px; align-items:center; width:100%;"><span style="font-size:clamp(10px, 3vw, 14px); font-weight:600;" class="bronze">SERIES REVIEW & VOICE OF LEGENDS</span><h2 style="font-size:clamp(16px, 4.8vw, 26px); line-height:1.3;">Department of English gives you opportunities to experiment, create, perform, and discover your own voice.</h2></div>`;
                    gsap.from(container.firstChild, { duration: 1, scale: 0.9, opacity: 0, ease: "power3.out" });
                }
            },
            {
                id: 18, duration: 3.5,
                narration: "The competitions are enjoyable and character building.",
                videoLayout: { top: '10%', left: '15%', width: '70%', height: '24%', borderRadius: '20px' },
                photoAction: { show: [], hide: ['photo2'] },
                render: (container) => {
                    container.innerHTML = `<h1 style="font-size: clamp(24px, 7vw, 38px);" class="plex">The competitions are enjoyable and character building.</h1>`;
                    const chars = new SplitType(container.querySelector('h1'), { types: 'chars' }).chars;
                    gsap.from(chars, { duration: 0.8, y: -25, opacity: 0, stagger: 0.02, ease: "bounce.out" });
                }
            },
            {
                id: 19, duration: 3.5,
                narration: "The confidence you build lasts a lifetime.",
                videoLayout: { top: '0%', left: '0%', width: '100%', height: '100%', borderRadius: '0px' }, // Fullscreen background video
                photoAction: { show: ['photo3'], hide: [], pos: { bottom: '10%', left: '10%', width: '40%', height: '22%' } },
                render: (container) => {
                    container.innerHTML = `<div style="display:flex; flex-direction:column; align-items:center; width:100%; background: rgba(255,248,240,0.85); padding: 30px; border-radius: 20px;"><span style="font-size:clamp(15px, 4.2vw, 20px); font-weight:600;">The confidence you build</span><h1 style="font-size:clamp(30px, 9.5vw, 52px); margin-top:10px;" class="gold" id="conf">LASTS A LIFETIME</h1></div>`;
                    gsap.from("#conf", { duration: 1, y: 60, opacity: 0, ease: "power4.out" });
                }
            },
            {
                id: 20, duration: 4.0,
                narration: "Because code may compile... but ideas must connect.",
                videoLayout: { bottom: '8%', left: '10%', width: '80%', height: '25%', borderRadius: '20px' },
                photoAction: { show: [], hide: ['photo3'] },
                render: (container) => {
                    container.innerHTML = `<div style="background:#111; color:#0f0; font-family:'IBM Plex Mono', monospace; padding:18px; border-radius:10px; width:100%; max-width:380px; text-align:left; font-size:clamp(13px, 3.8vw, 18px); box-shadow:0 10px 25px rgba(0,0,0,0.3);">
                        <p>> Code may compile...</p>
                        <p style="color:#C9A227; margin-top:10px;">> But ideas must connect.</p>
                    </div>`;
                    gsap.from(container.querySelectorAll('p'), { duration: 1, opacity: 0, y: 12, stagger: 1.2 });
                }
            },
            {
                id: 21, duration: 4.5,
                narration: "Through Burke Club, you graduate with more than technical excellence. You graduate with the confidence to inspire, the clarity to persuade, and the voice to lead.",
                videoLayout: { top: '10%', right: '10%', width: '35%', height: '28%', borderRadius: '50%' },
                photoAction: { show: ['photo1'], hide: [], pos: { bottom: '8%', left: '10%', width: '50%', height: '24%' } },
                render: (container) => {
                    container.innerHTML = `<div style="display:flex; flex-direction:column; gap:6px; align-items:center; width:100%;"><span style="font-size:clamp(11px, 3.2vw, 15px); font-weight:600;" class="bronze">THROUGH BURKE CLUB</span><h2 style="font-size:clamp(15px, 4.5vw, 25px); line-height:1.3;">You graduate with more than technical excellence. You graduate with the confidence to inspire, the clarity to persuade, and the voice to lead.</h2></div>`;
                    gsap.from(container.firstChild, { duration: 1, opacity: 0, y: 15, ease: "power3.out" });
                }
            },
            {
                id: 22, duration: 4.0,
                narration: "Lead.",
                videoLayout: { top: '25%', left: '25%', width: '50%', height: '40%', borderRadius: '28px' },
                photoAction: { show: [], hide: ['photo1'] },
                render: (container) => {
                    container.innerHTML = `<h1 style="font-size: clamp(52px, 16vw, 92px);" class="gold">LEAD.</h1>`;
                    gsap.from(container.querySelector('h1'), { duration: 2, scale: 0.2, opacity: 0, ease: "power3.out" });
                    gsap.to(container.querySelector('h1'), { duration: 2, scale: 1.1, ease: "linear", delay: 2 });
                }
            }
        ];

        let currentSceneIndex = 0;
        let isPlaying = true;
        let sceneTimeout = null;

        const stage = document.getElementById('stage');
        const playBtn = document.getElementById('playBtn');
        const replayBtn = document.getElementById('replayBtn');
        const progressBar = document.getElementById('progressBar');
        const video1 = document.getElementById('video1');

        const totalDuration = scriptData.reduce((acc, curr) => acc + curr.duration, 0);

        function updateContinuousVideo(layout) {
            gsap.to(video1, {
                duration: 0.8,
                top: layout.top || 'auto',
                bottom: layout.bottom || 'auto',
                left: layout.left || 'auto',
                right: layout.right || 'auto',
                width: layout.width,
                height: layout.height,
                borderRadius: layout.borderRadius || '16px',
                ease: "power3.out"
            });
        }

        function updateSupportingPhotos(action) {
            // Hide all first
            ['photo1', 'photo2', 'photo3'].forEach(id => {
                const el = document.getElementById(id);
                if(action.hide.includes(id)) {
                    gsap.to(el, { duration: 0.5, opacity: 0, scale: 0.8 });
                }
            });

            // Show specified
            action.show.forEach(id => {
                const el = document.getElementById(id);
                if(el && action.pos) {
                    gsap.to(el, {
                        duration: 0.8,
                        opacity: 1,
                        scale: 1,
                        top: action.pos.top || 'auto',
                        bottom: action.pos.bottom || 'auto',
                        left: action.pos.left || 'auto',
                        right: action.pos.right || 'auto',
                        width: action.pos.width,
                        height: action.pos.height,
                        ease: "power3.out"
                    });
                }
            });
        }

        function renderScene(index) {
            if (index >= scriptData.length) {
                currentSceneIndex = scriptData.length - 1;
                isPlaying = false;
                playBtn.textContent = "PLAY";
                return;
            }

            stage.innerHTML = '';
            const sceneWrapper = document.createElement('div');
            sceneWrapper.className = 'scene active';
            stage.appendChild(sceneWrapper);

            const sceneData = scriptData[index];
            sceneData.render(sceneWrapper);
            
            // Execute continuous video choreography
            updateContinuousVideo(sceneData.videoLayout);
            updateSupportingPhotos(sceneData.photoAction);

            let pastDuration = 0;
            for(let i=0; i<index; i++) pastDuration += scriptData[i].duration;
            
            gsap.to(progressBar, {
                duration: sceneData.duration,
                width: `${((pastDuration + sceneData.duration) / totalDuration) * 100}%`,
                ease: "linear"
            });

            if (isPlaying) {
                sceneTimeout = setTimeout(() => {
                    currentSceneIndex++;
                    renderScene(currentSceneIndex);
                }, sceneData.duration * 1000);
            }
        }

        playBtn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            if (isPlaying) {
                playBtn.textContent = "PAUSE";
                renderScene(currentSceneIndex);
            } else {
                playBtn.textContent = "PLAY";
                clearTimeout(sceneTimeout);
                gsap.globalTimeline.pause();
            }
        });

        replayBtn.addEventListener('click', () => {
            clearTimeout(sceneTimeout);
            gsap.globalTimeline.restart();
            currentSceneIndex = 0;
            isPlaying = true;
            playBtn.textContent = "PAUSE";
            ['photo1', 'photo2', 'photo3'].forEach(id => gsap.set(document.getElementById(id), { opacity: 0, scale: 0.8 }));
            renderScene(currentSceneIndex);
        });

        document.getElementById('fullscreenBtn').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        });

        window.addEventListener('load', () => {
            renderScene(currentSceneIndex);
        });
    </script>
</body>
</html>

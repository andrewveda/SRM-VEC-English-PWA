<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Burke Club - Cinematic Kinetic Typography & Fixed Persistent Video</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600;700&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <!-- GSAP & SplitType CDNs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://unpkg.com/split-type"></script>

    <style>
        :root {
            --bg-cream: #FFF8F0;
            --text-main: #1A1A1A;
            --accent-gold: #C9A227;
            --bronze: #A97142;
            --card-bg: rgba(255, 255, 255, 0.9);
            --card-border: rgba(201, 162, 39, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: var(--bg-cream);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            position: fixed;
            -webkit-font-smoothing: antialiased;
        }

        /* Animated Background */
        .bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .mesh-gradient {
            position: absolute;
            width: 300%;
            height: 300%;
            top: -100%;
            left: -100%;
            background: radial-gradient(circle at 30% 30%, rgba(201, 162, 39, 0.14) 0%, transparent 40%),
                        radial-gradient(circle at 70% 70%, rgba(169, 113, 66, 0.12) 0%, transparent 40%),
                        radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.7) 0%, transparent 60%);
            animation: rotateMesh 30s linear infinite;
        }

        @keyframes rotateMesh {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Permanently Fixed Persistent Video Element (Never moves or shifts position throughout) */
        #video1 {
            position: absolute;
            bottom: 5%;
            left: 5%;
            width: 90%;
            height: 32%;
            border-radius: 20px;
            z-index: 2;
            opacity: 1;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #video1 video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #video1 .video-fallback-label {
            position: absolute;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            letter-spacing: 3px;
            color: var(--bronze);
            text-transform: uppercase;
            font-weight: 600;
            z-index: 1;
        }

        /* Typography Stage - Strictly housed in upper 60% zone to guarantee zero overlap */
        .typography-stage {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 60%;
            z-index: 4;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px;
            text-align: center;
            pointer-events: none;
        }

        .scene {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            padding: 20px;
        }

        .scene.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Typography Styles */
        h1, h2, div.custom-text {
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            line-height: 1.05;
            color: var(--text-main);
            text-transform: uppercase;
            width: 100%;
            max-width: 900px;
            word-break: break-word;
        }

        .mono { font-family: 'IBM Plex Mono', monospace; }
        .plex { font-family: 'IBM Plex Sans', sans-serif; }
        .gold { color: var(--accent-gold); }
        .bronze { color: var(--bronze); }
        .outline {
            color: transparent;
            -webkit-text-stroke: 1.5px var(--text-main);
        }
        .outline-gold {
            color: transparent;
            -webkit-text-stroke: 1.5px var(--accent-gold);
        }

        /* HUD & Controls */
        .hud {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 999;
            display: flex;
            gap: 8px;
            background: rgba(26, 26, 26, 0.85);
            backdrop-filter: blur(8px);
            padding: 6px 12px;
            border-radius: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
            pointer-events: auto;
        }

        .hud button {
            background: transparent;
            border: none;
            color: #FFF8F0;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 12px;
            transition: background 0.2s;
        }

        .hud button:active {
            background: rgba(255, 255, 255, 0.3);
        }

        .progress-bar-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: rgba(0,0,0,0.05);
            z-index: 999;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--accent-gold);
            transition: width 0.1s linear;
        }
    </style>
</head>
<body>

    <div class="progress-bar-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <!-- Background Canvas -->
    <div class="bg-canvas">
        <div class="mesh-gradient"></div>
    </div>

    <!-- Permanently Locked Persistent Video Element -->
    <div id="video1">
        <span class="video-fallback-label">VIDEO 1</span>
        <video src="" muted loop playsinline></video>
    </div>

    <!-- Typography Stage -->
    <div class="typography-stage" id="stage"></div>

    <!-- HUD Control Panel -->
    <div class="hud">
        <button id="playBtn">PAUSE</button>
        <button id="replayBtn">REPLAY</button>
        <button id="fullscreenBtn">FULL</button>
    </div>

    <script>
        // Master Script with zero video position changes—the video stays locked perfectly at the bottom while text animates cleanly above.
        const scriptData = [
            {
                id: 1, duration: 3.5,
                render: (container) => {
                    container.innerHTML = `<h1 style="font-size: clamp(32px, 8.5vw, 52px);">Every engineer learns to solve problems.</h1>`;
                    const words = new SplitType(container.querySelector('h1'), { types: 'words' }).words;
                    gsap.from(words, { duration: 0.8, opacity: 0, y: (i) => (i % 2 === 0 ? -40 : 40), stagger: 0.08, ease: "back.out(1.7)" });
                }
            },
            {
                id: 2, duration: 3.5,
                render: (container) => {
                    container.innerHTML = `<h1 style="font-size: clamp(26px, 7.5vw, 44px);" class="plex">Few learn to make the world <span class="gold">believe</span> in their solutions.</h1>`;
                    const believe = container.querySelector('.gold');
                    gsap.from(container.querySelector('h1'), { duration: 1, opacity: 0, scale: 0.9, ease: "power3.out" });
                    gsap.from(believe, { duration: 0.5, scale: 2.5, opacity: 0, delay: 0.8, ease: "elastic.out(1, 0.3)" });
                }
            },
            {
                id: 3, duration: 3.5,
                render: (container) => {
                    container.innerHTML = `<div style="display:flex; flex-direction:column; align-items:center; justify-content:center; width:100%;"><span id="idea" style="font-size: clamp(16px, 4.5vw, 22px); font-weight:700;">A brilliant idea</span><span id="everything" style="font-size: clamp(34px, 10vw, 60px); margin-top:10px;" class="gold">can change everything.</span></div>`;
                    gsap.to('#idea', { duration: 1.5, scale: 2.2, ease: "power2.inOut" });
                    gsap.from('#everything', { duration: 0.8, scale: 0, opacity: 0, delay: 1.2, ease: "back.out(2)" });
                }
            },
            {
                id: 4, duration: 3.0,
                render: (container) => {
                    container.innerHTML = `<h1 style="font-size: clamp(30px, 8vw, 50px);">But only if someone <span class="gold">understands</span> it.</h1>`;
                    const chars = new SplitType(container.querySelector('h1'), { types: 'chars' }).chars;
                    gsap.from(chars, { duration: 0.6, opacity: 0, filter: "blur(10px)", stagger: 0.03, ease: "power3.out" });
                }
            },
            {
                id: 5, duration: 4.0,
                render: (container) => {
                    container.innerHTML = `<div style="display:flex; flex-direction:column; gap:8px; align-items:center; width:100%;"><span style="font-size: clamp(11px, 3.2vw, 15px); font-weight:600; letter-spacing:2px;" class="bronze">THE DEPARTMENT OF ENGLISH</span><h1 style="font-size: clamp(20px, 6vw, 34px); line-height:1.2;">Believes every engineer deserves a voice equal to their ideas.</h1></div>`;
                    gsap.from(container.firstChild, { duration: 1, opacity: 0, y: 25, ease: "power3.out" });
                }
            },
            {
                id: 6, duration: 3.5,
                render: (container) => {
                    container.innerHTML = `<h1 style="font-size: clamp(40px, 13vw, 76px);" class="gold">Burke Club</h1><p style="font-size: clamp(15px, 4.2vw, 20px); margin-top:10px; font-weight:600;">is where that voice is built.</p>`;
                    const chars = new SplitType(container.querySelector('.gold'), { types: 'chars' }).chars;
                    gsap.from(chars, { duration: 1, opacity: 0, x: () => gsap.utils.random(-80, 80), y: () => gsap.utils.random(-80, 80), ease: "power3.out", stagger: 0.04 });
                    gsap.from(container.querySelector('p'), { duration: 0.8, opacity: 0, y: 15, delay: 0.8 });
                }
            },
            {
                id: 7, duration: 3.5,
                render: (container) => {
                    container.innerHTML = `<h1 style="font-size: clamp(26px, 7.5vw, 44px);">Transform <span id="k" class="gold">knowledge</span> into <span id="i" class="outline">influence</span>.</h1>`;
                    const tl = gsap.timeline();
                    tl.from(container.querySelector('h1'), { duration: 0.8, opacity: 0, y: 25 })
                      .to("#k", { duration: 1, scale: 1.15, color: "var(--text-main)", ease: "power2.inOut" })
                      .to("#i", { duration: 1, WebkitTextStrokeColor: "var(--accent-gold)", color: "var(--accent-gold)", ease: "power2.inOut" }, "-=0.5");
                }
            },
            {
                id: 8, duration: 3.5,
                render: (container) => {
                    container.innerHTML = `<div style="display:flex; flex-direction:column; gap:6px; width:100%;"><h2 style="font-size:clamp(26px, 8vw, 44px);">Build arguments</h2><h2 style="font-size:clamp(26px, 8vw, 44px);" class="gold">that withstand</h2><h2 style="font-size:clamp(26px, 8vw, 44px);">scrutiny.</h2></div>`;
                    const lines = container.querySelectorAll('h2');
                    gsap.from(lines, { duration: 0.8, y: 40, opacity: 0, stagger: 0.2, ease: "back.out(1.2)" });
                }
            },
            {
                id: 9, duration: 3.0,
                render: (container) => {
                    container.innerHTML = `<h1 style="font-size: clamp(24px, 7vw, 40px);">Think on their feet when questions come without warning.</h1>`;
                    const words = new SplitType(container.querySelector('h1'), { types: 'words' }).words;
                    gsap.from(words, { duration: 0.6, x: -60, opacity: 0, stagger: 0.1, ease: "power4.out" });
                }
            },
            {
                id: 10, duration: 3.5,
                render: (container) => {
                    container.innerHTML = `<div style="display:flex; flex-direction:column; align-items:center; width:100%;"><span style="font-size:clamp(15px, 4.2vw, 20px); font-weight:600;">Command a room.</span><span style="font-size:clamp(12px, 3.2vw, 16px); margin-top:4px; color:var(--bronze);">Not through volume, but through clarity.</span><h1 style="font-size:clamp(38px, 12vw, 70px); margin-top:10px;" class="gold">CLARITY</h1></div>`;
                    gsap.from(container.querySelector('h1'), { duration: 1, scale: 0.2, filter: "blur(12px)", opacity: 0, ease: "power4.out", delay: 0.5 });
                }
            },
            {
                id: 11, duration: 3.5,
                render: (container) => {
                    container.innerHTML = `<div style="display:flex; flex-direction:column; gap:6px; font-size:clamp(26px, 8.5vw, 46px); font-weight:900; width:100%;" class="gold"><div>PERSUADE.</div><div>NEGOTIATE.</div><div>COLLABORATE.</div><div>LEAD.</div></div>`;
                    const items = container.querySelectorAll('div > div');
                    gsap.from(items, { duration: 0.6, x: 60, opacity: 0, stagger: 0.15, ease: "power3.out" });
                }
            },
            {
                id: 12, duration: 3.5,
                render: (container) => {
                    container.innerHTML = `<h1 style="font-size: clamp(24px, 7vw, 38px);">These aren't just <span style="text-decoration:line-through; color:var(--bronze);">soft</span> <span class="gold">ENGINEERING</span> skills.</h1>`;
                    gsap.from(container.querySelector('h1'), { duration: 0.8, opacity: 0, y: 25, ease: "power2.out" });
                }
            },
            {
                id: 13, duration: 4.0,
                render: (container) => {
                    container.innerHTML = `<div style="display:flex; flex-direction:column; gap:5px; width:100%; max-width:380px;">
                        <div style="background:white; padding:8px 12px; border-radius:8px; font-size:clamp(12px, 3.5vw, 15px); font-weight:700; box-shadow:0 4px 15px rgba(0,0,0,0.04);">Every design review.</div>
                        <div style="background:white; padding:8px 12px; border-radius:8px; font-size:clamp(12px, 3.5vw, 15px); font-weight:700; box-shadow:0 4px 15px rgba(0,0,0,0.04);">Every client presentation.</div>
                        <div style="background:white; padding:8px 12px; border-radius:8px; font-size:clamp(12px, 3.5vw, 15px); font-weight:700; box-shadow:0 4px 15px rgba(0,0,0,0.04);">Every project defence.</div>
                        <div style="background:white; padding:8px 12px; border-radius:8px; font-size:clamp(12px, 3.5vw, 15px); font-weight:700; box-shadow:0 4px 15px rgba(0,0,0,0.04);">Every technical interview.</div>
                    </div>`;
                    const cards = container.querySelectorAll('div > div');
                    gsap.from(cards, { duration: 0.5, opacity: 0, y: 15, stagger: 0.12, ease: "back.out(1.5)" });
                }
            },
            {
                id: 14, duration: 4.5,
                render: (container) => {
                    container.innerHTML = `<div style="display:flex; flex-direction:column; gap:6px; width:100%;"><span style="font-size:clamp(12px, 3.5vw, 15px); font-weight:600; line-height:1.3;">History remembers engineers not only for what they built, but for how they shared their vision.</span><h1 style="font-size:clamp(30px, 9.5vw, 48px);" class="gold">STEVE JOBS</h1></div>`;
                    gsap.from(container.querySelector('h1'), { duration: 1, scale: 1.8, opacity: 0, filter: "blur(6px)", ease: "power3.out", delay: 0.8 });
                }
            },
            {
                id: 15, duration: 3.5,
                render: (container) => {
                    container.innerHTML = `<div style="display:flex; flex-direction:column; align-items:center; width:100%;"><h1 style="font-size: clamp(22px, 6.5vw, 36px);">Great engineering changes the</h1><h1 style="font-size: clamp(40px, 13vw, 72px); margin-top:4px;" class="gold" id="world1">WORLD</h1></div>`;
                    gsap.from(container.querySelectorAll('h1'), { duration: 0.8, opacity: 0, y: 20, stagger: 0.2 });
                    gsap.to("#world1", { duration: 2, rotationY: 360, repeat: -1, ease: "linear" });
                }
            },
            {
                id: 16, duration: 3.5,
                render: (container) => {
                    container.innerHTML = `<h1 style="font-size: clamp(22px, 6.5vw, 34px); line-height:1.3;">Great communication helps the world <span class="gold">embrace</span> it.</h1>`;
                    const words = new SplitType(container.querySelector('h1'), { types: 'words' }).words;
                    gsap.from(words, { duration: 0.8, opacity: 0, scale: 0.5, stagger: 0.08, ease: "back.out(1.7)" });
                }
            },
            {
                id: 17, duration: 4.0,
                render: (container) => {
                    container.innerHTML = `<div style="display:flex; flex-direction:column; gap:4px; align-items:center; width:100%;"><span style="font-size:clamp(10px, 2.8vw, 13px); font-weight:600;" class="bronze">SERIES REVIEW & VOICE OF LEGENDS</span><h2 style="font-size:clamp(14px, 4.2vw, 22px); line-height:1.3;">Department of English gives you opportunities to experiment, create, perform, and discover your own voice.</h2></div>`;
                    gsap.from(container.firstChild, { duration: 1, scale: 0.9, opacity: 0, ease: "power3.out" });
                }
            },
            {
                id: 18, duration: 3.5,
                render: (container) => {
                    container.innerHTML = `<h1 style="font-size: clamp(22px, 6.5vw, 36px);" class="plex">The competitions are enjoyable and character building.</h1>`;
                    const chars = new SplitType(container.querySelector('h1'), { types: 'chars' }).chars;
                    gsap.from(chars, { duration: 0.8, y: -20, opacity: 0, stagger: 0.02, ease: "bounce.out" });
                }
            },
            {
                id: 19, duration: 3.5,
                render: (container) => {
                    container.innerHTML = `<div style="display:flex; flex-direction:column; align-items:center; width:100%;"><span style="font-size:clamp(14px, 4vw, 18px); font-weight:600;">The confidence you build</span><h1 style="font-size:clamp(28px, 9vw, 48px); margin-top:8px;" class="gold" id="conf">LASTS A LIFETIME</h1></div>`;
                    gsap.from("#conf", { duration: 1, y: 40, opacity: 0, ease: "power4.out" });
                }
            },
            {
                id: 20, duration: 4.0,
                render: (container) => {
                    container.innerHTML = `<div style="background:#111; color:#0f0; font-family:'IBM Plex Mono', monospace; padding:14px; border-radius:8px; width:100%; max-width:340px; text-align:left; font-size:clamp(12px, 3.5vw, 16px); box-shadow:0 8px 20px rgba(0,0,0,0.3);">
                        <p>> Code may compile...</p>
                        <p style="color:#C9A227; margin-top:8px;">> But ideas must connect.</p>
                    </div>`;
                    gsap.from(container.querySelectorAll('p'), { duration: 1, opacity: 0, y: 10, stagger: 1.2 });
                }
            },
            {
                id: 21, duration: 4.5,
                render: (container) => {
                    container.innerHTML = `<div style="display:flex; flex-direction:column; gap:4px; align-items:center; width:100%;"><span style="font-size:clamp(10px, 3vw, 13px); font-weight:600;" class="bronze">THROUGH BURKE CLUB</span><h2 style="font-size:clamp(13px, 4vw, 20px); line-height:1.3;">You graduate with more than technical excellence. You graduate with the confidence to inspire, the clarity to persuade, and the voice to lead.</h2></div>`;
                    gsap.from(container.firstChild, { duration: 1, opacity: 0, y: 10, ease: "power3.out" });
                }
            },
            {
                id: 22, duration: 4.0,
                render: (container) => {
                    container.innerHTML = `<h1 style="font-size: clamp(48px, 15vw, 84px);" class="gold">LEAD.</h1>`;
                    gsap.from(container.querySelector('h1'), { duration: 2, scale: 0.2, opacity: 0, ease: "power3.out" });
                    gsap.to(container.querySelector('h1'), { duration: 2, scale: 1.1, ease: "linear", delay: 2 });
                }
            }
        ];

        let currentSceneIndex = 0;
        let isPlaying = true;
        let sceneTimeout = null;

        const stage = document.getElementById('stage');
        const playBtn = document.getElementById('playBtn');
        const replayBtn = document.getElementById('replayBtn');
        const progressBar = document.getElementById('progressBar');

        const totalDuration = scriptData.reduce((acc, curr) => acc + curr.duration, 0);

        function renderScene(index) {
            if (index >= scriptData.length) {
                currentSceneIndex = scriptData.length - 1;
                isPlaying = false;
                playBtn.textContent = "PLAY";
                return;
            }

            stage.innerHTML = '';
            const sceneWrapper = document.createElement('div');
            sceneWrapper.className = 'scene active';
            stage.appendChild(sceneWrapper);

            const sceneData = scriptData[index];
            sceneData.render(sceneWrapper);

            let pastDuration = 0;
            for(let i=0; i<index; i++) pastDuration += scriptData[i].duration;
            
            gsap.to(progressBar, {
                duration: sceneData.duration,
                width: `${((pastDuration + sceneData.duration) / totalDuration) * 100}%`,
                ease: "linear"
            });

            if (isPlaying) {
                sceneTimeout = setTimeout(() => {
                    currentSceneIndex++;
                    renderScene(currentSceneIndex);
                }, sceneData.duration * 1000);
            }
        }

        playBtn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            if (isPlaying) {
                playBtn.textContent = "PAUSE";
                renderScene(currentSceneIndex);
            } else {
                playBtn.textContent = "PLAY";
                clearTimeout(sceneTimeout);
                gsap.globalTimeline.pause();
            }
        });

        replayBtn.addEventListener('click', () => {
            clearTimeout(sceneTimeout);
            gsap.globalTimeline.restart();
            currentSceneIndex = 0;
            isPlaying = true;
            playBtn.textContent = "PAUSE";
            renderScene(currentSceneIndex);
        });

        document.getElementById('fullscreenBtn').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        });

        window.addEventListener('load', () => {
            renderScene(currentSceneIndex);
        });
    </script>
</body>
</html>

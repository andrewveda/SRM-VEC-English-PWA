<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Career Catalyst Thon – 60-Second Aptitude Round</title>
    
    <!-- Google Fonts: Cormorant Garamond, Playfair Display, Outfit, Cinzel -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Outfit:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,800;1,600&display=swap" rel="stylesheet">
    
    <!-- GSAP CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        :root {
            --bg-cream: #F8F5F0;
            --text-main: #1C1917;
            --accent-gold: #C5A059;
            --accent-bronze: #A3704C;
            --card-border: rgba(197, 160, 89, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: var(--bg-cream);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
            position: fixed;
            -webkit-font-smoothing: antialiased;
        }

        /* Subtle Luxury Background Canvas */
        .bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .mesh-gradient {
            position: absolute;
            width: 250%;
            height: 250%;
            top: -75%;
            left: -75%;
            background: radial-gradient(circle at 30% 30%, rgba(197, 160, 89, 0.12) 0%, transparent 50%),
                        radial-gradient(circle at 70% 70%, rgba(163, 112, 76, 0.08) 0%, transparent 50%),
                        radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.95) 0%, transparent 70%);
            animation: rotateMesh 40s linear infinite;
        }

        @keyframes rotateMesh {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* PREMIUM VIDEO CONTAINER: Centered perfectly in the middle of the screen */
        #videoContainer {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 86%;
            max-width: 460px;
            height: 28vh;
            border-radius: 16px;
            z-index: 4;
            overflow: hidden;
            box-shadow: 0 24px 50px rgba(28, 25, 23, 0.12);
            border: 1.5px solid var(--card-border);
            background: #1C1917;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #videoContainer video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .media-label {
            position: absolute;
            top: 10px;
            left: 12px;
            font-family: 'Cinzel', serif;
            font-size: 8px;
            letter-spacing: 3px;
            color: var(--accent-gold);
            text-transform: uppercase;
            font-weight: 700;
            z-index: 5;
            background: rgba(248, 245, 240, 0.95);
            padding: 3px 8px;
            border-radius: 4px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
        }

        /* Typography Stages: Positioned perfectly above and below the centered video */
        .stage-top {
            position: absolute;
            top: 12%;
            left: 0;
            width: 100%;
            height: 15vh;
            z-index: 6;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
            pointer-events: none;
            text-align: center;
        }

        .stage-bottom {
            position: absolute;
            bottom: 10%;
            left: 0;
            width: 100%;
            height: 18vh;
            z-index: 6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
            pointer-events: none;
            text-align: center;
        }

        /* Posh Karaoke Word Display (Only current word/phrase visible) */
        .karaoke-word {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-weight: 700;
            font-size: clamp(34px, 10vw, 56px);
            line-height: 1.1;
            letter-spacing: -0.01em;
            color: var(--text-main);
            text-shadow: 0 4px 20px rgba(197, 160, 89, 0.25);
            will-change: transform, opacity;
            padding: 0 4px;
        }

        /* Luxury Posh Category Badge */
        .posh-badge {
            font-family: 'Cinzel', serif;
            font-size: clamp(10px, 3vw, 12px);
            font-weight: 700;
            letter-spacing: 3px;
            color: var(--accent-bronze);
            text-transform: uppercase;
            margin-bottom: 8px;
            border-bottom: 1.5px solid var(--accent-gold);
            padding-bottom: 3px;
        }

        /* HUD & Controls */
        .hud {
            position: fixed;
            bottom: 16px;
            right: 18px;
            z-index: 999;
            display: flex;
            gap: 8px;
            background: rgba(28, 25, 23, 0.88);
            backdrop-filter: blur(8px);
            padding: 6px 12px;
            border-radius: 20px;
            box-shadow: 0 8px 18px rgba(0,0,0,0.15);
        }

        .hud button {
            background: transparent;
            border: none;
            color: #F8F5F0;
            font-family: 'Cinzel', serif;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 12px;
            transition: background 0.2s;
        }

        .hud button:active { background: rgba(255, 255, 255, 0.2); }

        .progress-bar-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: rgba(0,0,0,0.05);
            z-index: 999;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--accent-gold);
            transition: width 0.1s linear;
        }
    </style>
</head>
<body>

    <div class="progress-bar-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <!-- Background Canvas -->
    <div class="bg-canvas">
        <div class="mesh-gradient"></div>
    </div>

    <!-- TOP STAGE: Category / Context -->
    <div class="stage-top" id="topStage">
        <div class="posh-badge" id="badgeText">Career Catalyst Thon</div>
    </div>

    <!-- CENTERED VIDEO CONTAINER -->
    <div id="videoContainer">
        <span class="media-label">Aptitude Round</span>
        <video src="" muted loop playsinline></video>
    </div>

    <!-- BOTTOM STAGE: Posh Karaoke Word-by-Word Reveal (No upcoming words shown) -->
    <div class="stage-bottom" id="bottomStage">
        <div class="karaoke-word" id="wordDisplay">Begin...</div>
    </div>

    <!-- HUD Control Panel -->
    <div class="hud">
        <button id="playBtn">PAUSE</button>
        <button id="replayBtn">REPLAY</button>
        <button id="fullscreenBtn">FULL</button>
    </div>

    <script>
        const scriptData = [
            {
                id: 1, duration: 3.5,
                badge: "Introduction",
                words: ["Who", "doesn't", "love", "a", "good", "puzzle?"]
            },
            {
                id: 2, duration: 5.0,
                badge: "The Seven Games",
                words: ["Today,", "you'll", "play", "Jigsaw,", "Hangman,", "Wordle", "Blitz,", "Blossom,", "Anagrams,", "Jumbled", "Words,", "and", "Jumbled", "Sentences."]
            },
            {
                id: 3, duration: 3.2,
                badge: "Perspective",
                words: ["Sounds", "like", "entertainment,", "doesn't", "it?"]
            },
            {
                id: 4, duration: 4.2,
                badge: "Cognitive Science",
                words: ["Well...", "there's", "a", "reason", "these", "games", "appear", "in", "cognitive", "research."]
            },
            {
                id: 5, duration: 4.5,
                badge: "Mental Abilities",
                words: ["Decades", "of", "science", "prove", "they", "measure", "vital", "cognitive", "abilities."]
            },
            {
                id: 6, duration: 4.5,
                badge: "Reasoning & Logic",
                words: ["Jigsaw", "builds", "spatial", "reasoning.", "Wordle", "and", "Hangman", "reveal", "deduction."]
            },
            {
                id: 7, duration: 4.5,
                badge: "Verbal Agility",
                words: ["Blossom", "and", "Anagrams", "test", "vocabulary,", "verbal", "fluency,", "and", "flexibility."]
            },
            {
                id: 8, duration: 4.5,
                badge: "Structure & Flow",
                words: ["Jumbled", "words", "challenge", "grammar,", "while", "sentences", "measure", "logical", "flow."]
            },
            {
                id: 9, duration: 4.2,
                badge: "Real Skills",
                words: ["While", "having", "fun,", "your", "brain", "demonstrates", "true", "professional", "skill."]
            },
            {
                id: 10, duration: 4.8,
                badge: "Employer Valued",
                words: ["Problem-solving,", "working", "memory,", "speed,", "analytical", "thinking,", "and", "communication."]
            },
            {
                id: 11, duration: 3.8,
                badge: "The Approach",
                words: ["So", "don't", "overthink", "it.", "Play,", "experiment,", "and", "trust", "your", "instincts."]
            },
            {
                id: 12, duration: 3.5,
                badge: "The Golden Rule",
                words: ["And", "most", "importantly...", "Have", "fun."]
            },
            {
                id: 13, duration: 3.5,
                badge: "Let's Begin",
                words: ["Let's", "get", "started!"]
            }
        ];

        let currentSceneIndex = 0;
        let isPlaying = true;
        let currentTimeline = null;
        let sceneTimeout = null;

        const badgeText = document.getElementById('badgeText');
        const wordDisplay = document.getElementById('wordDisplay');
        const playBtn = document.getElementById('playBtn');
        const replayBtn = document.getElementById('replayBtn');
        const progressBar = document.getElementById('progressBar');

        const totalDuration = scriptData.reduce((acc, curr) => acc + curr.duration, 0);

        function renderScene(index) {
            if (index >= scriptData.length) {
                currentSceneIndex = scriptData.length - 1;
                isPlaying = false;
                playBtn.textContent = "PLAY";
                return;
            }

            if (currentTimeline) currentTimeline.kill();

            const data = scriptData[index];
            badgeText.textContent = data.badge;

            currentTimeline = gsap.timeline();
            const words = data.words;
            const wordWindow = data.duration * 0.85;
            const timePerWord = wordWindow / words.length;

            words.forEach((word, i) => {
                const startTime = i * timePerWord;
                
                currentTimeline.call(() => {
                    wordDisplay.textContent = word;
                    // Posh entrance animation for each single word
                    gsap.fromTo(wordDisplay, 
                        { opacity: 0, y: 14, scale: 0.94, rotation: (Math.random() * 4 - 2) },
                        { opacity: 1, y: 0, scale: 1, rotation: 0, duration: 0.35, ease: "power2.out", overwrite: "auto" }
                    );
                }, null, startTime);
            });

            // Update Global Progress Bar
            let pastDuration = 0;
            for (let i = 0; i < index; i++) pastDuration += scriptData[i].duration;

            gsap.to(progressBar, {
                duration: data.duration,
                width: `${((pastDuration + data.duration) / totalDuration) * 100}%`,
                ease: "linear"
            });

            // Schedule Next Scene
            if (isPlaying) {
                sceneTimeout = setTimeout(() => {
                    currentSceneIndex++;
                    renderScene(currentSceneIndex);
                }, data.duration * 1000);
            }
        }

        playBtn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            if (isPlaying) {
                playBtn.textContent = "PAUSE";
                renderScene(currentSceneIndex);
            } else {
                playBtn.textContent = "PLAY";
                clearTimeout(sceneTimeout);
                if (currentTimeline) currentTimeline.pause();
                gsap.globalTimeline.pause();
            }
        });

        replayBtn.addEventListener('click', () => {
            clearTimeout(sceneTimeout);
            if (currentTimeline) currentTimeline.kill();
            gsap.globalTimeline.restart();
            currentSceneIndex = 0;
            isPlaying = true;
            playBtn.textContent = "PAUSE";
            renderScene(currentSceneIndex);
        });

        document.getElementById('fullscreenBtn').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        });

        window.addEventListener('load', () => {
            renderScene(currentSceneIndex);
        });
    </script>
</body>
</html>

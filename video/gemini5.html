<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Career Catalyst Thon – 60-Second Aptitude Round</title>
    
    <!-- Google Fonts: Cormorant Garamond, Outfit, Cinzel -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- GSAP CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        :root {
            --bg-cream: #F8F5F0;
            --text-main: #1C1917;
            --accent-gold: #C5A059;
            --accent-bronze: #A3704C;
            --card-border: rgba(197, 160, 89, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: var(--bg-cream);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
            position: fixed;
            -webkit-font-smoothing: antialiased;
        }

        /* Subtle Luxury Background Canvas */
        .bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .mesh-gradient {
            position: absolute;
            width: 250%;
            height: 250%;
            top: -75%;
            left: -75%;
            background: radial-gradient(circle at 30% 30%, rgba(197, 160, 89, 0.12) 0%, transparent 50%),
                        radial-gradient(circle at 70% 70%, rgba(163, 112, 76, 0.08) 0%, transparent 50%),
                        radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.95) 0%, transparent 70%);
            animation: rotateMesh 40s linear infinite;
        }

        @keyframes rotateMesh {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* PREMIUM VIDEO CONTAINER: Pushed further down as requested */
        #videoContainer {
            position: absolute;
            top: 72%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 400px;
            height: 20vh;
            border-radius: 12px;
            z-index: 4;
            overflow: hidden;
            box-shadow: 0 16px 32px rgba(28, 25, 23, 0.10);
            border: 1.5px solid var(--card-border);
            background: #1C1917;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #videoContainer video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .media-label {
            position: absolute;
            top: 6px;
            left: 8px;
            font-family: 'Cinzel', serif;
            font-size: 7px;
            letter-spacing: 2px;
            color: var(--accent-gold);
            text-transform: uppercase;
            font-weight: 700;
            z-index: 5;
            background: rgba(248, 245, 240, 0.95);
            padding: 2px 6px;
            border-radius: 3px;
        }

        /* TOP STAGE: Dynamic Infographic Container (Expanded Area) */
        .stage-top {
            position: absolute;
            top: 4%;
            left: 0;
            width: 100%;
            height: 52vh;
            z-index: 6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 0 18px;
            pointer-events: none;
            text-align: center;
        }

        .posh-badge {
            font-family: 'Cinzel', serif;
            font-size: clamp(9px, 2.5vw, 11px);
            font-weight: 700;
            letter-spacing: 3px;
            color: var(--accent-bronze);
            text-transform: uppercase;
            margin-bottom: 4px;
            border-bottom: 1.5px solid var(--accent-gold);
            padding-bottom: 2px;
        }

        /* Infographic Card Layout with Tables, Graphs & Animations */
        .infographic-card {
            width: 100%;
            max-width: 440px;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 10px 14px;
            box-shadow: 0 10px 30px rgba(197, 160, 89, 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 220px;
            max-height: 245px;
            transition: all 0.3s ease;
        }

        .info-category-title {
            font-family: 'Cinzel', serif;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: 1.5px;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        /* Infographic Grid Layouts */
        .info-content-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .info-pill {
            font-family: 'Outfit', sans-serif;
            font-size: 10.5px;
            font-weight: 600;
            background: rgba(197, 160, 89, 0.12);
            color: var(--text-main);
            padding: 3px 8px;
            border-radius: 16px;
            border: 1px solid rgba(197, 160, 89, 0.25);
            letter-spacing: 0.3px;
        }

        /* Graph Elements (Animated Bars) */
        .graph-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-top: 4px;
        }

        .graph-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 10px;
            font-weight: 600;
            color: var(--text-main);
        }

        .graph-bar-bg {
            flex-grow: 1;
            height: 7px;
            background: rgba(197, 160, 89, 0.15);
            border-radius: 4px;
            margin-left: 8px;
            overflow: hidden;
            position: relative;
        }

        .graph-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-bronze), var(--accent-gold));
            border-radius: 4px;
            width: 0%;
            transition: width 0.8s cubic-bezier(0.1, 1, 0.1, 1);
        }

        /* Table Components for structured view */
        .info-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 10px;
            margin-top: 2px;
        }

        .info-table td {
            padding: 4px 6px;
            border-bottom: 1px solid rgba(197, 160, 89, 0.15);
            text-align: left;
            font-weight: 500;
        }

        .info-table td:last-child {
            text-align: right;
            font-weight: 700;
            color: var(--accent-bronze);
        }

        .info-stat-display {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 14px;
            color: var(--accent-bronze);
            line-height: 1.2;
            text-align: center;
        }

        /* BOTTOM STAGE: Karaoke Text Display */
        .stage-bottom {
            position: absolute;
            bottom: 2%;
            left: 0;
            width: 100%;
            height: 14vh;
            z-index: 6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
            pointer-events: none;
            text-align: center;
        }

        .karaoke-word {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-weight: 700;
            font-size: clamp(26px, 8vw, 42px);
            line-height: 1.1;
            letter-spacing: -0.01em;
            color: var(--text-main);
            text-shadow: 0 4px 20px rgba(197, 160, 89, 0.25);
            will-change: transform, opacity;
            padding: 0 4px;
        }

        /* HUD & Controls */
        .hud {
            position: fixed;
            bottom: 10px;
            right: 12px;
            z-index: 999;
            display: flex;
            gap: 6px;
            background: rgba(28, 25, 23, 0.88);
            backdrop-filter: blur(8px);
            padding: 5px 10px;
            border-radius: 18px;
            box-shadow: 0 8px 18px rgba(0,0,0,0.15);
        }

        .hud button {
            background: transparent;
            border: none;
            color: #F8F5F0;
            font-family: 'Cinzel', serif;
            font-size: 8.5px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            padding: 3px 6px;
            border-radius: 10px;
            transition: background 0.2s;
        }

        .hud button:active { background: rgba(255, 255, 255, 0.2); }

        .progress-bar-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: rgba(0,0,0,0.05);
            z-index: 999;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--accent-gold);
            transition: width 0.1s linear;
        }
    </style>
</head>
<body>

    <div class="progress-bar-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <!-- Background Canvas -->
    <div class="bg-canvas">
        <div class="mesh-gradient"></div>
    </div>

    <!-- TOP STAGE: Infographic Display Panel (Tables, Graphs, Animation) -->
    <div class="stage-top" id="topStage">
        <div class="posh-badge" id="badgeText">Career Catalyst Thon</div>
        <div class="infographic-card" id="infoCard">
            <div class="info-category-title" id="infoTitle">Aptitude Round</div>
            <div class="info-content-grid" id="infoContent">
                <span class="info-pill">Logic</span>
                <span class="info-pill">Speed</span>
                <span class="info-pill">Strategy</span>
            </div>
        </div>
    </div>

    <!-- CENTERED VIDEO CONTAINER (Pushed Lower) -->
    <div id="videoContainer">
        <span class="media-label">Aptitude Round</span>
        <video src="" muted loop playsinline></video>
    </div>

    <!-- BOTTOM STAGE: Posh Karaoke Word-by-Word Reveal -->
    <div class="stage-bottom" id="bottomStage">
        <div class="karaoke-word" id="wordDisplay">Begin...</div>
    </div>

    <!-- HUD Control Panel -->
    <div class="hud">
        <button id="playBtn">PAUSE</button>
        <button id="replayBtn">REPLAY</button>
        <button id="fullscreenBtn">FULL</button>
    </div>

    <script>
        const scriptData = [
            {
                id: 1, duration: 3.5,
                badge: "Scene 1",
                type: "grid",
                infoTitle: "Welcome to Aptitude Round",
                elements: ["⏱️ 60 Seconds", "🧩 7 Challenges", "🧠 Think Fast", "⚡ Think Smart"]
            },
            {
                id: 2, duration: 5.0,
                badge: "Scene 2",
                type: "grid",
                infoTitle: "Today's Challenges",
                elements: ["🧩 Jigsaw", "🔤 Hangman", "🟩 Wordle", "🌸 Blossom", "🔀 Anagrams", "📝 Words", "📄 Sentences"]
            },
            {
                id: 3, duration: 3.2,
                badge: "Scene 3",
                type: "table",
                infoTitle: "More Than A Game",
                tableData: [
                    ["Decision Making", "Active"],
                    ["Pattern Detection", "Verified"],
                    ["Mental Agility", "Tested"]
                ]
            },
            {
                id: 4, duration: 4.2,
                badge: "Scene 4",
                type: "grid",
                infoTitle: "The Science Behind",
                elements: ["🧠 Cognitive Science", "📊 Psychometric Test", "🔬 Evidence-Based", "⚡ Executive Functions"]
            },
            {
                id: 5, duration: 4.5,
                badge: "Scene 5",
                type: "graph",
                infoTitle: "What Is Measured",
                graphData: [
                    { label: "Fluid Intelligence", val: "92%" },
                    { label: "Working Memory", val: "88%" },
                    { label: "Processing Speed", val: "95%" }
                ]
            },
            {
                id: 6, duration: 4.5,
                badge: "Scene 6",
                type: "grid",
                infoTitle: "Jigsaw • Wordle • Hangman",
                elements: ["🧩 Spatial Reasoning", "🔍 Pattern Recognition", "🧠 Deductive Logic", "👁️ Visual Processing"]
            },
            {
                id: 7, duration: 4.5,
                badge: "Scene 7",
                type: "grid",
                infoTitle: "Blossom & Anagrams",
                elements: ["📚 Vocabulary Depth", "🗣️ Verbal Fluency", "🌐 Semantic Nets", "💡 Creative Association"]
            },
            {
                id: 8, duration: 4.5,
                badge: "Scene 8",
                type: "grid",
                infoTitle: "Words & Sentences",
                elements: ["✍️ Grammar", "📖 Syntax Processing", "🔢 Sequencing", "📘 Reading Comprehension"]
            },
            {
                id: 9, duration: 4.2,
                badge: "Scene 9",
                type: "table",
                infoTitle: "Beyond The Screen",
                tableData: [
                    ["Focus Level", "Optimal"],
                    ["Execution", "High-Speed"],
                    ["Strategy", "Dynamic"]
                ]
            },
            {
                id: 10, duration: 4.8,
                badge: "Scene 10",
                type: "graph",
                infoTitle: "Employers Value",
                graphData: [
                    { label: "Critical Thinking", val: "98%" },
                    { label: "Problem Solving", val: "96%" },
                    { label: "Adaptability", val: "90%" }
                ]
            },
            {
                id: 11, duration: 3.8,
                badge: "Scene 11",
                type: "grid",
                infoTitle: "Your Strategy",
                elements: ["🎯 Trust Instincts", "🧠 Think Clearly", "⚡ Stay Focused", "🚀 Finish Strong"]
            },
            {
                id: 12, duration: 3.5,
                badge: "Scene 12",
                type: "stat",
                infoTitle: "One Last Thing",
                elements: ["Every answer teaches you something. Learn, Grow, Improve."]
            },
            {
                id: 13, duration: 3.5,
                badge: "Scene 13",
                type: "grid",
                infoTitle: "Let's Begin!",
                elements: ["🎯 Challenge Mind", "🧩 Solve Puzzles", "🏆 Unlock Potential", "🍀 Good Luck!"]
            }
        ];

        const scriptWords = [
            ["Who", "doesn't", "love", "a", "good", "puzzle?"],
            ["Today,", "you'll", "play", "Jigsaw,", "Hangman,", "Wordle", "Blitz,", "Blossom,", "Anagrams,", "Jumbled", "Words,", "and", "Jumbled", "Sentences."],
            ["Sounds", "like", "entertainment,", "doesn't", "it?"],
            ["Well...", "there's", "a", "reason", "these", "games", "appear", "in", "cognitive", "research."],
            ["Decades", "of", "science", "prove", "they", "measure", "vital", "cognitive", "abilities."],
            ["Jigsaw", "builds", "spatial", "reasoning.", "Wordle", "and", "Hangman", "reveal", "deduction."],
            ["Blossom", "and", "Anagrams", "test", "vocabulary,", "verbal", "fluency,", "and", "flexibility."],
            ["Jumbled", "words", "challenge", "grammar,", "while", "sentences", "measure", "logical", "flow."],
            ["While", "having", "fun,", "your", "brain", "demonstrates", "true", "professional", "skill."],
            ["Problem-solving,", "working", "memory,", "speed,", "analytical", "thinking,", "and", "communication."],
            ["So", "don't", "overthink", "it.", "Play,", "experiment,", "and", "trust", "your", "instincts."],
            ["And", "most", "importantly...", "Have", "fun."],
            ["Let's", "get", "started!"]
        ];

        let currentSceneIndex = 0;
        let isPlaying = true;
        let currentTimeline = null;
        let sceneTimeout = null;

        const badgeText = document.getElementById('badgeText');
        const infoTitle = document.getElementById('infoTitle');
        const infoContent = document.getElementById('infoContent');
        const wordDisplay = document.getElementById('wordDisplay');
        const playBtn = document.getElementById('playBtn');
        const replayBtn = document.getElementById('replayBtn');
        const progressBar = document.getElementById('progressBar');

        const totalDuration = scriptData.reduce((acc, curr) => acc + curr.duration, 0);

        function renderScene(index) {
            if (index >= scriptData.length) {
                currentSceneIndex = scriptData.length - 1;
                isPlaying = false;
                playBtn.textContent = "PLAY";
                return;
            }

            if (currentTimeline) currentTimeline.kill();

            const data = scriptData[index];
            const words = scriptWords[index];
            badgeText.textContent = data.badge;
            infoTitle.textContent = data.infoTitle;

            // Render Infographic Content Based on Type (Grid, Table, Graph, Stat)
            infoContent.innerHTML = '';
            if (data.type === 'grid') {
                data.elements.forEach(item => {
                    const pill = document.createElement('span');
                    pill.className = 'info-pill';
                    pill.textContent = item;
                    infoContent.appendChild(pill);
                });
            } else if (data.type === 'table') {
                const table = document.createElement('table');
                table.className = 'info-table';
                data.tableData.forEach(row => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `<td>${row[0]}</td><td>${row[1]}</td>`;
                    table.appendChild(tr);
                });
                infoContent.appendChild(table);
            } else if (data.type === 'graph') {
                const graphContainer = document.createElement('div');
                graphContainer.className = 'graph-container';
                data.graphData.forEach(item => {
                    const row = document.createElement('div');
                    row.className = 'graph-row';
                    row.innerHTML = `<span>${item.label}</span><div class="graph-bar-bg"><div class="graph-bar-fill" style="width: 0%;"></div></div>`;
                    graphContainer.appendChild(row);
                });
                infoContent.appendChild(graphContainer);
                
                // Animate graph bars after render
                setTimeout(() => {
                    const fills = infoContent.querySelectorAll('.graph-bar-fill');
                    fills.forEach((fill, i) => {
                        fill.style.width = data.graphData[i].val;
                    });
                }, 50);
            } else if (data.type === 'stat') {
                const statEl = document.createElement('div');
                statEl.className = 'info-stat-display';
                statEl.textContent = data.elements[0];
                infoContent.appendChild(statEl);
            }

            // Animate card appearance
            gsap.fromTo("#infoCard", 
                { opacity: 0, y: -8, scale: 0.98 },
                { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "power2.out" }
            );

            // Karaoke Word Timeline
            currentTimeline = gsap.timeline();
            const wordWindow = data.duration * 0.85;
            const timePerWord = wordWindow / words.length;

            words.forEach((word, i) => {
                const startTime = i * timePerWord;
                currentTimeline.call(() => {
                    wordDisplay.textContent = word;
                    gsap.fromTo(wordDisplay, 
                        { opacity: 0, y: 10, scale: 0.95, rotation: (Math.random() * 4 - 2) },
                        { opacity: 1, y: 0, scale: 1, rotation: 0, duration: 0.3, ease: "power2.out", overwrite: "auto" }
                    );
                }, null, startTime);
            });

            // Update Progress Bar
            let pastDuration = 0;
            for (let i = 0; i < index; i++) pastDuration += scriptData[i].duration;

            gsap.to(progressBar, {
                duration: data.duration,
                width: `${((pastDuration + data.duration) / totalDuration) * 100}%`,
                ease: "linear"
            });

            // Schedule Next Scene
            if (isPlaying) {
                sceneTimeout = setTimeout(() => {
                    currentSceneIndex++;
                    renderScene(currentSceneIndex);
                }, data.duration * 1000);
            }
        }

        playBtn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            if (isPlaying) {
                playBtn.textContent = "PAUSE";
                renderScene(currentSceneIndex);
            } else {
                playBtn.textContent = "PLAY";
                clearTimeout(sceneTimeout);
                if (currentTimeline) currentTimeline.pause();
                gsap.globalTimeline.pause();
            }
        });

        replayBtn.addEventListener('click', () => {
            clearTimeout(sceneTimeout);
            if (currentTimeline) currentTimeline.kill();
            gsap.globalTimeline.restart();
            currentSceneIndex = 0;
            isPlaying = true;
            playBtn.textContent = "PAUSE";
            renderScene(currentSceneIndex);
        });

        document.getElementById('fullscreenBtn').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        });

        window.addEventListener('load', () => {
            renderScene(currentSceneIndex);
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Catalyst Thon - Cinematic Kinetic Typography (Complete Script 60s)</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;600;700;800&family=Inter:wght@400;700;800;900&display=swap" rel="stylesheet">

    <!-- GSAP & SplitType via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://unpkg.com/split-type"></script>

    <style>
        /* ==========================================================================
           1. CSS RESET & VARIABLES
           ========================================================================== */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-color: #FFF8F0;
            --text-primary: #1A1A1A;
            --accent-gold: #C9A227;
            --bronze: #A97142;
            --muted-grey: #666666;
            
            --font-inter: 'Inter', sans-serif;
            --font-plex-sans: 'IBM Plex Sans', sans-serif;
            --font-plex-mono: 'IBM Plex Mono', monospace;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-inter);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ==========================================================================
           2. CINEMATIC BACKGROUND ENGINE
           ========================================================================== */
        #bg-canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        .mesh-gradient-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            will-change: transform;
        }
        .orb-1 {
            width: 70vw;
            height: 70vw;
            background: radial-gradient(circle, var(--accent-gold) 0%, rgba(201,162,39,0) 70%);
            top: -25vw;
            left: -15vw;
            animation: floatOrb1 10s ease-in-out infinite alternate;
        }
        .orb-2 {
            width: 60vw;
            height: 60vw;
            background: radial-gradient(circle, var(--bronze) 0%, rgba(169,113,66,0) 70%);
            bottom: -20vw;
            right: -15vw;
            animation: floatOrb2 12s ease-in-out infinite alternate;
        }

        @keyframes floatOrb1 {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            100% { transform: translate(15vw, 20vh) scale(1.25) rotate(45deg); }
        }
        @keyframes floatOrb2 {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            100% { transform: translate(-18vw, -15vh) scale(1.3) rotate(-45deg); }
        }

        .blueprint-grid {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(to right, rgba(26,26,26,0.04) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(26,26,26,0.04) 1px, transparent 1px);
            background-size: 60px 60px;
            opacity: 0.7;
        }

        .eng-line {
            position: absolute;
            background: linear-gradient(90deg, transparent, rgba(201,162,39,0.5), transparent);
            height: 2px;
            width: 100%;
            will-change: transform;
        }

        .light-ray {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg at 50% 50%, rgba(255,255,255,0) 0deg, rgba(201,162,39,0.06) 60deg, rgba(255,255,255,0) 120deg);
            animation: rotateRay 20s linear infinite;
        }

        @keyframes rotateRay {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .grain-overlay {
            position: absolute;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 2;
        }

        /* ==========================================================================
           3. STAGE & CANVAS CONTAINER (1920x1080 Scaled)
           ========================================================================== */
        #viewport-wrapper {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            overflow: hidden;
        }

        #cinematic-stage {
            width: 1920px;
            height: 1080px;
            position: relative;
            overflow: hidden;
            transform-origin: center center;
            will-change: transform;
        }

        .scene {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            visibility: hidden;
            padding: 80px;
        }

        .scene.active {
            opacity: 1;
            pointer-events: auto;
            visibility: visible;
        }

        /* Typography Utility Classes */
        .text-huge {
            font-family: var(--font-inter);
            font-weight: 900;
            font-size: 13rem;
            text-transform: uppercase;
            line-height: 0.85;
            letter-spacing: -0.04em;
            text-align: center;
        }

        .text-mono {
            font-family: var(--font-plex-mono);
        }

        .text-sans {
            font-family: var(--font-plex-sans);
        }

        .accent-color {
            color: var(--accent-gold);
        }

        .bronze-color {
            color: var(--bronze);
        }

        /* ==========================================================================
           4. UI CONTROLS & HUD OVERLAY
           ========================================================================== */
        #hud-overlay {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100vw;
            padding: 20px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(to top, rgba(255,248,240,0.9), transparent);
            z-index: 100;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        body:hover #hud-overlay, #hud-overlay.active {
            opacity: 1;
        }

        .hud-left, .hud-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .hud-btn {
            background: var(--text-primary);
            color: var(--bg-color);
            border: none;
            padding: 8px 16px;
            font-family: var(--font-plex-mono);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s, transform 0.1s;
        }

        .hud-btn:hover {
            background: var(--accent-gold);
            color: var(--text-primary);
        }

        .timeline-track {
            width: 400px;
            height: 4px;
            background: rgba(26,26,26,0.15);
            border-radius: 2px;
            position: relative;
            cursor: pointer;
        }

        .timeline-progress {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background: var(--accent-gold);
            border-radius: 2px;
        }

        #scene-indicator {
            font-family: var(--font-plex-mono);
            font-size: 0.85rem;
            color: var(--muted-grey);
            font-weight: 600;
        }

        #shortcut-hint {
            position: fixed;
            top: 20px;
            right: 30px;
            font-family: var(--font-plex-mono);
            font-size: 0.75rem;
            color: var(--muted-grey);
            background: rgba(26,26,26,0.05);
            padding: 6px 12px;
            border-radius: 4px;
            z-index: 100;
            pointer-events: none;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <!-- Cinematic Background Engine -->
    <div id="bg-canvas-container">
        <div class="light-ray"></div>
        <div class="blueprint-grid"></div>
        <div class="mesh-gradient-orb orb-1"></div>
        <div class="mesh-gradient-orb orb-2"></div>
        <div class="eng-line" style="top: 20%;"></div>
        <div class="eng-line" style="top: 80%;"></div>
    </div>
    <div class="grain-overlay"></div>

    <!-- Main Viewport / 1920x1080 Stage -->
    <div id="viewport-wrapper">
        <div id="cinematic-stage"></div>
    </div>

    <!-- HUD & Controls -->
    <div id="hud-overlay">
        <div class="hud-left">
            <button class="hud-btn" id="play-pause-btn">PAUSE</button>
            <button class="hud-btn" id="replay-btn">REPLAY</button>
            <div id="scene-indicator">SCENE 01 / 24</div>
        </div>
        <div class="timeline-track" id="timeline-track">
            <div class="timeline-progress" id="timeline-progress"></div>
        </div>
        <div class="hud-right">
            <button class="hud-btn" id="fullscreen-btn">FULLSCREEN [F]</button>
        </div>
    </div>

    <div id="shortcut-hint">SPACE: Pause | ← / →: Navigate | F: Fullscreen</div>

    <script>
        /* ==========================================================================
           1. FULL COMPLETE SCRIPT STRUCTURE (Exact 60 Seconds, Zero Pauses)
           ========================================================================== */
        const scriptData = [
            { id: 1, text: "Looks like a game.", duration: 2.0 },
            { id: 2, text: "Doesn't it?", duration: 1.5 },
            { id: 3, text: "It isn't.", duration: 1.5 },
            { id: 4, text: "Every puzzle is a hidden interview.", duration: 2.5 },
            { id: 5, text: "Every second your brain is making hundreds of decisions.", duration: 2.8 },
            { id: 6, text: "Can you spot a pattern before everyone else?", duration: 2.5 },
            { id: 7, text: "Can you hold information in your mind while making something new?", duration: 2.8 },
            { id: 8, text: "Can you abandon a bad idea to find a better one?", duration: 2.8 },
            { id: 9, text: "That is not gaming.", duration: 2.0 },
            { id: 10, text: "That is processing speed.", duration: 2.2 },
            { id: 11, text: "That is working memory.", duration: 2.2 },
            { id: 12, text: "That is cognitive flexibility.", duration: 2.5 },
            { id: 13, text: "That is the science of problem solving.", duration: 2.8 },
            { id: 14, text: "And it is exactly why the world's leading employers...", duration: 3.0 },
            { id: 15, text: "...from Google and Microsoft...", duration: 2.5 },
            { id: 16, text: "...to Accenture, Deloitte, EY, PwC, JP Morgan Chase, and McKinsey...", duration: 3.5 },
            { id: 17, text: "...are increasingly looking beyond memorised answers...", duration: 3.0 },
            { id: 18, text: "...and evaluating how you think.", duration: 2.5 },
            { id: 19, text: "Every clue rewires your strategy.", duration: 2.2 },
            { id: 20, text: "Every mistake becomes feedback.", duration: 2.2 },
            { id: 21, text: "Every puzzle strengthens the mental muscles behind reasoning, decision making, and creativity.", duration: 3.5 },
            { id: 22, text: "So when placements begin, you won't just know more, you will think better.", duration: 3.5 },
            { id: 23, text: "Career Catalyst Thon.", duration: 2.5 },
            { id: 24, text: "Because the strongest brains win!", duration: 3.0 }
        ];

        /* ==========================================================================
           2. STAGE SCALING & RESPONSIVE ENGINE
           ========================================================================== */
        const stage = document.getElementById('cinematic-stage');
        function scaleStage() {
            const targetWidth = 1920;
            const targetHeight = 1080;
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;
            
            const scaleX = windowWidth / targetWidth;
            const scaleY = windowHeight / targetHeight;
            const scale = Math.min(scaleX, scaleY);
            
            stage.style.transform = `scale(${scale})`;
        }
        window.addEventListener('resize', scaleStage);
        scaleStage();

        /* ==========================================================================
           3. HTML SCENE GENERATION
           ========================================================================== */
        function buildScenes() {
            stage.innerHTML = '';
            scriptData.forEach((data, index) => {
                const sceneDiv = document.createElement('div');
                sceneDiv.className = 'scene';
                sceneDiv.id = `scene-${index + 1}`;
                sceneDiv.innerHTML = `<div class="text-huge" style="width: 100%; word-wrap: break-word; text-align: center;" id="text-${index + 1}">${data.text}</div>`;
                stage.appendChild(sceneDiv);
            });
        }

        /* ==========================================================================
           4. MASTER GSAP TIMELINE & CONTINUOUS KINETIC ENGINE (60s Exact)
           ========================================================================== */
        let masterTimeline = gsap.timeline({ paused: true });
        const sceneElements = [];

        function initAnimations() {
            buildScenes();
            masterTimeline.clear();

            scriptData.forEach((data, index) => {
                const sceneNum = index + 1;
                const sceneEl = document.getElementById(`scene-${sceneNum}`);
                sceneElements.push(sceneEl);

                const sceneTl = gsap.timeline();

                sceneTl.set(sceneEl, { className: 'scene active' }, 0);
                if (index > 0) {
                    sceneTl.set(sceneElements[index - 1], { className: 'scene' }, 0);
                }

                // High-energy dynamic split text entry for every single word in the script
                const split = new SplitType(`#text-${sceneNum}`, { types: 'words,chars' });
                
                // Varied randomized high-speed entry animations across scenes
                if (sceneNum % 4 === 0) {
                    sceneTl.from(split.chars, { opacity: 0, y: 80, rotateX: -90, stagger: 0.015, duration: data.duration * 0.7, ease: 'back.out(1.7)' }, 0);
                } else if (sceneNum % 4 === 1) {
                    sceneTl.from(split.words, { opacity: 0, scale: 0.3, filter: 'blur(20px)', stagger: 0.04, duration: data.duration * 0.7, ease: 'expo.out' }, 0);
                } else if (sceneNum % 4 === 2) {
                    sceneTl.from(split.chars, { opacity: 0, x: (i) => (i % 2 === 0 ? -120 : 120), stagger: 0.02, duration: data.duration * 0.7, ease: 'power4.out' }, 0);
                } else {
                    sceneTl.from(split.words, { opacity: 0, y: -60, rotationZ: (i) => (i % 2 === 0 ? 15 : -15), stagger: 0.03, duration: data.duration * 0.7, ease: 'elastic.out(1, 0.5)' }, 0);
                }

                masterTimeline.add(sceneTl, `+=${index === 0 ? 0 : 0}`);
                masterTimeline.to({}, { duration: data.duration });
            });

            // Force total duration to match exactly 60 seconds
            masterTimeline.duration(60);
        }

        initAnimations();

        /* ==========================================================================
           5. UI CONTROLS & EVENT LISTENERS
           ========================================================================== */
        const playPauseBtn = document.getElementById('play-pause-btn');
        const replayBtn = document.getElementById('replay-btn');
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const timelineProgress = document.getElementById('timeline-progress');
        const timelineTrack = document.getElementById('timeline-track');
        const sceneIndicator = document.getElementById('scene-indicator');

        function togglePlay() {
            if (masterTimeline.paused()) {
                masterTimeline.play();
                playPauseBtn.textContent = "PAUSE";
            } else {
                masterTimeline.pause();
                playPauseBtn.textContent = "PLAY";
            }
        }

        playPauseBtn.addEventListener('click', togglePlay);

        replayBtn.addEventListener('click', () => {
            masterTimeline.restart();
            masterTimeline.play();
            playPauseBtn.textContent = "PAUSE";
        });

        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
                fullscreenBtn.textContent = "EXIT [F]";
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                    fullscreenBtn.textContent = "FULLSCREEN [F]";
                }
            }
        });

        masterTimeline.eventCallback("onUpdate", () => {
            const progress = masterTimeline.progress();
            timelineProgress.style.width = `${progress * 100}%`;

            const currentTime = masterTimeline.time();
            let accumulatedTime = 0;
            for (let i = 0; i < scriptData.length; i++) {
                accumulatedTime += scriptData[i].duration;
                if (currentTime <= accumulatedTime) {
                    sceneIndicator.textContent = `SCENE ${String(i + 1).padStart(2, '0')} / ${scriptData.length}`;
                    break;
                }
            }
        });

        timelineTrack.addEventListener('click', (e) => {
            const rect = timelineTrack.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const percentage = clickX / rect.width;
            masterTimeline.progress(percentage);
        });

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                togglePlay();
            } else if (e.code === 'KeyF') {
                fullscreenBtn.click();
            } else if (e.code === 'ArrowRight') {
                masterTimeline.time(Math.min(masterTimeline.duration(), masterTimeline.time() + 3));
            } else if (e.code === 'ArrowLeft') {
                masterTimeline.time(Math.max(0, masterTimeline.time() - 3));
            }
        });

        window.addEventListener('load', () => {
            setTimeout(() => {
                masterTimeline.play();
            }, 500);
        });
    </script>
</body>
</html>
